services:
  web:
    build: ./web
    restart: unless-stopped
    # Coolify/reverse proxies reach this internal port over the Docker network.
    # Publish a host port only by adding compose.host.yaml explicitly.
    expose:
      - "8080"
    environment:
      ENERGYDECK_WEB_ACCESS_CODE: ${ENERGYDECK_WEB_ACCESS_CODE:?Set a random access code of at least 32 characters in .env}
      ENERGYDECK_WEB_SECURE_COOKIE: ${ENERGYDECK_WEB_SECURE_COOKIE:-true}
      ENERGYDECK_WEB_ORIGIN: ${ENERGYDECK_WEB_ORIGIN:-}
      ENERGYDECK_WEB_DEMO: ${ENERGYDECK_WEB_DEMO:-false}
      ENERGYDECK_ENERGY_TAX_EX_VAT_CT: ${ENERGYDECK_ENERGY_TAX_EX_VAT_CT:-9.161}
      ENERGYDECK_VAT_PERCENT: ${ENERGYDECK_VAT_PERCENT:-21}
      ENERGYDECK_SUPPLIER_FEE_INCL_VAT_CT: ${ENERGYDECK_SUPPLIER_FEE_INCL_VAT_CT:-2}
      HOMEY_ADDRESS: ${HOMEY_ADDRESS:-}
      HOMEY_TOKEN: ${HOMEY_TOKEN:-}
      HOMEY_HOMEWIZARD_DEVICE_ID: ${HOMEY_HOMEWIZARD_DEVICE_ID:-}
      HOMEY_ELECTRICITY_SUMMARY_DEVICE_ID: ${HOMEY_ELECTRICITY_SUMMARY_DEVICE_ID:-}
      HOMEY_SOLAR_DEVICE_ID: ${HOMEY_SOLAR_DEVICE_ID:-}
      HOMEY_SOLAR_SUMMARY_DEVICE_ID: ${HOMEY_SOLAR_SUMMARY_DEVICE_ID:-}
      HOMEY_SESSY_DEVICE_ID: ${HOMEY_SESSY_DEVICE_ID:-}
      HOMEY_CHARGER_DEVICE_ID: ${HOMEY_CHARGER_DEVICE_ID:-}
      HOMEY_GAS_SUMMARY_DEVICE_ID: ${HOMEY_GAS_SUMMARY_DEVICE_ID:-}
      HOMEY_PRICES_VARIABLE_ID: ${HOMEY_PRICES_VARIABLE_ID:-}
      HOMEY_CHARGE_FLOW_ID: ${HOMEY_CHARGE_FLOW_ID:-}
      HOMEY_THERMOSTAT_DEVICE_ID: ${HOMEY_THERMOSTAT_DEVICE_ID:-}
      ENERGYDECK_LATITUDE: ${ENERGYDECK_LATITUDE:-}
      ENERGYDECK_LONGITUDE: ${ENERGYDECK_LONGITUDE:-}
      SONOS_BOOTSTRAP_ADDRESS: ${SONOS_BOOTSTRAP_ADDRESS:-}
      SONOS_BOOTSTRAP_FALLBACK_ADDRESS: ${SONOS_BOOTSTRAP_FALLBACK_ADDRESS:-}
      HOMEY_ROOM_THERMOSTAT_1_ID: ${HOMEY_ROOM_THERMOSTAT_1_ID:-}
      HOMEY_ROOM_THERMOSTAT_1_NAME: ${HOMEY_ROOM_THERMOSTAT_1_NAME:-}
      HOMEY_ROOM_THERMOSTAT_2_ID: ${HOMEY_ROOM_THERMOSTAT_2_ID:-}
      HOMEY_ROOM_THERMOSTAT_2_NAME: ${HOMEY_ROOM_THERMOSTAT_2_NAME:-}
      HOMEY_ROOM_THERMOSTAT_3_ID: ${HOMEY_ROOM_THERMOSTAT_3_ID:-}
      HOMEY_ROOM_THERMOSTAT_3_NAME: ${HOMEY_ROOM_THERMOSTAT_3_NAME:-}
      HOMEY_ROOM_THERMOSTAT_4_ID: ${HOMEY_ROOM_THERMOSTAT_4_ID:-}
      HOMEY_ROOM_THERMOSTAT_4_NAME: ${HOMEY_ROOM_THERMOSTAT_4_NAME:-}
      HOMEY_ROOM_THERMOSTAT_5_ID: ${HOMEY_ROOM_THERMOSTAT_5_ID:-}
      HOMEY_ROOM_THERMOSTAT_5_NAME: ${HOMEY_ROOM_THERMOSTAT_5_NAME:-}
      HOMEY_ROOM_THERMOSTAT_6_ID: ${HOMEY_ROOM_THERMOSTAT_6_ID:-}
      HOMEY_ROOM_THERMOSTAT_6_NAME: ${HOMEY_ROOM_THERMOSTAT_6_NAME:-}
      HOMEY_ROOM_THERMOSTAT_7_ID: ${HOMEY_ROOM_THERMOSTAT_7_ID:-}
      HOMEY_ROOM_THERMOSTAT_7_NAME: ${HOMEY_ROOM_THERMOSTAT_7_NAME:-}
      HOMEY_ROOM_THERMOSTAT_8_ID: ${HOMEY_ROOM_THERMOSTAT_8_ID:-}
      HOMEY_ROOM_THERMOSTAT_8_NAME: ${HOMEY_ROOM_THERMOSTAT_8_NAME:-}
      HOMEY_ROOM_THERMOSTAT_9_ID: ${HOMEY_ROOM_THERMOSTAT_9_ID:-}
      HOMEY_ROOM_THERMOSTAT_9_NAME: ${HOMEY_ROOM_THERMOSTAT_9_NAME:-}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
