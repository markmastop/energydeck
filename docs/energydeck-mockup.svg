<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-labelledby="title desc">
  <title id="title">EnergyDeck dashboard mock-up</title>
  <desc id="desc">Portrait energy dashboard with electricity price, consumption, price chart, Sessy battery, EV charging and gas usage.</desc>
  <rect width="480" height="800" rx="18" fill="#0b100d"/>
  <rect x="9" y="9" width="462" height="782" rx="12" fill="#0f1712"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#eef6f0">
    <text x="25" y="33" font-size="12" fill="#98a59c">14:37 · EnergyDeck</text>
    <circle cx="355" cy="29" r="4" fill="#48bd70"/>
    <text x="365" y="33" font-size="11" fill="#98a59c">Homey online</text>

    <text x="25" y="65" font-size="10" font-weight="700" letter-spacing="1" fill="#93a097">CURRENT ENERGY PRICE</text>
    <text x="24" y="111" font-size="47" font-weight="700">24.8</text>
    <text x="139" y="109" font-size="14" font-weight="700" fill="#a8b5ab">ct/kWh</text>
    <text x="25" y="132" font-size="11" fill="#e8b94c">Average · 14:00–14:15</text>

    <circle cx="335" cy="90" r="37" fill="none" stroke="#2c352f" stroke-width="7"/>
    <circle cx="335" cy="90" r="37" fill="none" stroke="#8b51ed" stroke-width="7" stroke-linecap="round" stroke-dasharray="149 233" transform="rotate(-90 335 90)"/>
    <text x="335" y="89" font-size="18" font-weight="700" text-anchor="middle">8.7</text>
    <text x="335" y="105" font-size="9" font-weight="700" text-anchor="middle" fill="#8b51ed">kWh</text>
    <text x="385" y="81" font-size="11" font-weight="700">Energy</text>
    <text x="385" y="95" font-size="11" font-weight="700">today</text>
    <text x="385" y="115" font-size="9" fill="#96a39a">tap for YTD</text>

    <rect x="20" y="149" width="214" height="35" rx="9" fill="#334139"/>
    <rect x="242" y="149" width="218" height="35" rx="9" fill="#1c271f"/>
    <text x="127" y="171" font-size="12" font-weight="700" text-anchor="middle">Today</text>
    <text x="351" y="171" font-size="12" font-weight="700" text-anchor="middle" fill="#a5b1a8">Tomorrow</text>

    <rect x="18" y="194" width="444" height="229" rx="14" fill="#172019" stroke="#29352d"/>
    <text x="32" y="218" font-size="13" font-weight="700">Price forecast</text>
    <text x="445" y="218" font-size="10" text-anchor="end" fill="#8f9b92">10.6–38.9 ct</text>
    <g opacity=".16" stroke="#eef6f0"><line x1="47" y1="245" x2="447" y2="245"/><line x1="47" y1="308" x2="447" y2="308"/><line x1="47" y1="370" x2="447" y2="370"/></g>
    <g>
      <rect x="52" y="316" width="11" height="54" rx="2" fill="#e8b94c"/><rect x="68" y="329" width="11" height="41" rx="2" fill="#45bd70"/><rect x="84" y="340" width="11" height="30" rx="2" fill="#45bd70"/><rect x="100" y="345" width="11" height="25" rx="2" fill="#45bd70"/>
      <rect x="116" y="327" width="11" height="43" rx="2" fill="#45bd70"/><rect x="132" y="317" width="11" height="53" rx="2" fill="#e8b94c"/><rect x="148" y="303" width="11" height="67" rx="2" fill="#e8b94c"/><rect x="164" y="286" width="11" height="84" rx="2" fill="#e8b94c"/>
      <rect x="180" y="267" width="11" height="103" rx="2" fill="#ea665f"/><rect x="196" y="276" width="11" height="94" rx="2" fill="#ea665f"/><rect x="212" y="296" width="11" height="74" rx="2" fill="#e8b94c"/><rect x="228" y="307" width="11" height="63" rx="2" fill="#e8b94c"/>
      <rect x="244" y="315" width="11" height="55" rx="2" fill="#e8b94c"/><rect x="260" y="302" width="11" height="68" rx="2" fill="#e8b94c"/><rect x="276" y="290" width="11" height="80" rx="2" fill="#e8b94c"/><rect x="292" y="279" width="11" height="91" rx="2" fill="#ea665f"/>
      <rect x="308" y="266" width="11" height="104" rx="2" fill="#ea665f"/><rect x="324" y="250" width="11" height="120" rx="2" fill="#ea665f"/><rect x="340" y="243" width="11" height="127" rx="2" fill="#ea665f"/><rect x="356" y="258" width="11" height="112" rx="2" fill="#ea665f"/>
      <rect x="372" y="275" width="11" height="95" rx="2" fill="#ea665f"/><rect x="388" y="291" width="11" height="79" rx="2" fill="#e8b94c"/><rect x="404" y="302" width="11" height="68" rx="2" fill="#e8b94c"/><rect x="420" y="313" width="11" height="57" rx="2" fill="#e8b94c"/>
    </g>
    <line x1="287" y1="238" x2="287" y2="372" stroke="#eef6f0" stroke-width="2" stroke-dasharray="4 4" opacity=".65"/>
    <text x="247" y="402" font-size="10" text-anchor="middle" fill="#7fe0a2">Cheapest 3 hours · 02:00–05:00</text>

    <rect x="18" y="433" width="444" height="82" rx="14" fill="#172019" stroke="#29352d"/>
    <text x="31" y="455" font-size="12" font-weight="700">Sessy home battery</text>
    <text x="447" y="455" font-size="11" text-anchor="end" fill="#48bd70">Charging · 1,240 W</text>
    <rect x="31" y="472" width="350" height="23" rx="6" fill="#2c352f"/>
    <rect x="34" y="475" width="236" height="17" rx="4" fill="#48bd70"/>
    <text x="447" y="493" font-size="22" font-weight="700" text-anchor="end">68%</text>

    <rect x="18" y="525" width="444" height="58" rx="14" fill="#18273d" stroke="#2a4264"/>
    <text x="31" y="548" font-size="12" font-weight="700">EV · ready to charge</text>
    <text x="31" y="567" font-size="10" fill="#a6b7d2">Waiting for cheapest period</text>
    <rect x="320" y="534" width="129" height="40" rx="10" fill="#346ddb"/>
    <text x="384" y="559" font-size="11" font-weight="700" text-anchor="middle">Charge now</text>

    <rect x="18" y="593" width="444" height="174" rx="14" fill="#172019" stroke="#29352d"/>
    <text x="31" y="616" font-size="12" font-weight="700">Gas usage</text>
    <text x="447" y="616" font-size="9" text-anchor="end" fill="#8f9b92">via HomeWizard</text>
    <g fill="none" stroke-width="8">
      <circle cx="99" cy="680" r="36" stroke="#392631"/><circle cx="99" cy="680" r="36" stroke="#ff3d80" stroke-linecap="round" stroke-dasharray="102 226" transform="rotate(-90 99 680)"/>
      <circle cx="240" cy="680" r="36" stroke="#392631"/><circle cx="240" cy="680" r="36" stroke="#ff3d80" stroke-linecap="round" stroke-dasharray="118 226" transform="rotate(-90 240 680)"/>
      <circle cx="381" cy="680" r="36" stroke="#392631"/><circle cx="381" cy="680" r="36" stroke="#ff3d80" stroke-linecap="round" stroke-dasharray="79 226" transform="rotate(-90 381 680)"/>
    </g>
    <text x="99" y="685" font-size="15" font-weight="700" text-anchor="middle">1.8 m³</text><text x="99" y="738" font-size="10" text-anchor="middle" fill="#9aa79e">Today</text>
    <text x="240" y="685" font-size="15" font-weight="700" text-anchor="middle">12.6 m³</text><text x="240" y="738" font-size="10" text-anchor="middle" fill="#9aa79e">This week</text>
    <text x="381" y="685" font-size="15" font-weight="700" text-anchor="middle">42.3 m³</text><text x="381" y="738" font-size="10" text-anchor="middle" fill="#9aa79e">This month</text>
  </g>
</svg>
