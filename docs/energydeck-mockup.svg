<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" role="img" aria-label="EnergyDeck Dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b100d"/>
      <stop offset="100%" stop-color="#070a08"/>
    </linearGradient>
    <linearGradient id="chartGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#45bd70" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#45bd70" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Frame / Bezel -->
  <rect width="480" height="800" rx="20" fill="url(#bg)"/>
  <rect x="8" y="8" width="464" height="784" rx="14" fill="#0f1712"/>

  <!-- Main font & styles -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#eef6f0">
    
    <!-- 1. Header (Shared Energy Header) -->
    <text x="22" y="32" font-size="13" font-weight="600" fill="#a9b8ae">16:42  EnergyDeck</text>
    <circle cx="366" cy="28" r="4.5" fill="#45bd70"/>
    <text x="376" y="32" font-size="12" font-weight="500" fill="#45bd70">Homey online</text>

    <!-- Dynamic Energy Price Title & Source -->
    <text x="22" y="52" font-size="10" font-weight="700" letter-spacing="0.5" fill="#e8b94c">ZONNEPLAN DYNAMISCH</text>
    <text x="22" y="66" font-size="11" font-weight="500" fill="#93a097">Stroom nu · 16:30–16:45</text>
    
    <!-- Big Price Display -->
    <text x="20" y="116" font-size="46" font-weight="800" fill="#eef6f0">22,4</text>
    <text x="122" y="112" font-size="14" font-weight="700" fill="#a8b5ab">ct/kWh</text>

    <!-- Solar / Net Power Dial on Top Right -->
    <circle cx="355" cy="88" r="38" fill="none" stroke="#202c24" stroke-width="7"/>
    <circle cx="355" cy="88" r="38" fill="none" stroke="#e8b94c" stroke-width="7" stroke-linecap="round" stroke-dasharray="160 240" transform="rotate(-90 355 88)"/>
    <text x="355" y="86" font-size="16" font-weight="800" text-anchor="middle" fill="#eef6f0">1,8</text>
    <text x="355" y="101" font-size="10" font-weight="700" text-anchor="middle" fill="#e8b94c">kW zon</text>
    <text x="404" y="80" font-size="11" font-weight="700" fill="#eef6f0">Netto</text>
    <text x="404" y="96" font-size="12" font-weight="700" fill="#7fe0a2">-940 W</text>
    <text x="404" y="113" font-size="9" fill="#93a097">levering</text>

    <text x="22" y="138" font-size="11" font-weight="500" fill="#93a097">Zon op 08:06 · Onder 18:38</text>

    <!-- 2. Price Forecast Card -->
    <!-- Tab buttons: Vandaag / Morgen -->
    <rect x="14" y="152" width="222" height="32" rx="8" fill="#24583b" stroke="#45bd70" stroke-width="1.5"/>
    <text x="125" y="173" font-size="13" font-weight="700" text-anchor="middle" fill="#eef6f0">Vandaag</text>

    <rect x="244" y="152" width="222" height="32" rx="8" fill="#18231e" stroke="#34463c" stroke-width="1"/>
    <text x="355" y="173" font-size="13" font-weight="600" text-anchor="middle" fill="#a9b8ae">Morgen</text>

    <!-- Price Graph Container -->
    <rect x="14" y="192" width="452" height="224" rx="12" fill="#172019" stroke="#29352d" stroke-width="1"/>
    <text x="28" y="215" font-size="13" font-weight="700" fill="#eef6f0">Prijsverloop per kwartier</text>
    <text x="452" y="215" font-size="11" font-weight="600" text-anchor="end" fill="#8f9b92">min 11,2 · max 34,8 ct</text>

    <!-- Grid lines -->
    <g opacity="0.15" stroke="#eef6f0" stroke-width="1">
      <line x1="38" y1="240" x2="452" y2="240"/>
      <line x1="38" y1="295" x2="452" y2="295"/>
      <line x1="38" y1="350" x2="452" y2="350"/>
    </g>

    <!-- 24 sample price bars representing 96 quarter-hours -->
    <g>
      <rect x="42" y="325" width="12" height="40" rx="2" fill="#45bd70"/>
      <rect x="59" y="335" width="12" height="30" rx="2" fill="#45bd70"/>
      <rect x="76" y="342" width="12" height="23" rx="2" fill="#45bd70"/>
      <rect x="93" y="346" width="12" height="19" rx="2" fill="#45bd70"/>
      <rect x="110" y="332" width="12" height="33" rx="2" fill="#45bd70"/>
      <rect x="127" y="305" width="12" height="60" rx="2" fill="#e8b94c"/>
      <rect x="144" y="280" width="12" height="85" rx="2" fill="#e8b94c"/>
      <rect x="161" y="260" width="12" height="105" rx="2" fill="#ea665f"/>
      <rect x="178" y="270" width="12" height="95" rx="2" fill="#ea665f"/>
      <rect x="195" y="295" width="12" height="70" rx="2" fill="#e8b94c"/>
      <rect x="212" y="315" width="12" height="50" rx="2" fill="#45bd70"/>
      <rect x="229" y="325" width="12" height="40" rx="2" fill="#45bd70"/>
      <rect x="246" y="330" width="12" height="35" rx="2" fill="#45bd70"/>
      <rect x="263" y="320" width="12" height="45" rx="2" fill="#45bd70"/>
      <rect x="280" y="300" width="12" height="65" rx="2" fill="#e8b94c"/>
      <rect x="297" y="285" width="12" height="80" rx="2" fill="#e8b94c"/>
      <rect x="314" y="265" width="12" height="100" rx="2" fill="#ea665f"/>
      <rect x="331" y="248" width="12" height="117" rx="2" fill="#ea665f"/>
      <rect x="348" y="240" width="12" height="125" rx="2" fill="#ea665f"/>
      <rect x="365" y="258" width="12" height="107" rx="2" fill="#ea665f"/>
      <rect x="382" y="275" width="12" height="90" rx="2" fill="#e8b94c"/>
      <rect x="399" y="295" width="12" height="70" rx="2" fill="#e8b94c"/>
      <rect x="416" y="312" width="12" height="53" rx="2" fill="#45bd70"/>
      <rect x="433" y="326" width="12" height="39" rx="2" fill="#45bd70"/>
    </g>

    <!-- Current time indicator line -->
    <line x1="320" y1="230" x2="320" y2="370" stroke="#7fe0a2" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="320" y="226" font-size="9" font-weight="700" text-anchor="middle" fill="#7fe0a2">NU</text>

    <!-- Highlighted cheapest window -->
    <rect x="74" y="380" width="170" height="24" rx="6" fill="#24583b" opacity="0.6"/>
    <text x="159" y="396" font-size="10" font-weight="700" text-anchor="middle" fill="#7fe0a2">★ Goedkoopste 3 uur · 02:00–05:00</text>

    <!-- 3. Sessy Home Battery Card -->
    <rect x="14" y="426" width="452" height="78" rx="12" fill="#172019" stroke="#29352d" stroke-width="1"/>
    <text x="28" y="449" font-size="13" font-weight="700" fill="#eef6f0">Sessy thuisbatterij</text>
    <text x="452" y="449" font-size="12" font-weight="600" text-anchor="end" fill="#45bd70">Opladen · 1.050 W</text>
    
    <!-- Battery Level Bar -->
    <rect x="28" y="462" width="354" height="26" rx="6" fill="#202c24"/>
    <rect x="30" y="464" width="272" height="22" rx="4" fill="#45bd70"/>
    <text x="452" y="482" font-size="20" font-weight="800" text-anchor="end" fill="#eef6f0">77%</text>

    <!-- 4. Bottom Compact Card: Gas / Sonos / Klimaat Tabs -->
    <rect x="14" y="514" width="144" height="30" rx="6" fill="#18231e" stroke="#34463c" stroke-width="1"/>
    <text x="86" y="534" font-size="12" font-weight="600" text-anchor="middle" fill="#a9b8ae">Gasverbruik</text>

    <rect x="166" y="514" width="144" height="30" rx="6" fill="#24583b" stroke="#45bd70" stroke-width="1.5"/>
    <text x="238" y="534" font-size="12" font-weight="700" text-anchor="middle" fill="#eef6f0">Sonos</text>

    <rect x="318" y="514" width="148" height="30" rx="6" fill="#18231e" stroke="#34463c" stroke-width="1"/>
    <text x="392" y="534" font-size="12" font-weight="600" text-anchor="middle" fill="#a9b8ae">Klimaat</text>

    <!-- Sonos Compact Player Box -->
    <rect x="14" y="552" width="452" height="234" rx="12" fill="#172019" stroke="#29352d" stroke-width="1"/>

    <!-- Small Album Art -->
    <rect x="26" y="566" width="92" height="92" rx="8" fill="#18231e"/>
    <rect x="26" y="566" width="92" height="92" rx="8" fill="#e3001b"/>
    <text x="72" y="622" font-size="28" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="1">JOE</text>

    <!-- Now Playing Info -->
    <rect x="130" y="566" width="170" height="24" rx="6" fill="#202c24"/>
    <text x="138" y="582" font-size="11" font-weight="700" fill="#7fe0a2">Keuken + Woonkamer</text>
    
    <text x="130" y="612" font-size="17" font-weight="800" fill="#eef6f0">Joe Nederland</text>
    <text x="130" y="632" font-size="13" font-weight="500" fill="#a9b8ae">Good Times, Great Music</text>
    <text x="130" y="652" font-size="11" font-weight="600" fill="#45bd70">Speelt nu af</text>

    <!-- Mini Controls (Right) -->
    <circle cx="430" cy="582" r="18" fill="#24583b" stroke="#45bd70" stroke-width="1"/>
    <text x="430" y="588" font-size="16" font-weight="700" text-anchor="middle" fill="#eef6f0">⏸</text>

    <rect x="360" y="618" width="34" height="34" rx="6" fill="#18231e" stroke="#34463c" stroke-width="1"/>
    <text x="377" y="640" font-size="18" font-weight="700" text-anchor="middle" fill="#eef6f0">-</text>

    <text x="412" y="640" font-size="12" font-weight="700" text-anchor="middle" fill="#a9b8ae">24%</text>

    <rect x="430" y="618" width="34" height="34" rx="6" fill="#18231e" stroke="#34463c" stroke-width="1"/>
    <text x="447" y="640" font-size="18" font-weight="700" text-anchor="middle" fill="#eef6f0">+</text>

    <!-- 5 Quick Favorite Buttons inside compact card -->
    <text x="28" y="682" font-size="11" font-weight="700" fill="#93a097" letter-spacing="0.5">SNELKEUZE FAVORIETEN</text>
    
    <g>
      <rect x="26" y="694" width="82" height="42" rx="6" fill="#18231e" stroke="#45bd70" stroke-width="1.5"/>
      <text x="67" y="720" font-size="12" font-weight="700" text-anchor="middle" fill="#7fe0a2">Joe</text>

      <rect x="114" y="694" width="82" height="42" rx="6" fill="#18231e" stroke="#34463c" stroke-width="1"/>
      <text x="155" y="720" font-size="12" font-weight="600" text-anchor="middle" fill="#eef6f0">Qmusic</text>

      <rect x="202" y="694" width="82" height="42" rx="6" fill="#18231e" stroke="#34463c" stroke-width="1"/>
      <text x="243" y="720" font-size="12" font-weight="600" text-anchor="middle" fill="#eef6f0">Sky Radio</text>

      <rect x="290" y="694" width="82" height="42" rx="6" fill="#18231e" stroke="#34463c" stroke-width="1"/>
      <text x="331" y="720" font-size="12" font-weight="600" text-anchor="middle" fill="#eef6f0">Radio 538</text>

      <rect x="378" y="694" width="76" height="42" rx="6" fill="#18231e" stroke="#34463c" stroke-width="1"/>
      <text x="416" y="720" font-size="12" font-weight="600" text-anchor="middle" fill="#eef6f0">Radio 2</text>
    </g>

    <!-- Tap for detail indicator -->
    <text x="240" y="764" font-size="10" font-weight="500" text-anchor="middle" fill="#7fe0a2">Tik op de kaart voor het volledige Sonos-speler scherm ›</text>

  </g>
</svg>
