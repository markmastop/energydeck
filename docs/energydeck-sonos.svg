      <text x="186" y="709" font-size="13" text-anchor="middle" fill="#7fe0a2">📻</text>
      <text x="208" y="709" font-size="12" font-weight="600" fill="#eef6f0">Sublime</text>

      <rect x="314" y="682" width="146" height="44" rx="6" fill="#18231e" stroke="#34463c" stroke-width="1"/>
      <rect x="320" y="688" width="32" height="32" rx="4" fill="#244434"/>
      <text x="336" y="709" font-size="13" text-anchor="middle" fill="#7fe0a2">📻</text>
      <text x="358" y="709" font-size="12" font-weight="600" fill="#eef6f0">100% NL</text>
    </g>

    <!-- Row 3: y=730 -->
