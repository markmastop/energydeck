      <rect x="164" y="730" width="146" height="44" rx="6" fill="#18231e" stroke="#34463c" stroke-width="1"/>
      <rect x="170" y="736" width="32" height="32" rx="4" fill="#244434"/>
      <text x="186" y="757" font-size="13" text-anchor="middle" fill="#7fe0a2">🎵</text>
      <text x="208" y="757" font-size="12" font-weight="600" fill="#eef6f0">Top 2000</text>

      <rect x="314" y="730" width="146" height="44" rx="6" fill="#18231e" stroke="#34463c" stroke-width="1"/>
      <rect x="320" y="736" width="32" height="32" rx="4" fill="#244434"/>
