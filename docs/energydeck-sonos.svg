    <text x="14" y="515" font-size="19" font-weight="800" fill="#eef6f0">Joe Nederland</text>
    <text x="14" y="540" font-size="14" font-weight="500" fill="#a9b8ae">Sing Along Songs · Goed Gevoel</text>
    <text x="466" y="540" font-size="12" font-weight="700" text-anchor="end" fill="#7fe0a2">Speelt af</text>

