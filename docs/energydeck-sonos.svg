    <rect x="310" y="448" width="156" height="40" rx="8" fill="#18231e" stroke="#34463c" stroke-width="1"/>
    <text x="388" y="473" font-size="13" font-weight="600" text-anchor="middle" fill="#eef6f0">Dempen</text>

