      <rect x="14" y="730" width="146" height="44" rx="6" fill="#18231e" stroke="#34463c" stroke-width="1"/>
      <rect x="20" y="736" width="32" height="32" rx="4" fill="#244434"/>
      <text x="36" y="757" font-size="13" text-anchor="middle" fill="#7fe0a2">📻</text>
