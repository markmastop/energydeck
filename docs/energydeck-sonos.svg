      <rect x="320" y="640" width="32" height="32" rx="4" fill="#244434"/>
      <text x="336" y="661" font-size="13" text-anchor="middle" fill="#7fe0a2">📻</text>
      <text x="358" y="661" font-size="12" font-weight="600" fill="#eef6f0">RADIONL</text>
    </g>

