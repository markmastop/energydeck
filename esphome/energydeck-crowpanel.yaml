esphome:
  name: energydeck
  friendly_name: EnergyDeck
  min_version: 2026.8.0
  on_boot:
    # Run only after the I2C bus and its backlight controller are initialized.
    - priority: -100
      then:
        # CrowPanel Advance V1.2/V1.3: 0 is maximum brightness, 245 is off.
        - lambda: |-
            const uint8_t brightness = ${backlight_day_brightness};
            id(current_backlight_brightness) = brightness;
            id(backlight_controller).write(&brightness, 1);
    - priority: -100
      then:
        - wait_until:
            condition:
              wifi.connected:
            timeout: 30s
        - delay: 1s
        - script.execute: refresh_homey_prices
        - script.wait: refresh_homey_prices
        - delay: 500ms
        - script.execute: refresh_homey_electricity_day
        - script.wait: refresh_homey_electricity_day
        - delay: 500ms
        - script.execute: refresh_homey_solar_day
        - script.wait: refresh_homey_solar_day
        - delay: 500ms
        - script.execute: refresh_homey_gas
        - script.wait: refresh_homey_gas
        - delay: 500ms
        - script.execute: refresh_homey_weather
        - script.wait: refresh_homey_weather
        # This device-specific boot list replaces package boot automations.
        # Start the external forecasts explicitly after network/time are ready.
        - wait_until:
            condition:
              lambda: return id(energydeck_time).now().is_valid();
            timeout: 90s
        - script.execute: refresh_rain
        - script.wait: refresh_rain
        - delay: 500ms
        - script.execute: refresh_temperature_trend

substitutions:
  <<: !include translations/nl.yaml
  homey_address: !env_var HOMEY_ADDRESS
  homey_token: !env_var HOMEY_TOKEN
  homey_prices_variable_id: !env_var HOMEY_PRICES_VARIABLE_ID
  homey_charge_flow_id: !env_var HOMEY_CHARGE_FLOW_ID
  homey_charger_device_id: !env_var HOMEY_CHARGER_DEVICE_ID
  homey_sessy_device_id: !env_var HOMEY_SESSY_DEVICE_ID
  homey_homewizard_device_id: !env_var HOMEY_HOMEWIZARD_DEVICE_ID
  homey_electricity_summary_device_id: !env_var HOMEY_ELECTRICITY_SUMMARY_DEVICE_ID
  homey_gas_summary_device_id: !env_var HOMEY_GAS_SUMMARY_DEVICE_ID
  homey_solar_device_id: !env_var HOMEY_SOLAR_DEVICE_ID
  homey_solar_summary_device_id: !env_var HOMEY_SOLAR_SUMMARY_DEVICE_ID
  energy_tax_ex_vat_ct: !env_var ENERGYDECK_ENERGY_TAX_EX_VAT_CT
  vat_percent: !env_var ENERGYDECK_VAT_PERCENT
  supplier_fee_incl_vat_ct: !env_var ENERGYDECK_SUPPLIER_FEE_INCL_VAT_CT
  energydeck_latitude: !env_var ENERGYDECK_LATITUDE
  energydeck_longitude: !env_var ENERGYDECK_LONGITUDE
  homey_room_thermostat_1_id: !env_var HOMEY_ROOM_THERMOSTAT_1_ID none
  evohome_zone_1_name: !env_var HOMEY_ROOM_THERMOSTAT_1_NAME Woonkamer
  homey_room_thermostat_2_id: !env_var HOMEY_ROOM_THERMOSTAT_2_ID none
  evohome_zone_2_name: !env_var HOMEY_ROOM_THERMOSTAT_2_NAME Aanbouw
  homey_room_thermostat_3_id: !env_var HOMEY_ROOM_THERMOSTAT_3_ID none
  evohome_zone_3_name: !env_var HOMEY_ROOM_THERMOSTAT_3_NAME Lieke
  homey_room_thermostat_4_id: !env_var HOMEY_ROOM_THERMOSTAT_4_ID none
  evohome_zone_4_name: !env_var HOMEY_ROOM_THERMOSTAT_4_NAME Saar
  homey_room_thermostat_5_id: !env_var HOMEY_ROOM_THERMOSTAT_5_ID none
  evohome_zone_5_name: !env_var HOMEY_ROOM_THERMOSTAT_5_NAME Werk Renate
  homey_room_thermostat_6_id: !env_var HOMEY_ROOM_THERMOSTAT_6_ID none
  evohome_zone_6_name: !env_var HOMEY_ROOM_THERMOSTAT_6_NAME Werk Mark
  homey_room_thermostat_7_id: !env_var HOMEY_ROOM_THERMOSTAT_7_ID none
  evohome_zone_7_name: !env_var HOMEY_ROOM_THERMOSTAT_7_NAME Badkamer
  homey_room_thermostat_8_id: !env_var HOMEY_ROOM_THERMOSTAT_8_ID none
  evohome_zone_8_name: !env_var HOMEY_ROOM_THERMOSTAT_8_NAME Badkamer vl
  homey_room_thermostat_9_id: !env_var HOMEY_ROOM_THERMOSTAT_9_ID none
  evohome_zone_9_name: !env_var HOMEY_ROOM_THERMOSTAT_9_NAME Bijkeuken
  homey_thermostat_device_id: !env_var HOMEY_THERMOSTAT_DEVICE_ID none
  sonos_bootstrap_address: !env_var SONOS_BOOTSTRAP_ADDRESS http://192.168.0.190:1400
  sonos_bootstrap_fallback_address: !env_var SONOS_BOOTSTRAP_FALLBACK_ADDRESS http://192.168.0.191:1400
  backlight_day_brightness: !env_var ENERGYDECK_BACKLIGHT_DAY_BRIGHTNESS 48
  backlight_night_brightness: !env_var ENERGYDECK_BACKLIGHT_NIGHT_BRIGHTNESS 160
  backlight_night_start_hour: !env_var ENERGYDECK_BACKLIGHT_NIGHT_START_HOUR 23
  backlight_night_end_hour: !env_var ENERGYDECK_BACKLIGHT_NIGHT_END_HOUR 7
  backlight_wake_duration_s: !env_var ENERGYDECK_BACKLIGHT_WAKE_DURATION_S 30

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # RGB scanout and LVGL's portrait rotation share PSRAM bandwidth. Match
      # ELECROW's larger data cache and use 64-byte lines for framebuffer traffic.
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: y
      # Make normal malloc/new allocations PSRAM-aware. Direct all general
      # allocations of any size to PSRAM (ALWAYSINTERNAL: "0"), preserving internal
      # SRAM strictly for DMA buffers, lwIP sockets, and task stacks.
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "0"
      # The two workers add 24 KiB of internal task stacks. Preserve a 128 KiB
      # dedicated pool for stacks, sockets and AES-DMA alongside ordinary malloc.
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "131072"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      # Cover HTTPS setup failed with MBEDTLS_ERR_SSL_ALLOC_FAILED (-0x7F00).
      # TLS otherwise uses internal RAM even when normal malloc uses PSRAM.
      CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC: n
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      # AES-DMA still fails to allocate internal buffers during cover HTTPS
      # with PSRAM-backed TLS. Software AES runs on the low-priority worker and
      # avoids those DMA staging allocations without changing TLS verification.
      CONFIG_MBEDTLS_HARDWARE_AES: n
      # Optimize for execution speed (-O2) instead of binary size (-Os).
      CONFIG_COMPILER_OPTIMIZATION_PERF: y
      CONFIG_COMPILER_OPTIMIZATION_SIZE: n

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0

ui_performance:
  display_id: energydeck_display

wifi:
  ssid: !env_var ENERGYDECK_WIFI_SSID
  password: !env_var ENERGYDECK_WIFI_PASSWORD
  power_save_mode: none

ota:
  - platform: esphome

i2c:
  id: energydeck_i2c
  sda: 15
  scl: 16
  frequency: 400kHz
  scan: true

i2c_device:
  - id: backlight_controller
    address: 0x30

time:
  - platform: sntp
    id: energydeck_time
    timezone: Europe/Amsterdam
    on_time_sync:
      then:
        - script.execute: update_clock
        # The first Homey response can arrive before SNTP knows the local
        # time, which would otherwise select the 00:00 price interval.
        - script.execute: refresh_homey_prices
        - script.execute: update_display_backlight

display:
  # The ST7262 panel is driven directly over its 16-bit RGB interface.
  - platform: rpi_dpi_rgb
    id: energydeck_display
    dimensions:
      width: 800
      height: 480
    color_order: RGB
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false
    de_pin: 42
    hsync_pin: 40
    vsync_pin: 41
    pclk_pin: 39
    pclk_frequency: 20MHz
    pclk_inverted: true
    hsync_pulse_width: 4
    hsync_front_porch: 8
    hsync_back_porch: 8
    vsync_pulse_width: 4
    vsync_front_porch: 8
    vsync_back_porch: 8
    data_pins:
      red: [7, 17, 18, 3, 46]
      green: [9, 10, 11, 12, 13, 14]
      blue: [21, 47, 48, 45, 38]

touchscreen:
  - platform: gt911
    id: energydeck_touch
    display: energydeck_display
    # Track drags at 50 Hz; the default 50 ms polling visibly steps room scrolling.
    update_interval: 20ms
    on_touch:
      - lambda: |-
          id(last_screen_touch_ms) = millis();
          if (id(current_backlight_brightness) != ${backlight_day_brightness}) {
            id(update_display_backlight).execute();
          }

globals:
  - id: last_screen_touch_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: current_backlight_brightness
    type: uint8_t
    restore_value: no
    initial_value: "255"

interval:
  - interval: 5s
    then:
      - script.execute: update_display_backlight

script:
  - id: set_display_brightness
    parameters:
      target: int
    mode: restart
    then:
      - lambda: |-
          const uint8_t b = static_cast<uint8_t>(std::clamp(target, 0, 245));
          if (b != id(current_backlight_brightness)) {
            id(current_backlight_brightness) = b;
            id(backlight_controller).write(&b, 1);
            ESP_LOGD("backlight", "Backlight set to %u (day=${backlight_day_brightness}, night=${backlight_night_brightness})", b);
          }

  - id: update_display_backlight
    mode: restart
    then:
      - lambda: |-
          const bool time_valid = id(energydeck_time).now().is_valid();
          const int hour = time_valid ? id(energydeck_time).now().hour : 12;
          const int night_start = ${backlight_night_start_hour};
          const int night_end = ${backlight_night_end_hour};
          const bool is_night = (night_start > night_end)
            ? (hour >= night_start || hour < night_end)
            : (hour >= night_start && hour < night_end);

          int target = ${backlight_day_brightness};
          if (is_night) {
            const uint32_t now = millis();
            const uint32_t elapsed = (now >= id(last_screen_touch_ms)) ? (now - id(last_screen_touch_ms)) : 0;
            if (elapsed < (${backlight_wake_duration_s} * 1000ULL)) {
              target = ${backlight_day_brightness};
            } else {
              target = ${backlight_night_brightness};
            }
          }
          id(set_display_brightness).execute(target);

packages:
  energy_details: !include packages/energy-details.yaml
  energy_history: !include packages/energy-history.yaml
  climate: !include packages/climate.yaml
  music: !include packages/music.yaml
  temperature: !include packages/temperature.yaml
  rain: !include packages/rain.yaml
  dashboard: !include packages/dashboard.yaml
  homey_live: !include packages/homey-live.yaml
  sun_times: !include packages/sun-times.yaml

# Rotate the landscape LCD into the 480x800 portrait dashboard coordinate space.
lvgl:
  displays: energydeck_display
  # ESPHome rounds buffer sizes to 100/50/25/12.5%. Its smallest supported
  # chunk halves both draw/rotation buffers and reduces strided PSRAM traffic.
  buffer_size: 12.5%
  rotation: 90
  touchscreens:
    - energydeck_touch
