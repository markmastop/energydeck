esphome:
  name: energydeck-simulator
  friendly_name: EnergyDeck Simulator

# Change nl.yaml to en.yaml to switch the entire dashboard language.
substitutions:
  <<: !include translations/nl.yaml
  homey_address: !env_var HOMEY_ADDRESS
  homey_token: !env_var HOMEY_TOKEN
  homey_prices_variable_id: !env_var HOMEY_PRICES_VARIABLE_ID
  homey_charge_flow_id: !env_var HOMEY_CHARGE_FLOW_ID
  homey_charger_device_id: !env_var HOMEY_CHARGER_DEVICE_ID
  homey_sessy_device_id: !env_var HOMEY_SESSY_DEVICE_ID
  homey_homewizard_device_id: !env_var HOMEY_HOMEWIZARD_DEVICE_ID
  homey_electricity_summary_device_id: !env_var HOMEY_ELECTRICITY_SUMMARY_DEVICE_ID
  homey_gas_summary_device_id: !env_var HOMEY_GAS_SUMMARY_DEVICE_ID
  homey_solar_device_id: !env_var HOMEY_SOLAR_DEVICE_ID
  homey_solar_summary_device_id: !env_var HOMEY_SOLAR_SUMMARY_DEVICE_ID
  energy_tax_ex_vat_ct: !env_var ENERGYDECK_ENERGY_TAX_EX_VAT_CT
  vat_percent: !env_var ENERGYDECK_VAT_PERCENT
  supplier_fee_incl_vat_ct: !env_var ENERGYDECK_SUPPLIER_FEE_INCL_VAT_CT
  energydeck_latitude: !env_var ENERGYDECK_LATITUDE
  energydeck_longitude: !env_var ENERGYDECK_LONGITUDE
  homey_climate_sensor_1_device_id: !env_var HOMEY_CLIMATE_SENSOR_1_DEVICE_ID e5705cd4-ca02-4cdc-816f-4bc5fc4f5432
  homey_climate_sensor_2_device_id: !env_var HOMEY_CLIMATE_SENSOR_2_DEVICE_ID 564a9710-c503-4d04-9996-6c27b5f28157
  homey_climate_sensor_3_device_id: !env_var HOMEY_CLIMATE_SENSOR_3_DEVICE_ID 0d278a3e-aeb7-4cb3-bb2d-131766931482
  homey_climate_sensor_4_device_id: !env_var HOMEY_CLIMATE_SENSOR_4_DEVICE_ID ed3cdd0e-2562-453a-a381-5c7d72bdf871
  homey_climate_sensor_5_device_id: !env_var HOMEY_CLIMATE_SENSOR_5_DEVICE_ID b4a69ec5-a37b-4617-b490-d4c7b74534b9
  homey_climate_sensor_6_device_id: !env_var HOMEY_CLIMATE_SENSOR_6_DEVICE_ID fae4c622-df59-4e18-8722-53fc9eb1cfb0
  climate_sensor_1_name: !env_var HOMEY_CLIMATE_SENSOR_1_NAME Woonkamer
  climate_sensor_2_name: !env_var HOMEY_CLIMATE_SENSOR_2_NAME Aanbouw
  climate_sensor_3_name: !env_var HOMEY_CLIMATE_SENSOR_3_NAME Lieke
  climate_sensor_4_name: !env_var HOMEY_CLIMATE_SENSOR_4_NAME Saar
  climate_sensor_5_name: !env_var HOMEY_CLIMATE_SENSOR_5_NAME Werk Renate
  climate_sensor_6_name: !env_var HOMEY_CLIMATE_SENSOR_6_NAME Werk Mark
  sonos_bootstrap_address: !env_var SONOS_BOOTSTRAP_ADDRESS http://192.168.0.190:1400
  sonos_bootstrap_fallback_address: !env_var SONOS_BOOTSTRAP_FALLBACK_ADDRESS http://192.168.0.191:1400

host:

logger:

time:
  - platform: host
    id: energydeck_time
    timezone: Europe/Amsterdam
    on_time_sync:
      then:
        - script.execute: update_clock
        - script.execute: refresh_homey_prices

display:
  - platform: sdl
    id: energydeck_display
    dimensions:
      width: 480
      height: 800
    auto_clear_enabled: false
    update_interval: never
    window_options:
      resizable: false

touchscreen:
  - platform: sdl
    id: energydeck_touch

packages:
  climate: !include packages/climate.yaml
  music: !include packages/music.yaml
  temperature: !include packages/temperature.yaml
  rain: !include packages/rain.yaml
  dashboard: !include packages/dashboard.yaml
  homey_live: !include packages/homey-live.yaml
  sun_times: !include packages/sun-times.yaml

lvgl:
  displays:
    - energydeck_display
  touchscreens:
    - energydeck_touch
