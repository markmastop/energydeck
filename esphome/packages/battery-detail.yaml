globals:
  - id: battery_detail_selected
    type: uint32_t
    initial_value: '0'

interval:
  - interval: 1s
    then:
      - script.execute: render_battery_detail

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // The LVGL focus/pressed theme can draw a frame despite border_width: 0.
          // Keep the 44px touch target while making every arrow state flat.
          for (auto state : {LV_STATE_DEFAULT, LV_STATE_PRESSED, LV_STATE_FOCUSED, LV_STATE_FOCUS_KEY,
              static_cast<lv_state_t>(LV_STATE_FOCUSED | LV_STATE_PRESSED),
              static_cast<lv_state_t>(LV_STATE_FOCUSED | LV_STATE_FOCUS_KEY)}) {
            lv_obj_set_style_border_width(id(battery_detail_back), 0, state);
            lv_obj_set_style_outline_width(id(battery_detail_back), 0, state);
            lv_obj_set_style_shadow_width(id(battery_detail_back), 0, state);
            lv_obj_set_style_bg_opa(id(battery_detail_back), LV_OPA_TRANSP, state);
          }
          // The battery card has no embedded controls. Let all child labels,
          // bars and forecast marks pass taps through to its single action.
          auto passthrough = [](auto &&self, lv_obj_t *parent) -> void {
            for (uint32_t i = 0; i < lv_obj_get_child_count(parent); i++) {
              auto *child = lv_obj_get_child(parent, i);
              lv_obj_remove_flag(child, LV_OBJ_FLAG_CLICKABLE);
              self(self, child);
            }
          };
          passthrough(passthrough, id(battery_card));

script:
  - id: open_battery_page
    then:
      - lambda: |-
          id(music_page_open) = false;
          id(detail_page_open) = 3;
          id(battery_detail_selected) = 0;
          lv_obj_set_parent(id(shared_energy_header), id(battery_page)->obj);
          lv_obj_set_pos(id(shared_energy_header), 0, 0);
      - lvgl.page.show: battery_page
      - lambda: lv_obj_update_layout(id(battery_page)->obj);
      - script.execute: render_battery_detail

  - id: battery_detail_select_point
    then:
      - lambda: |-
          auto &p = id(battery_plan);
          if (p.version != 2 || !p.interval_count || !lv_indev_active()) return;
          lv_point_t point; lv_indev_get_point(lv_indev_active(), &point);
          lv_area_t area; lv_obj_get_coords(id(battery_detail_price_plot), &area);
          const float fraction = std::max(0.0f, std::min(1.0f, float(point.x - area.x1) / lv_obj_get_width(id(battery_detail_price_plot))));
          const auto clock=id(energydeck_time).now(); const auto &history=id(battery_soc_history);
          const bool fresh=history.available(clock.year*10000+clock.month*100+clock.day_of_month,clock.timestamp);
          const energydeck::BatteryDetailGeometry g(p,fresh ? history.day_start : 0,&id(battery_detail_prices));
          const uint32_t from=g.from, until=g.until;
          id(battery_detail_selected) = std::min(until - 1, from + uint32_t(fraction * (until - from)));
      - script.execute: render_battery_detail

  - id: render_battery_detail
    then:
      - lambda: |-
          if (id(detail_page_open) != 3) return;
          using namespace esphome::ui_performance;
          const auto clock = id(energydeck_time).now();
          auto &p = id(battery_plan);
          char date[11]; snprintf(date, sizeof(date), "%04d-%02d-%02d", clock.year, clock.month, clock.day_of_month);
          const bool valid = clock.is_valid() && p.version == 2 && p.valid(millis(), clock.timestamp, date);
          static energydeck::BatteryDetailChart chart;
          chart.attach(id(battery_detail_price_plot), id(battery_detail_power_plot), id(battery_detail_sun_plot));
          const auto &state = id(energy_state);
          const float actual = state.battery_power.valid(millis()) ? state.battery_power.value : NAN;
          const auto &history=id(battery_soc_history);
          const bool history_known=clock.is_valid() && history.available(clock.year*10000+clock.month*100+clock.day_of_month,clock.timestamp);
          chart.draw(valid ? &p : nullptr, clock.timestamp, id(battery_detail_selected), actual, history_known ? &history : nullptr,
                     state.battery.valid(millis()) ? state.battery.value : NAN, &id(battery_detail_prices), id(battery_detail_price_revision));
          if (state.battery.valid(millis()) && std::isfinite(actual)) set_text_fmt(id(battery_detail_live), "${battery_detail_measured}", actual>20 ? "${battery_action_discharge}" : actual < -20 ? "${battery_action_charge}" : "${battery_action_hold}", std::abs(actual), state.battery.value);
          else set_text(id(battery_detail_live), "${battery_unavailable}");
          if (!valid) {
            set_text(id(battery_detail_status), "${battery_plan_unavailable}");
            set_text(id(battery_detail_chosen), "${battery_plan_unavailable}");
            set_text(id(battery_detail_predicted), "");
            lv_obj_add_state(id(battery_detail_slider), LV_STATE_DISABLED);
            return;
          }
          lv_obj_remove_state(id(battery_detail_slider), LV_STATE_DISABLED);
          const energydeck::BatteryDetailGeometry g(p,history_known ? history.day_start : 0,&id(battery_detail_prices));
          set_text(id(battery_detail_price_title),g.from<p.intervals[0].from && !id(battery_detail_prices).count ? "${battery_detail_prices_missing}" : "${battery_detail_prices}");
          const uint32_t selected=g.selection(id(battery_detail_selected),clock.timestamp);
          const int index=p.current(selected);
          auto stamp = [&](uint32_t epoch) {
            const auto at = ESPTime::from_epoch_local(epoch); char text[24];
            if (at.day_of_month == clock.day_of_month && at.month == clock.month) snprintf(text, sizeof(text), "%02d:%02d", at.hour, at.minute);
            else snprintf(text, sizeof(text), "%02d/%02d %02d:%02d", at.day_of_month, at.month, at.hour, at.minute);
            return std::string(text);
          };
          const float price=g.price_at(selected,&id(battery_detail_prices));
          if(std::isfinite(price)) set_text_fmt(id(battery_detail_chosen), "${battery_detail_chosen}", stamp(selected).c_str(), price);
          else set_text_fmt(id(battery_detail_chosen), "${battery_detail_unknown_price}", stamp(selected).c_str());
          if(index>=0 && selected>=clock.timestamp) {
            const auto &q=p.intervals[index];
            const char *action=q.action==1 ? "${battery_action_charge}" : q.action==2 ? "${battery_action_discharge}" : "${battery_action_hold}";
            set_text_fmt(id(battery_detail_predicted), "${battery_detail_predicted}", action, std::abs(q.watts)/1000, energydeck::BatteryStrategyWindow::soc(q,selected));
          } else {
            const float soc=energydeck::BatteryDetailGeometry::measured_soc(history_known ? &history : nullptr,selected);
            if(std::isfinite(soc)) set_text_fmt(id(battery_detail_predicted), "${battery_detail_historical}", soc);
            else set_text(id(battery_detail_predicted), "${battery_detail_history_missing}");
          }
          set_text(id(battery_detail_status), p.shadow ? "${battery_detail_assumptions}" : "${battery_forward_active}");
          if (index>=0 && p.intervals[index].ev != 0) set_text(id(battery_detail_status), "${battery_forward_ev}");
          if (p.at_risk) set_text(id(battery_detail_status), "${battery_forward_risk}");
          if (p.execution_known) set_text(id(battery_detail_status), id(battery_control_message).c_str());
          lv_slider_set_range(id(battery_detail_slider),0,(g.until-g.from)/60);
          if (!lv_obj_has_state(id(battery_detail_slider), LV_STATE_PRESSED)) lv_slider_set_value(id(battery_detail_slider),(selected-g.from)/60,LV_ANIM_OFF);
          // Local six/twelve-hour ticks remain on civil hours across DST changes.
          lv_obj_t *ticks[2][5] = {
            {id(battery_detail_price_tick_0),id(battery_detail_price_tick_1),id(battery_detail_price_tick_2),id(battery_detail_price_tick_3),id(battery_detail_price_tick_4)},
            {id(battery_detail_power_tick_0),id(battery_detail_power_tick_1),id(battery_detail_power_tick_2),id(battery_detail_power_tick_3),id(battery_detail_power_tick_4)}};
          for(auto &row:ticks) for(auto *label:row) lv_obj_add_flag(label,LV_OBJ_FLAG_HIDDEN);
          const int step=g.until-g.from>30*3600 ? 12 : 6;
          int tick=0;
          for(uint32_t at=(g.from/3600)*3600; at<=g.until && tick<5; at+=3600) {
            const auto t=ESPTime::from_epoch_local(at);
            if(at<g.from || t.hour%step || t.minute) continue;
            char text[20];
            if(t.hour==0) snprintf(text,sizeof(text),"%02d/%02d",t.day_of_month,t.month);
            else snprintf(text,sizeof(text),"%02d:00",t.hour);
            const int x=g.x(at,404);
            for(auto &row:ticks) {
              auto *label=row[tick]; set_text(label,text);
              lv_obj_set_x(label,42+std::max(0,std::min(324,x-40)));
              lv_obj_set_style_text_align(label,x<40 ? LV_TEXT_ALIGN_LEFT : x>364 ? LV_TEXT_ALIGN_RIGHT : LV_TEXT_ALIGN_CENTER,0);
              lv_obj_clear_flag(label,LV_OBJ_FLAG_HIDDEN);
            }
            tick++;
          }
          set_text_fmt(id(battery_detail_price_high), "%.0f", g.high);
          set_text_fmt(id(battery_detail_price_low), "%.0f", g.low);
