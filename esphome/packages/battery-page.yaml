    on_release:
    - lambda: "auto &p = id(battery_plan);\nif (p.version == 2 && p.interval_count)\
        \ {\n  const int index = std::max(0, std::min(static_cast<int>(p.interval_count)\
        \ - 1, int(lv_slider_get_value(id(battery_detail_slider)))));\n  id(battery_detail_selected)\
        \ = p.intervals[index].from;\n}"
    - script.execute: render_battery_detail
