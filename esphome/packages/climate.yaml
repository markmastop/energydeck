      - lambda: |-
          auto &s = id(energy_state);
          int configured = 0, valid = 0;
          for (int i = 0; i < s.ROOM_COUNT; ++i) {
            if (!s.room_configured[i]) continue;
            ++configured;
            if (s.room_temperature[i].valid(millis(), s.CLIMATE_TTL) && s.room_target[i].valid(millis(), s.CLIMATE_TTL)) ++valid;
          }
          ESP_LOGI("evohome", "Controller %s: %d/%d zones valid, demand state %d", id(thermostat_mode_text).c_str(), valid, configured, static_cast<int>(s.climate_status(millis())));

  - id: render_climate
    then:
      - lambda: |-
          using namespace esphome::ui_performance;
          auto &s = id(energy_state);
          const uint32_t now = millis();
          const char *zones[] = {"${homey_room_thermostat_1_id}", "${homey_room_thermostat_2_id}", "${homey_room_thermostat_3_id}", "${homey_room_thermostat_4_id}", "${homey_room_thermostat_5_id}", "${homey_room_thermostat_6_id}", "${homey_room_thermostat_7_id}", "${homey_room_thermostat_8_id}", "${homey_room_thermostat_9_id}"};
          lv_obj_t *slots[] = {id(climate_sensor_1_slot), id(climate_sensor_2_slot), id(climate_sensor_3_slot), id(climate_sensor_4_slot), id(climate_sensor_5_slot), id(climate_sensor_6_slot), id(climate_sensor_7_slot), id(climate_sensor_8_slot), id(climate_sensor_9_slot)};
          lv_obj_t *compact[] = {id(climate_sensor_1_value), id(climate_sensor_2_value), id(climate_sensor_3_value), id(climate_sensor_4_value), id(climate_sensor_5_value), id(climate_sensor_6_value), id(climate_sensor_7_value), id(climate_sensor_8_value), id(climate_sensor_9_value)};
          lv_obj_t *cards[] = {id(room_1_card), id(room_2_card), id(room_3_card), id(room_4_card), id(room_5_card), id(room_6_card), id(room_7_card), id(room_8_card), id(room_9_card)};
          lv_obj_t *names[] = {id(room_1_name), id(room_2_name), id(room_3_name), id(room_4_name), id(room_5_name), id(room_6_name), id(room_7_name), id(room_8_name), id(room_9_name)};
          lv_obj_t *temperatures[] = {id(room_1_temperature), id(room_2_temperature), id(room_3_temperature), id(room_4_temperature), id(room_5_temperature), id(room_6_temperature), id(room_7_temperature), id(room_8_temperature), id(room_9_temperature)};
          lv_obj_t *targets[] = {id(room_1_target), id(room_2_target), id(room_3_target), id(room_4_target), id(room_5_target), id(room_6_target), id(room_7_target), id(room_8_target), id(room_9_target)};
          lv_obj_t *demands[] = {id(room_1_demand), id(room_2_demand), id(room_3_demand), id(room_4_demand), id(room_5_demand), id(room_6_demand), id(room_7_demand), id(room_8_demand), id(room_9_demand)};
          for (int i = 0; i < s.ROOM_COUNT; ++i) {
            s.room_configured[i] = *zones[i] && strcmp(zones[i], "none");
            for (auto *widget : {slots[i], cards[i], names[i], temperatures[i], targets[i], demands[i]}) {
              if (s.room_configured[i]) lv_obj_clear_flag(widget, LV_OBJ_FLAG_HIDDEN);
              else lv_obj_add_flag(widget, LV_OBJ_FLAG_HIDDEN);
            }
            const bool measured = s.room_temperature[i].valid(now, s.CLIMATE_TTL);
            const bool target = s.room_target[i].valid(now, s.CLIMATE_TTL);
            const bool demand = s.room_requests_heat(i, now);
            const auto color = lv_color_hex(demand ? s.ICON_ORANGE : 0xEEF6F0);
            if (measured && target) set_text_fmt(compact[i], "%.1f/%.1f°", s.room_temperature[i].value, s.room_target[i].value);
            else if (measured) set_text_fmt(compact[i], "%.1f/--°", s.room_temperature[i].value);
            else set_text(compact[i], "-- / --°");
            set_style_text_color(compact[i], color, LV_PART_MAIN);
            if (id(detail_page_open) != 2) continue;
            if (measured) set_text_fmt(temperatures[i], "%.1f °C", s.room_temperature[i].value);
            else set_text(temperatures[i], "-- °C");
            if (target) set_text_fmt(targets[i], "${climate_target_format}", s.room_target[i].value);
            else set_text(targets[i], "${climate_target_unknown}");
            const bool enabled = s.heating_enabled.valid(now, s.CLIMATE_TTL);
            set_text(demands[i], !enabled || !measured || !target ? "--" : s.heating_enabled.value <= 0 ? "${thermostat_off}" : demand ? "${climate_heat_demand}" : "${climate_at_target}");
            set_style_text_color(demands[i], color, LV_PART_MAIN);
            set_style_border_color(cards[i], lv_color_hex(demand ? s.ICON_ORANGE : 0x34463C), LV_PART_MAIN);
          }
          const auto status = s.climate_status(now);
          const char *summary = status == s.HEAT_OFF ? "${thermostat_off}" : status == s.HEAT_DEMAND ? "${climate_heat_demand}" : status == s.HEAT_IDLE ? "${climate_no_demand}" : "${climate_heat_unknown}";
          set_text(id(compact_climate_status), summary);
          set_style_text_color(id(compact_climate_status), lv_color_hex(s.heating_icon_color(now)), LV_PART_MAIN);
          if (id(detail_page_open) != 2) return;
          set_text(id(thermostat_mode), s.heating_enabled.valid(now, s.CLIMATE_TTL) ? id(thermostat_mode_text).c_str() : "--");
          set_text(id(thermostat_heat_state), summary);
          set_style_text_color(id(thermostat_heat_state), lv_color_hex(s.heating_icon_color(now)), LV_PART_MAIN);
