# Only EvoTouch controller and Evohome zone devices are read for climate.
interval:
  - interval: 30s
    startup_delay: 20s
    then:
      - script.execute: refresh_climate

script:
  - id: refresh_climate
    mode: single
    then:
      - if:
          condition:
            lambda: return strlen("${homey_thermostat_device_id}") > 0 && strcmp("${homey_thermostat_device_id}", "none") != 0;
          then:
            - background_http.get:
                url: "${homey_address}/api/manager/devices/device/${homey_thermostat_device_id}"
                request_headers:
                  Authorization: "Bearer ${homey_token}"
                  Accept: "application/json"
                capture_response: true
                max_response_buffer_size: 16384
                on_response:
                  then:
                    - lambda: |-
                        id(thermostat_mode_text) = "--";
                        id(energy_state).heating_enabled.set(NAN, millis());
                        json::parse_json(response->status_code == 200 ? body : "{}", [](JsonObject device) -> bool {
                          if (device["available"].is<bool>() && !device["available"].as<bool>()) return false;
                          const char *driver = device["driverId"] | "";
                          if (strcmp(driver, "homey:app:com.honeywell:thermostat")) return false;
                          const char *mode = device["capabilitiesObj"]["honeywell_thermostat_mode"]["value"] | "";
                          const std::string raw = mode;
                          const char *text = raw == "Auto" ? "${thermostat_auto}" : raw == "HeatingOff" ? "${thermostat_off}" : raw == "Away" ? "${thermostat_away}" : raw == "AutoWithEco" ? "${thermostat_eco}" : raw == "Custom" ? "${thermostat_custom}" : raw == "DayOff" ? "${thermostat_day_off}" : nullptr;
                          if (!text) return false;
                          id(thermostat_mode_text) = text;
                          id(thermostat_mode_at) = millis();
                          id(energy_state).heating_enabled.set(raw == "HeatingOff" ? 0 : 1, millis());
                          return true;
                        });
                on_error:
                  then:
                    - lambda: id(energy_state).heating_enabled.set(NAN, millis()); id(thermostat_mode_text) = "--";
      - delay: 80ms
      - if:
          condition:
            lambda: return strlen("${homey_room_thermostat_1_id}") > 0 && strcmp("${homey_room_thermostat_1_id}", "none") != 0;
          then:
            - background_http.get:
                url: "${homey_address}/api/manager/devices/device/${homey_room_thermostat_1_id}"
                request_headers:
                  Authorization: "Bearer ${homey_token}"
                  Accept: "application/json"
                capture_response: true
                max_response_buffer_size: 16384
                on_response:
                  then:
                    - lambda: |-
                        auto &state = id(energy_state);
                        state.room_temperature[0].set(NAN, millis());
                        state.room_target[0].set(NAN, millis());
                        if (response->status_code != 200) return;
                        json::parse_json(body, [](JsonObject device) -> bool {
                          if (device["available"].is<bool>() && !device["available"].as<bool>()) return false;
                          const char *driver = device["driverId"] | "";
                          if (strcmp(driver, "homey:app:com.honeywell:zone")) return false;
                          auto caps = device["capabilitiesObj"];
                          auto measured = caps["measure_temperature"]["value"];
                          auto target = caps["target_temperature"]["value"];
                          if (measured.is<float>() && std::isfinite(measured.as<float>()) && measured.as<float>() >= -20 && measured.as<float>() <= 60)
                            id(energy_state).room_temperature[0].set(measured.as<float>(), millis());
                          if (target.is<float>() && std::isfinite(target.as<float>()) && target.as<float>() >= 5 && target.as<float>() <= 35)
                            id(energy_state).room_target[0].set(target.as<float>(), millis());
                          return true;
                        });
                on_error:
                  then:
                    - lambda: id(energy_state).room_temperature[0].set(NAN, millis()); id(energy_state).room_target[0].set(NAN, millis());
