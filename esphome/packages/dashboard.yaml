# Shared LVGL interface. The hardware configuration will use the same package,
# keeping the simulator and physical display layout identical.
interval:
  - interval: 1s
    then:
      - lambda: |-
          // ESPHome's button text shorthand creates an unaligned child label.
          // Initialize after LVGL setup; alignment persists across text updates.
          static bool aligned = false;
          if (aligned) return;
          lv_obj_t *buttons[] = {id(force_charge_button), id(music_back), id(energy_back), id(climate_back),
            id(small_music_room_select), id(small_music_minus),
            id(small_music_plus), id(small_music_play),
            id(music_previous), id(music_next), id(music_mute),
            id(music_minus), id(music_plus), id(music_play), id(music_room_select),
            id(music_favorites_tab), id(music_systems_tab),
            id(music_group_apply), id(music_group_reset),
            id(gas_tab), id(music_tab), id(extra_tab),
            id(today_prices_button), id(tomorrow_prices_button)};
          for (auto *button : buttons) {
            lv_obj_align(lv_obj_get_child(button, 0), button == id(small_music_room_select) ? LV_ALIGN_LEFT_MID : LV_ALIGN_CENTER, 0, -1);
            // Override the built-in raised theme in every interactive state.
            for (auto state : {LV_STATE_DEFAULT, LV_STATE_PRESSED, LV_STATE_DISABLED, LV_STATE_FOCUSED}) {
              const auto selector = static_cast<lv_style_selector_t>(LV_PART_MAIN) |
                static_cast<lv_style_selector_t>(state);
              lv_obj_set_style_shadow_width(button, 0, selector);
              lv_obj_set_style_shadow_opa(button, LV_OPA_TRANSP, selector);
              lv_obj_set_style_outline_width(button, 0, selector);
            }
          }
          // Keep unavailable music controls subdued, not light-grey theme slabs.
          for (auto *button : {id(music_previous), id(music_next), id(music_play),
              id(music_minus), id(music_plus), id(music_mute),
              id(small_music_play), id(small_music_minus), id(small_music_plus),
              id(music_group_apply), id(music_group_reset)}) {
            lv_obj_set_style_bg_color(button, lv_color_hex(0x151E19), LV_STATE_DISABLED);
            lv_obj_set_style_border_color(button, lv_color_hex(0x26362D), LV_STATE_DISABLED);
            lv_obj_set_style_text_color(button, lv_color_hex(0x77857C), LV_STATE_DISABLED);
            lv_obj_set_style_bg_opa(button, LV_OPA_COVER, LV_STATE_DISABLED);
          }
          lv_obj_set_style_clip_corner(id(music_cover_frame), true, 0);
          lv_obj_set_style_clip_corner(id(small_music_cover_frame), true, 0);
          // Clip the lower rounded corners of each tab: retain rounded tops
          // while the bottom edge joins the chart without a gap.
          for (auto *tab : {id(today_prices_button), id(tomorrow_prices_button)}) {
            auto *clip = lv_obj_create(lv_obj_get_parent(tab));
            lv_obj_remove_style_all(clip);
            // Layout may not have run on a cold boot; computed tab coordinates
            // can still be zero. Use the fixed design positions instead.
            lv_obj_set_pos(clip, tab == id(today_prices_button) ? 14 : 240, 154);
            lv_obj_set_size(clip, 226, 40);
            lv_obj_clear_flag(clip, LV_OBJ_FLAG_SCROLLABLE);
            lv_obj_set_parent(tab, clip);
            lv_obj_set_pos(tab, 0, 0);
            lv_obj_set_height(tab, 48);
            lv_obj_align(lv_obj_get_child(tab, 0), LV_ALIGN_CENTER, 0, -5);
            lv_obj_set_width(lv_obj_get_child(tab, 0), 180);
            lv_label_set_long_mode(lv_obj_get_child(tab, 0), LV_LABEL_LONG_DOT);
            lv_obj_set_style_text_align(lv_obj_get_child(tab, 0), LV_TEXT_ALIGN_CENTER, 0);
            lv_obj_align(lv_obj_get_child(tab, 0), LV_ALIGN_CENTER, -10, -5);
          }
          lv_obj_set_parent(id(price_source_warning), id(today_prices_button));
          lv_obj_set_parent(id(tomorrow_source_warning), id(tomorrow_prices_button));
          for (auto *icon : {id(price_source_warning), id(tomorrow_source_warning)}) {
            lv_obj_set_pos(icon, 198, 10);
            lv_obj_clear_flag(icon, LV_OBJ_FLAG_CLICKABLE);
          }
          // Reuse the larger cover; the download callback fits its decoded size.
          lv_image_set_pivot(id(small_music_cover_widget), 0, 0);
          lv_image_set_scale(id(small_music_cover_widget), 256);
          aligned = true;

lvgl:
  buffer_size: 25%
  default_font: montserrat_14
  pages:
    - id: energydeck_main_page
      bg_color: 0x0F1712
      text_color: 0xEEF6F0
      scrollable: false
      widgets:
        # Move this one live header between pages; no duplicate values/polling.
        - obj:
            id: shared_energy_header
            x: 0
            y: 0
            width: 480
            height: 148
            pad_all: 0
            border_width: 0
            bg_opa: TRANSP
            text_color: 0xEEF6F0
            scrollable: false
            widgets:
              - label:
                  id: clock_label
                  x: 18
                  y: 14
                  text: "00:00  EnergyDeck"
                  text_color: 0xA9B8AE
              - label:
                  id: homey_status_label
                  x: 284
                  y: 14
                  width: 182
                  height: 18
                  text_align: RIGHT
                  long_mode: DOT
                  text: "${homey_starting}"
                  text_color: 0x62D98A

              - label:
                  id: current_price_source_label
                  x: 20
                  y: 34
                  width: 182
                  height: 14
                  long_mode: DOT
                  text: "${price_source_unknown}"
                  text_font: montserrat_10
                  text_color: 0xE8B94C
              - label:
                  id: price_period_label
                  x: 20
                  y: 51
                  text: "${price_now_title}"
                  text_color: 0x93A097
              - label:
                  id: price_now_label
                  x: 20
                  y: 70
                  text: "${price_now_value}"
                  text_font: montserrat_48
              - label:
                  x: 132
                  y: 94
                  text: "${price_unit}"
                  text_color: 0xA8B5AB
              - label:
                  id: sunrise_label
                  x: 20
                  y: 125
                  text: "${sunrise}"
                  text_font: montserrat_12
                  text_color: 0xE8B94C
              - label:
                  id: sunset_label
                  x: 118
                  y: 125
                  text: "${sunset}"
                  text_font: montserrat_12
                  text_color: 0xA9B8AE
              - obj:
                  id: header_gauges
                  x: 242
                  y: 34
                  width: 238
                  height: 114
                  pad_all: 0
                  border_width: 0
                  bg_opa: TRANSP
                  scrollable: false
                  widgets: !include energy-header-widgets.yaml
              - obj:
                  x: 204
                  y: 45
                  width: 24
                  height: 70
                  pad_all: 0
                  border_width: 0
                  bg_opa: TRANSP
                  scrollable: false
                  widgets: !include status-icons.yaml

        - obj:
            hidden: true
            width: 480
            height: 148
            widgets:
              - arc:
                  id: electricity_today_arc
                  x: 326
                  y: 42
                  width: 66
                  height: 66
                  value: 0
                  adjustable: false
                  arc_width: 7
                  arc_color: 0x303A33
                  indicator:
                    arc_width: 7
                    arc_color: 0x8B51ED
                  knob:
                    bg_opa: TRANSP
              - label:
                  id: electricity_today_value_label
                  x: 331
                  y: 61
                  width: 56
                  text_align: CENTER
                  text: "${energy_today_value}"
                  text_font: montserrat_18
              - label:
                  id: electricity_today_unit_label
                  x: 344
                  y: 83
                  text: "kWh"
                  text_color: 0x8B51ED
              - label:
                  id: electricity_ytd_label
                  x: 316
                  y: 111
                  width: 86
                  text_align: CENTER
                  text: "${energy_ytd}"
                  text_font: montserrat_12
                  text_color: 0xA9B8AE

              - arc:
                  id: electricity_now_arc
                  x: 250
                  y: 42
                  width: 66
                  height: 66
                  value: 0
                  min_value: -100
                  max_value: 100
                  mode: SYMMETRICAL
                  adjustable: false
                  arc_width: 7
                  arc_color: 0x303A33
                  indicator:
                    arc_width: 7
                    arc_color: 0x3AA7D8
                  knob:
                    bg_opa: TRANSP
              # Zero marker: the symmetrical arc starts here. Negative power fills
              # to the left (export), positive power to the right (consumption).
              - obj:
                  x: 282
                  y: 41
                  width: 2
                  height: 8
                  bg_color: 0xDDE7E0
                  bg_opa: COVER
                  border_width: 0
                  radius: 1
              - label:
                  id: electricity_now_value_label
                  x: 255
                  y: 61
                  width: 56
                  text_align: CENTER
                  text: "0.0"
                  text_font: montserrat_18
              - label:
                  id: electricity_now_unit_label
                  x: 268
                  y: 83
                  width: 30
                  text_align: CENTER
                  text: "kW"
                  text_color: 0x3AA7D8
              - label:
                  id: electricity_peak_label
                  x: 236
                  y: 111
                  width: 92
                  text_align: CENTER
                  text: "${power_peak}"
                  text_font: montserrat_12
                  text_color: 0xA9B8AE

              - arc:
                  id: solar_now_arc
                  x: 402
                  y: 42
                  width: 66
                  height: 66
                  value: 0
                  adjustable: false
                  arc_width: 7
                  arc_color: 0x303A33
                  indicator:
                    arc_width: 7
                    arc_color: 0x48BD70
                  knob:
                    bg_opa: TRANSP
              - label:
                  id: solar_now_value_label
                  x: 407
                  y: 61
                  width: 56
                  text_align: CENTER
                  text: "0.0"
                  text_font: montserrat_18
              - label:
                  id: solar_now_unit_label
                  x: 420
                  y: 83
                  text: "kW"
                  text_color: 0x48BD70
              - label:
                  id: solar_today_label
                  x: 390
                  y: 111
                  width: 90
                  text_align: CENTER
                  text: "${solar_today}"
                  text_font: montserrat_12
                  text_color: 0xA9B8AE


        - button:
            id: today_prices_button
            x: 14
            y: 154
            width: 226
            height: 40
            radius: 8
            border_width: 1
            border_color: 0x343A37
            bg_color: 0x24583B
            pad_all: 0
            on_click:
              - lambda: |-
                  id(show_tomorrow_prices) = false;
                  lv_obj_set_style_bg_color(id(today_prices_button), lv_color_hex(0x24583B), LV_PART_MAIN);
                  lv_obj_set_style_bg_color(id(tomorrow_prices_button), lv_color_hex(0x1C271F), LV_PART_MAIN);
              - script.execute: refresh_homey_prices
            widgets:
              - label:
                  align: CENTER
                  y: -1
                  text: "${today}"
                  text_font: montserrat_14
        - button:
            id: tomorrow_prices_button
            x: 240
            y: 154
            width: 226
            height: 40
            radius: 8
            border_width: 1
            border_color: 0x343A37
            bg_color: 0x1C271F
            pad_all: 0
            state:
              disabled: true
            disabled:
              bg_color: 0x18231E
              text_color: 0x82958A
            on_click:
              - lambda: |-
                  id(show_tomorrow_prices) = true;
                  lv_obj_set_style_bg_color(id(today_prices_button), lv_color_hex(0x1C271F), LV_PART_MAIN);
                  lv_obj_set_style_bg_color(id(tomorrow_prices_button), lv_color_hex(0x294E77), LV_PART_MAIN);
              - script.execute: refresh_homey_prices
            widgets:
              - label:
                  align: CENTER
                  y: -1
                  id: tomorrow_tab_label
                  text: "${tomorrow_unavailable}"
                  text_font: montserrat_14

        - obj:
