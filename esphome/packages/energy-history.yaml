# Lazy, read-only Homey Insights polling. Today is Homey's local calendar day.
globals:
  - id: energy_history
    type: energydeck::EnergyHistory
    initial_value: 'energydeck::EnergyHistory{}'

interval:
  - interval: 5min
    then:
      - if:
          condition:
            lambda: return id(detail_page_open) == 1;
          then:
            - script.execute: refresh_energy_history

script:
  - id: refresh_energy_history
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              const auto now = id(energydeck_time).now();
              if (!now.is_valid()) return false;
              const int date = now.year * 10000 + now.month * 100 + now.day_of_month;
              const auto &h = id(energy_history);
              return !h.imported.fresh(date, millis()) || !h.exported.fresh(date, millis()) ||
                !h.gas.fresh(date, millis()) || millis() - h.imported.fetched_at >= 240000;
          then:
            - background_http.get:
                # Local Homey needs the full returned log ID as well as ownerUri.
                url: "${homey_address}/api/manager/insights/log/homey:device:${homey_homewizard_device_id}/homey:device:${homey_homewizard_device_id}:meter_power.imported/entry?resolution=today"
                request_headers:
                  Authorization: "Bearer ${homey_token}"
                  Accept: "application/json"
                capture_response: true
                max_response_buffer_size: 32768
                on_error:
                  then:
                    - lambda: id(energy_history).imported = {};
                on_response:
                  then:
                    - lambda: |-
                        auto &destination = id(energy_history).imported;
                        destination = {};
                        const auto now = id(energydeck_time).now();
                        if (response->status_code != 200 || !now.is_valid()) return;
                        const int date = now.year * 10000 + now.month * 100 + now.day_of_month;
                        energydeck::HourlyHistory next;
                        next.date = date;
                        bool parsed = json::parse_json(body, [&](JsonObject root) -> bool {
                          JsonArray values = root["values"].as<JsonArray>();
                          if (values.isNull() || values.size() > 310) return false;
                          for (JsonObject point : values) {
                            const char *stamp = point["t"] | "";
                            int year, month, day, hour, minute, second;
                            if (!point["v"].is<double>() ||
                                sscanf(stamp, "%d-%d-%dT%d:%d:%d", &year, &month, &day, &hour, &minute, &second) != 6 ||
                                year < 2020 || year > 2100 || month < 1 || month > 12 || day < 1 || day > 31 ||
                                hour < 0 || hour > 23 || minute < 0 || minute > 59 || second != 0) {
                              next.previous_valid = false;
                              continue;
                            }
                            ESPTime utc{};
                            utc.year = year; utc.month = month; utc.day_of_month = day;
                            utc.hour = hour; utc.minute = minute; utc.second = second;
                            if (!utc.is_valid(false, false)) continue;
                            utc.recalc_timestamp_utc(false);
                            if (utc.timestamp > now.timestamp) continue;
                            const auto local = ESPTime::from_epoch_local(utc.timestamp);
                            if (local.year * 10000 + local.month * 100 + local.day_of_month != date) continue;
                            // The difference ending at 01:00 belongs to 00:00–01:00.
                            // Convert each UTC timestamp separately to respect DST.
                            const auto interval = ESPTime::from_epoch_local(utc.timestamp - 1);
                            next.add(utc.timestamp, point["v"].as<double>(), interval.hour);
                          }
                          if (!next.previous_valid || now.timestamp - next.previous_time > 900) return false;
                          // Missing intervals invalidate the affected hour, rather than
                          // presenting incomplete coverage as a low-consumption hour.
                          // Count real UTC intervals: a DST repeat adds to the same slot.
                          auto midnight = now;
                          midnight.hour = 0; midnight.minute = 0; midnight.second = 0;
                          midnight.recalc_timestamp_local();
                          std::array<unsigned, 24> expected{};
                          for (auto t = midnight.timestamp + 300; t <= next.previous_time; t += 300)
                            expected[ESPTime::from_epoch_local(t - 1).hour] += 300;
                          next.verify_coverage(expected);
                          return true;
                        });
                        if (!parsed) return;
                        next.loaded = true;
                        next.fetched_at = millis();
                        destination = next;
                        ESP_LOGI("energy_history", "imported: loaded %u five-minute intervals", static_cast<unsigned>(
                          [&](){ unsigned count = 0; for (auto seconds : next.seconds) count += seconds / 300; return count; }()));
            - delay: 80ms
            - background_http.get:
                # Local Homey needs the full returned log ID as well as ownerUri.
                url: "${homey_address}/api/manager/insights/log/homey:device:${homey_homewizard_device_id}/homey:device:${homey_homewizard_device_id}:meter_power.exported/entry?resolution=today"
                request_headers:
