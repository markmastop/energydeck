                                year < 2020 || year > 2100 || month < 1 || month > 12 || day < 1 || day > 31 ||
                                hour < 0 || hour > 23 || minute < 0 || minute > 59 || second != 0) {
                              next.previous_valid = false;
                              continue;
                            }
                            ESPTime utc{};
                            utc.year = year; utc.month = month; utc.day_of_month = day;
                            utc.hour = hour; utc.minute = minute; utc.second = second;
                            if (!utc.is_valid(false, false)) continue;
                            utc.recalc_timestamp_utc(false);
                            if (utc.timestamp > now.timestamp) continue;
                            const auto local = ESPTime::from_epoch_local(utc.timestamp);
                            if (local.year * 10000 + local.month * 100 + local.day_of_month != date) continue;
                            // The difference ending at 01:00 belongs to 00:00–01:00.
                            // Convert each UTC timestamp separately to respect DST.
                            const auto interval = ESPTime::from_epoch_local(utc.timestamp - 1);
                            next.add(utc.timestamp, point["v"].as<double>(), interval.hour);
                          }
                          if (!next.previous_valid || now.timestamp - next.previous_time > 900) return false;
                          // Missing intervals invalidate the affected hour, rather than
                          // presenting incomplete coverage as a low-consumption hour.
                          // Count real UTC intervals: a DST repeat adds to the same slot.
                          auto midnight = now;
                          midnight.hour = 0; midnight.minute = 0; midnight.second = 0;
                          midnight.recalc_timestamp_local();
