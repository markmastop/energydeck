                        ESP_LOGI("energy_history", "gas: loaded %u five-minute intervals", static_cast<unsigned>(
                          [&](){ unsigned count = 0; for (auto seconds : next.seconds) count += seconds / 300; return count; }()));
      - script.execute: render_energy_history

  - id: render_energy_history
    then:
      - lambda: |-
          if (id(detail_page_open) != 1) return;
          using namespace esphome::ui_performance;
          const auto now = id(energydeck_time).now();
          const int date = now.is_valid() ? now.year * 10000 + now.month * 100 + now.day_of_month : 0;
          const auto &h = id(energy_history);
          const auto *a = h.imported.fresh(date, millis()) && now.timestamp - h.imported.previous_time <= 900 ? &h.imported : nullptr;
          const auto *b = h.exported.fresh(date, millis()) && now.timestamp - h.exported.previous_time <= 900 ? &h.exported : nullptr;
          const auto *gas = h.gas.fresh(date, millis()) && now.timestamp - h.gas.previous_time <= 900 ? &h.gas : nullptr;
          // Redraw only when a response arrives or cached data expires.
          static uint32_t last_a = UINT32_MAX, last_b = UINT32_MAX, last_g = UINT32_MAX;
          const uint32_t ka = a ? a->fetched_at : 0, kb = b ? b->fetched_at : 0, kg = gas ? gas->fetched_at : 0;
          if (last_a == ka && last_b == kb && last_g == kg) return;
          last_a = ka; last_b = kb; last_g = kg;
          const double electricity_scale = energydeck::draw_history(id(history_electricity_plot), a, b, 0x3AA7D8, 0x48BD70, 0.25, true);
          const double gas_scale = energydeck::draw_history(id(history_gas_plot), gas, nullptr, 0xFF3485, 0, 0.1);
          set_text_fmt(id(history_electricity_scale), "0 - %.2f kWh", electricity_scale);
          set_text_fmt(id(history_gas_scale), "0 - %.1f m3", gas_scale);
          set_text(id(history_electricity_summary), "${energy_history_electricity}");
          set_text(id(history_gas_summary), "${energy_history_gas}");
          auto status = [&](lv_obj_t *label, const energydeck::HourlyHistory *data, const char *format) {
            if (!data) { set_text(label, "${energy_history_unavailable}"); return; }
            const auto latest = ESPTime::from_epoch_local(data->previous_time);
            set_text_fmt(label, format, latest.hour, latest.minute);
          };
          status(id(history_electricity_status), a ? a : b, "${energy_history_ready}");
          status(id(history_gas_status), gas, "${energy_history_gas_ready}");
          if ((a == nullptr) != (b == nullptr))
            set_text(id(history_electricity_status), "${energy_history_incomplete}");
