id: energy_page
bg_color: 0x0F1712
text_color: 0xEEF6F0
scrollable: false
widgets:
  - button:
      id: energy_back
      bg_opa: TRANSP
      x: 14
      y: 154
      width: 44
      height: 44
      radius: 8
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 0
      # Keep the empty label for shared button styling; draw the arrow without a font.
      widgets:
        - label:
            text: ""
            align: CENTER
        - line:
            x: 12
            y: 12
            clickable: false
            line_color: 0xEEF6F0
            line_width: 2
            points:
              - {x: 10, y: 0}
              - {x: 0, y: 10}
              - {x: 10, y: 20}
        - line:
            x: 12
            y: 12
            clickable: false
            line_color: 0xEEF6F0
            line_width: 2
            points:
              - {x: 0, y: 10}
              - {x: 20, y: 10}
      on_click:
        - script.execute: close_detail_page
  - label:
      x: 68
      y: 156
      text: "${energy_page_title}"
      text_font: montserrat_20
  - label:
      id: energy_subtitle
      x: 68
      y: 183
      width: 398
      height: 21
      long_mode: DOT
      text: "${energy_live_subtitle}"
      text_font: montserrat_12
      text_color: 0xA9B8AE
  - obj:
