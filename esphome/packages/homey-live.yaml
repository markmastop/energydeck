  - id: refresh_homey_weather
    mode: restart
    then:
      - http_request.get:
          url: "${homey_address}/api/manager/weather/weather"
          request_headers:
            Authorization: "Bearer ${homey_token}"
            Accept: "application/json"
          capture_response: true
          max_response_buffer_size: 32768
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    lv_label_set_text(id(weather_now_label), "${weather_loading}");
                    lv_label_set_text(id(weather_tomorrow_label), "${weather_tomorrow_loading}");
                    ESP_LOGW("homey", "Weather request returned HTTP %d", response->status_code);
                    return;
                  }

                  bool parsed = json::parse_json(body, [](JsonObject weather) -> bool {
                    JsonVariant temperature_value = weather["temperature"];
                    const char *current_icon_value = weather["iconId"] | "";
                    JsonArray forecast = weather["forecast"].as<JsonArray>();
                    if (temperature_value.isNull() || forecast.size() == 0) return false;

                    JsonObject tomorrow = forecast[0].as<JsonObject>();
                    JsonVariant minimum_value = tomorrow["temperatureMin"];
                    JsonVariant maximum_value = tomorrow["temperatureMax"];
                    const char *tomorrow_icon_value = tomorrow["iconId"] | "";
                    if (minimum_value.isNull() || maximum_value.isNull()) return false;

                    const std::string current_icon(current_icon_value);
                    const std::string tomorrow_icon(tomorrow_icon_value);
                    const bool current_rain = current_icon.find("rain") != std::string::npos ||
                      current_icon.find("thunder") != std::string::npos;
                    const bool current_snow = current_icon.find("snow") != std::string::npos;
                    const bool current_cloud = current_icon.find("cloud") != std::string::npos ||
                      current_rain || current_snow;
                    const bool current_night = current_icon.find("night") != std::string::npos;

                    const char *condition = "${weather_unknown}";
                    if (current_icon.find("thunder") != std::string::npos) condition = "${weather_thunder}";
                    else if (current_rain) condition = "${weather_rain}";
                    else if (current_snow) condition = "${weather_snow}";
                    else if (current_icon.find("fog") != std::string::npos) condition = "${weather_fog}";
                    else if (current_cloud) condition = "${weather_cloudy}";
                    else if (current_icon.find("clear") != std::string::npos) condition = "${weather_clear}";

                    lv_label_set_text_fmt(
                      id(weather_now_label),
                      "${weather_now_format}",
                      temperature_value.as<float>(),
                      condition
                    );
                    lv_label_set_text_fmt(
                      id(weather_tomorrow_label),
                      "${weather_tomorrow_format}",
                      minimum_value.as<float>(),
                      maximum_value.as<float>()
                    );

                    const bool rain_expected = tomorrow_icon.find("rain") != std::string::npos ||
                      tomorrow_icon.find("thunder") != std::string::npos ||
                      tomorrow_icon.find("snow") != std::string::npos;

                    if (current_cloud) {
                      lv_obj_remove_flag(id(weather_cloud_icon), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_remove_flag(id(weather_cloud_bump), LV_OBJ_FLAG_HIDDEN);
                    } else {
                      lv_obj_add_flag(id(weather_cloud_icon), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_add_flag(id(weather_cloud_bump), LV_OBJ_FLAG_HIDDEN);
                    }
                    lv_obj_set_style_bg_color(id(weather_sun_icon),
                      lv_color_hex(current_night ? 0xCBD5CE : 0xF1C75B), LV_PART_MAIN);
                    lv_obj_t *drops[3] = {
                      id(weather_rain_drop_1), id(weather_rain_drop_2), id(weather_rain_drop_3)
                    };
                    for (auto *drop : drops) {
                      if (current_rain) lv_obj_remove_flag(drop, LV_OBJ_FLAG_HIDDEN);
                      else lv_obj_add_flag(drop, LV_OBJ_FLAG_HIDDEN);
                    }

                    ESP_LOGI("homey", "Weather: %.1f C, %s; tomorrow %.1f-%.1f C, rain %s",
                      temperature_value.as<float>(), current_icon.c_str(),
                      minimum_value.as<float>(), maximum_value.as<float>(),
                      rain_expected ? "yes" : "no");
                    return true;
                  });

                  if (!parsed) {
                    lv_label_set_text(id(weather_now_label), "${weather_loading}");
                    lv_label_set_text(id(weather_tomorrow_label), "${weather_tomorrow_loading}");
                    ESP_LOGW("homey", "Could not parse Homey weather");
                  }
          on_error:
            then:
              - lvgl.label.update:
                  id: weather_now_label
                  text: "${weather_loading}"
              - lvgl.label.update:
                  id: weather_tomorrow_label
                  text: "${weather_tomorrow_loading}"
