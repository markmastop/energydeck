# Dedicated Sonos page. Homey is not involved in favorites or playback controls.
external_components:
  - source:
      type: local
      path: components
    components: [online_image, sonos_local]

sonos_local:

substitutions:
  sonos_living_address: "http://192.168.0.190:1400"
  sonos_kitchen_address: "http://192.168.0.191:1400"

globals:
  - id: favorite_artwork
    type: esphome::online_image::FavoriteArtwork
  - id: sonos
    type: energydeck_sonos::State
  - id: sonos_favorites
    type: energydeck_sonos::Favorites
  - id: music_favorite_copy
    type: energydeck_sonos::Favorite
  - id: detail_tab
    type: int
    initial_value: "0"
  - id: music_page_open
    type: bool
    initial_value: "false"
  - id: music_busy
    type: bool
    initial_value: "false"
  - id: music_command_failed
    type: bool
    initial_value: "false"
  - id: music_favorites_loading
    type: bool
    initial_value: "false"
  - id: music_favorite_pending
    type: bool
    initial_value: "false"
  - id: music_cover_key
    type: std::string
    initial_value: '""'
  - id: music_cover_requested
    type: std::string
    initial_value: '""'
  - id: music_cover_downloading
    type: bool
    initial_value: "false"

interval:
  - interval: 1s
    then:
      - script.execute: load_visible_favorite_cover
  - interval: 10s
    startup_delay: 8s
    then:
      - if:
          condition:
            lambda: return !id(music_busy);
          then:
            - script.execute: refresh_music
  - interval: 5min
    then:
      - if:
          condition:
            lambda: return id(music_page_open) && !id(music_busy) && !id(music_favorite_pending);
          then:
            - script.execute: refresh_music_favorites

image:
  - platform: online_image
    id: favorite_cover_download
    http_request_id: homey_http
    url: "${sonos_living_address}/unavailable"
    format: JPEG
    type: RGB565
    resize: 32x32
    buffer_size: 8192
    update_interval: never
    on_download_finished:
      then:
        - lambda: |-
            auto *source = id(favorite_cover_download).get_lv_image_dsc();
            source->header.w = id(favorite_cover_download).get_width();
            source->header.h = id(favorite_cover_download).get_height();
            source->header.stride = id(favorite_cover_download).get_width_stride();
            id(favorite_artwork).store(source);
            id(favorite_artwork).busy = false;
        - script.execute: show_favorite_covers
    on_error:
      then:
        - lambda: id(favorite_artwork).busy = false;
  - platform: online_image
    id: music_cover
    http_request_id: homey_http
    url: "${sonos_living_address}/unavailable"
    format: JPEG
    type: RGB565
    resize: 272x272
    buffer_size: 8192
    update_interval: never
    # No credentials: coordinator artwork or allowlisted Sonos HTTPS proxies.
    on_download_finished:
      then:
        - lambda: |-
            // Runtime buffers can reuse an address with different dimensions.
            auto *descriptor = id(music_cover).get_lv_image_dsc();
            lv_image_cache_drop(descriptor);
            descriptor->header.w = id(music_cover).get_width();
            descriptor->header.h = id(music_cover).get_height();
            descriptor->header.stride = id(music_cover).get_width_stride();
            descriptor->data_size = descriptor->header.stride * descriptor->header.h;
        - lvgl.image.update:
            id: music_cover_widget
            src: music_cover
        - lambda: |-
            id(music_cover_downloading) = false;
            // Fill the rounded square without stretching or a letterbox strip.
            const int w = id(music_cover).get_width(), h = id(music_cover).get_height();
            if (w > 0 && h > 0) {
              const int scale = (272 * 256 + std::min(w, h) - 1) / std::min(w, h);
              lv_image_set_pivot(id(music_cover_widget), 0, 0);
              lv_image_set_scale(id(music_cover_widget), scale);
              lv_obj_set_pos(id(music_cover_widget), (272 - w * scale / 256) / 2, (272 - h * scale / 256) / 2);
              // Keep a separate native-size thumbnail: no shared transformed
              // RGB565 buffer/cache between the large and compact widgets.
              static uint8_t thumbnail[62 * 62 * 2];
              static lv_image_dsc_t mini;
              lv_image_cache_drop(&mini);
              const auto *source = id(music_cover).get_lv_image_dsc();
              const int side = std::min(w, h);
              for (int y = 0; y < 62; ++y) {
                for (int x = 0; x < 62; ++x) {
                  const int sx = (w - side) / 2 + x * side / 62;
                  const int sy = (h - side) / 2 + y * side / 62;
                  const auto *pixel = source->data + sy * source->header.stride + sx * 2;
                  thumbnail[(y * 62 + x) * 2] = pixel[0];
                  thumbnail[(y * 62 + x) * 2 + 1] = pixel[1];
                }
              }
              mini = *source;
              mini.header.w = mini.header.h = 62;
              mini.header.stride = 62 * 2;
              mini.data_size = sizeof(thumbnail);
              mini.data = thumbnail;
              lv_image_set_pivot(id(small_music_cover_widget), 0, 0);
              lv_image_set_scale(id(small_music_cover_widget), 256);
              lv_image_set_src(id(small_music_cover_widget), &mini);
            }
            for (auto *cover : {id(music_cover_widget), id(small_music_cover_widget)}) {
              if (!id(music_cover_key).empty() && id(music_cover_key) == id(music_cover_requested))
                lv_obj_clear_flag(cover, LV_OBJ_FLAG_HIDDEN);
              else
                lv_obj_add_flag(cover, LV_OBJ_FLAG_HIDDEN);
            }
    on_error:
      then:
        - lambda: |-
            id(music_cover_downloading) = false;
            id(music_cover_requested).clear();
            lv_obj_add_flag(id(music_cover_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(small_music_cover_widget), LV_OBJ_FLAG_HIDDEN);

script:
  - id: show_favorite_covers
    then:
      - lambda: |-
          const auto &items = id(sonos_favorites).items;
          const auto count = std::min(items.size(), size_t(lv_obj_get_child_count(id(music_favorites_grid))));
          for (size_t i = 0; i < count; ++i) {
            const auto *cover = id(favorite_artwork).get(items[i].cover);
            if (!cover) continue;
            auto *button = lv_obj_get_child(id(music_favorites_grid), i);
            auto *image = lv_obj_get_child(button, 2);
            lv_image_set_src(image, cover);
            lv_obj_clear_flag(image, LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(lv_obj_get_child(button, 0), LV_OBJ_FLAG_HIDDEN);
          }

  - id: load_visible_favorite_cover
    then:
      - lambda: |-
          if (!id(music_page_open) || id(favorite_artwork).busy || id(music_cover_downloading) ||
              id(refresh_climate).is_running() || id(music_busy) || id(music_favorites_loading) || !id(sonos_favorites).known) return;
          const auto &items = id(sonos_favorites).items;
          const int scroll = lv_obj_get_scroll_y(id(music_favorites_grid));
          const int height = lv_obj_get_height(id(music_favorites_grid));
          for (size_t i = 0; i < items.size(); ++i) {
            const int y = int(i / 3) * 48 - scroll;
            if (y + 44 <= 0 || y >= height || items[i].cover.empty() || id(favorite_artwork).attempted(items[i].cover)) continue;
            id(favorite_artwork).begin(items[i].cover);
            id(favorite_cover_download).set_url(items[i].cover);
            id(favorite_cover_download).update();
            break;  // One request at a time; failed covers keep their icon.
          }

  - id: open_music_page
    then:
      - lambda: |-
          id(music_page_open) = true;
          lv_obj_set_parent(id(shared_energy_header), id(sonos_page)->obj);
          lv_obj_set_pos(id(shared_energy_header), 0, 0);
      - lvgl.page.show: sonos_page
      - script.execute: render_sonos_energy_header
      - script.execute: render_music
      - if:
          condition:
            lambda: return !id(music_busy);
          then:
            - script.execute: refresh_music
      - script.execute: refresh_music_favorites

  - id: close_music_page
    then:
      - lambda: |-
          id(music_page_open) = false;
          lv_obj_set_parent(id(shared_energy_header), id(energydeck_main_page)->obj);
          lv_obj_set_pos(id(shared_energy_header), 0, 0);
      - lvgl.page.show: energydeck_main_page
      - script.execute: render_sonos_energy_header
      - script.execute: select_detail_tab

  # Reuse live dashboard widgets and colors; changing pages adds no requests.
  - id: render_sonos_energy_header
    then:
      - lambda: |-
          const bool detail = id(music_page_open);
          for (auto *widget : {id(electricity_today_arc), id(electricity_today_value_label),
              id(electricity_today_unit_label), id(electricity_ytd_label)}) {
            if (detail) lv_obj_add_flag(widget, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_clear_flag(widget, LV_OBJ_FLAG_HIDDEN);
          }
          // Solar stays in its familiar right-hand position on both pages.
          if (!detail) {
            lv_obj_add_flag(id(sonos_battery_gauge), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          lv_obj_clear_flag(id(sonos_battery_gauge), LV_OBJ_FLAG_HIDDEN);
          const std::string status = lv_label_get_text(id(battery_status_label));
          const auto separator = status.find(" | ");
          const bool known = separator != std::string::npos;
          std::string percentage = known ? lv_label_get_text(id(battery_percentage_label)) : "--";
          const auto percent = percentage.find('%');
          if (percent != std::string::npos) percentage.resize(percent);
          lv_label_set_text(id(sonos_battery_value), percentage.c_str());
          lv_arc_set_value(id(sonos_battery_arc), known ? lv_bar_get_value(id(battery_level_bar)) : 0);
          const auto level_color = known ? lv_obj_get_style_bg_color(id(battery_level_bar), LV_PART_INDICATOR) : lv_color_hex(0xA9B8AE);
          const auto state_color = lv_obj_get_style_text_color(id(battery_status_label), LV_PART_MAIN);
          lv_obj_set_style_arc_color(id(sonos_battery_arc), level_color, LV_PART_INDICATOR);
          lv_obj_set_style_text_color(id(sonos_battery_unit), level_color, 0);
          lv_label_set_text(id(sonos_battery_power), known ? status.substr(separator + 3).c_str() : "-- W");
          lv_label_set_text(id(sonos_battery_state), known ? status.substr(0, separator).c_str() : status.c_str());
          lv_obj_set_style_text_color(id(sonos_battery_power), state_color, 0);
          lv_obj_set_style_text_color(id(sonos_battery_state), state_color, 0);

  # Read-only polls and explicitly clicked commands share one serialized queue.
  - id: sonos_requests
    mode: single
    then:
      - while:
          condition:
            lambda: return id(sonos).has_request();
          then:
            - http_request.post:
                url: !lambda return id(sonos).request().url();
                request_headers:
                  Content-Type: 'text/xml; charset="utf-8"'
                  SOAPAction: !lambda |-
                    static std::string header;
                    header = id(sonos).request().soap_action();
                    return header.c_str();
                body: !lambda return id(sonos).request().body();
                capture_response: true
                max_response_buffer_size: 65536
                on_response:
                  then:
                    - lambda: id(sonos).accept(response->status_code, body);
                on_error:
                  then:
                    - lambda: id(sonos).accept(0, "");
            - delay: 80ms

  - id: refresh_music
    mode: single
    then:
      - lambda: id(sonos).begin("${sonos_living_address}", "${sonos_kitchen_address}");
      - script.execute: sonos_requests
      - script.wait: sonos_requests
      - lambda: |-
          id(sonos).finish();
          // Follow playback only in the compact dashboard card, never pages.
          id(detail_tab) = id(sonos).follow_compact_tab(id(detail_tab));
          if (id(music_favorite_pending) && id(sonos).command_confirmed()) {
            id(music_favorite_pending) = false;
            id(music_command_failed) = false;
            id(music_favorite_timeout).stop();
          }
          ESP_LOGD("sonos_local", "Direct Sonos: selected=%d grouped=%d known=%d playing=%d tv=%d",
            id(sonos).selected, id(sonos).grouped(), id(sonos).current().known(),
            id(sonos).current().playing, id(sonos).current().tv);
      - script.execute: select_detail_tab
      - script.execute: render_music
      - script.execute: refresh_music_cover

  - id: switch_music_room
    then:
      - if:
          condition:
            lambda: return !id(music_busy) && !id(music_favorite_pending);
          then:
            - lambda: id(sonos).switch_room();
            - script.execute: render_music
            - script.execute: refresh_music_cover

  - id: music_control
    mode: single
    parameters:
      action: int
    then:
      - if:
          condition:
            lambda: return !id(music_favorite_pending) && !id(music_busy);
          then:
            - lambda: |-
                id(sonos).capture();
                id(music_busy) = true;
                id(music_command_failed) = false;
            - script.execute: render_music
            - delay: 100ms
            - script.execute: refresh_music
            - script.wait: refresh_music
            - if:
                condition:
                  lambda: return id(sonos).prepare_command(action);
                then:
                  - script.execute: sonos_requests
                  - script.wait: sonos_requests
                  - lambda: id(music_command_failed) = id(sonos).command_failed;
                  - delay: 2s
                  - script.execute: refresh_music
                  - script.wait: refresh_music
                  - lambda: |-
                      if (!id(sonos).command_confirmed()) id(music_command_failed) = true;
                else:
                  - lambda: id(music_command_failed) = true;
            - lambda: id(music_busy) = false;
            - script.execute: render_music

  - id: refresh_music_cover
    then:
      - lambda: |-
          if (!id(music_page_open) && id(detail_tab) != 1) return;
          const auto &room = id(sonos).current();
          const std::string path = room.known() && room.playing && !room.tv ? room.cover : "";
          const std::string key = path.empty() ? "" :
            path + "|" + room.title + "|" + room.artist + "|" + std::to_string(millis() / 60000);
          if (key != id(music_cover_key)) {
            lv_obj_add_flag(id(music_cover_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(small_music_cover_widget), LV_OBJ_FLAG_HIDDEN);
          }
          id(music_cover_key) = key;
          if (id(music_cover_downloading)) return;
          if (key == id(music_cover_requested)) {
            if (!path.empty()) {
              lv_obj_clear_flag(id(music_cover_widget), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(small_music_cover_widget), LV_OBJ_FLAG_HIDDEN);
            }
            return;
          }
          if (!path.empty()) {
            // Finish the foreground climate refresh before starting artwork.
            if (id(favorite_artwork).busy || id(refresh_climate).is_running()) return;
            // Detach both consumers before the decoder mutates its shared buffer.
            lv_image_set_src(id(music_cover_widget), static_cast<const void *>(nullptr));
            lv_image_set_src(id(small_music_cover_widget), static_cast<const void *>(nullptr));
            lv_image_cache_drop(id(music_cover).get_lv_image_dsc());
            id(music_cover_requested) = key;
            id(music_cover_downloading) = true;
            id(music_cover).set_url(path);
            id(music_cover).update();
          }


  - id: select_detail_tab
    then:
      - lambda: |-
          lv_obj_t *cards[] = {id(gas_card), id(music_card), id(extra_card)};
          for (int i = 0; i < 3; ++i) {
            if (id(detail_tab) == i) lv_obj_clear_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_t *tabs[] = {id(gas_tab), id(music_tab), id(extra_tab)};
          const uint32_t accents[] = {0xFF3485, 0x45BD70, 0x5799E4};
          const uint32_t fills[] = {0x672B4B, 0x24583B, 0x294E77};
          for (int i = 0; i < 3; ++i) {
            const bool active = i == id(detail_tab);
            lv_obj_set_style_bg_color(tabs[i], lv_color_hex(active ? fills[i] : 0x18231E), 0);
            lv_obj_set_style_border_color(tabs[i], lv_color_hex(active ? accents[i] : 0x34463C), 0);
            lv_obj_set_style_border_width(tabs[i], active ? 2 : 1, 0);
          }
      - script.execute: render_music
      - script.execute: refresh_music_cover

  - id: render_music
    then:
      - lambda: |-
          const auto &s = id(sonos);
          const auto &room = s.current();
          const bool known = room.known();
          const bool playing = known && room.playing;
          const bool waiting = id(music_busy) || id(music_favorite_pending);
          const char *status = waiting ? "${music_button_wait}" :
            id(music_command_failed) ? "${music_control_failed}" :
            !known ? "${music_offline}" : playing ? "" : "${music_paused}";
          lv_label_set_text(id(music_status), status);
          lv_obj_set_style_text_color(id(music_status),
            lv_color_hex(id(music_command_failed) || !known ? 0xEA665F : 0x7FE0A2), 0);
          lv_label_set_text(lv_obj_get_child(id(music_room_select), 0), s.grouped() ? "${music_rooms}" :
            s.selected == 0 ? "${music_living_select}" : "${music_kitchen_select}");
          // A single combined group offers no second selectable playback target.
          if (waiting || s.grouped()) lv_obj_add_state(id(music_room_select), LV_STATE_DISABLED);
          else lv_obj_clear_state(id(music_room_select), LV_STATE_DISABLED);
          // Group names are typography, never a disabled grey button slab.
          for (auto state : {LV_STATE_DEFAULT, LV_STATE_DISABLED, LV_STATE_FOCUSED, LV_STATE_PRESSED}) {
            lv_obj_set_style_bg_opa(id(music_room_select), LV_OPA_TRANSP, state);
            lv_obj_set_style_border_width(id(music_room_select), 0, state);
            lv_obj_set_style_text_color(lv_obj_get_child(id(music_room_select), 0), lv_color_hex(0xA9B8AE), state);
          }
          lv_obj_align(lv_obj_get_child(id(music_room_select), 0), LV_ALIGN_LEFT_MID, 0, 0);
          lv_obj_set_style_bg_opa(id(music_room_select), LV_OPA_TRANSP, lv_obj_get_state(id(music_room_select)));
          lv_obj_set_style_border_width(id(music_room_select), 0, lv_obj_get_state(id(music_room_select)));
          lv_label_set_text(id(music_title), !known ? "${music_offline}" :
            playing && room.tv ? "${music_tv}" :
            playing && !room.title.empty() ? room.title.c_str() :
            playing ? "${music_playing}" : "${music_ready}");
          lv_label_set_text(id(music_artist), playing && !room.tv ? room.artist.c_str() : "");
          lv_label_set_text(id(music_cover_fallback), room.tv ? "${music_tv}" : LV_SYMBOL_AUDIO);
          char a[12], b[12];
          for (int i = 0; i < 2; ++i) {
            char *v = i == 0 ? a : b;
            if (s.rooms[i].known() && s.rooms[i].volume >= 0) snprintf(v, 12, "%d%%", s.rooms[i].volume);
            else snprintf(v, 12, "--");
          }
          if (s.grouped()) lv_label_set_text_fmt(id(music_volume), "${music_volume_format}", a, b);
          else lv_label_set_text_fmt(id(music_volume), "${music_single_volume_format}", s.selected == 0 ? a : b);
          lv_label_set_text(lv_obj_get_child(id(music_play), 0),
            waiting ? LV_SYMBOL_REFRESH : room.tv ? "${music_tv}" : playing ? LV_SYMBOL_PAUSE : LV_SYMBOL_PLAY);
          lv_label_set_text(lv_obj_get_child(id(music_mute), 0), s.muted() ? "${music_unmute}" : "${music_mute}");
          lv_obj_set_style_bg_color(id(music_mute), lv_color_hex(s.muted() ? 0x66512A : 0x18231E), 0);
          for (auto *button : {id(music_play), id(music_minus), id(music_plus), id(music_previous), id(music_next), id(music_mute)}) {
            bool unavailable = !known;
            if (button == id(music_play)) unavailable |= room.tv;
            else if (button == id(music_minus) || button == id(music_plus)) unavailable |= !s.can_volume();
            else if (button == id(music_previous)) unavailable |= room.tv || !room.previous;
            else if (button == id(music_next)) unavailable |= room.tv || !room.next;
            else unavailable |= !s.can_mute();
            if (waiting || unavailable) lv_obj_add_state(button, LV_STATE_DISABLED);
            else lv_obj_clear_state(button, LV_STATE_DISABLED);
          }
          const bool block_favorites = waiting || id(music_favorites_loading) || !known || !id(sonos_favorites).known;
          for (uint32_t i = 0; i < lv_obj_get_child_count(id(music_favorites_grid)); ++i) {
            auto *button = lv_obj_get_child(id(music_favorites_grid), i);
            if (block_favorites) lv_obj_add_state(button, LV_STATE_DISABLED);
            else lv_obj_clear_state(button, LV_STATE_DISABLED);
          }
          // Compact and full players share the same snapshot and command state.
          const std::pair<lv_obj_t *, lv_obj_t *> labels[] = {
            {id(small_music_title), id(music_title)}, {id(small_music_artist), id(music_artist)},
            {id(small_music_status), id(music_status)}, {id(small_music_volume), id(music_volume)}
          };
          for (const auto &pair : labels) {
            lv_label_set_text(pair.first, lv_label_get_text(pair.second));
            lv_obj_set_style_text_color(pair.first, lv_obj_get_style_text_color(pair.second, LV_PART_MAIN), 0);
          }
          const std::pair<lv_obj_t *, lv_obj_t *> buttons[] = {
            {id(small_music_room_select), id(music_room_select)}, {id(small_music_play), id(music_play)},
            {id(small_music_minus), id(music_minus)}, {id(small_music_plus), id(music_plus)}
          };
          for (const auto &pair : buttons) {
            lv_label_set_text(lv_obj_get_child(pair.first, 0), lv_label_get_text(lv_obj_get_child(pair.second, 0)));
            if (lv_obj_has_state(pair.second, LV_STATE_DISABLED)) lv_obj_add_state(pair.first, LV_STATE_DISABLED);
            else lv_obj_clear_state(pair.first, LV_STATE_DISABLED);
          }
          // Retain clear word labels in the compact card's existing layout.
          lv_label_set_text(lv_obj_get_child(id(small_music_play), 0),
            waiting ? "${music_button_wait}" : room.tv ? "${music_tv}" : playing ? "${music_pause}" : "${music_resume}");
          if (s.grouped()) lv_label_set_text_fmt(id(music_volume), "${music_volume_side_format}", a, b);
          // Explicit combined-state styling prevents the LVGL disabled theme
          // from reintroducing filled rectangles around secondary controls.
          const lv_state_t plain_states[] = {LV_STATE_DEFAULT, LV_STATE_DISABLED, LV_STATE_FOCUSED, LV_STATE_PRESSED,
            static_cast<lv_state_t>(LV_STATE_DISABLED | LV_STATE_FOCUSED)};
          for (auto *button : {id(small_music_room_select), id(music_back), id(music_previous), id(music_next), id(music_minus), id(music_plus), id(music_mute)}) {
            const bool disabled = lv_obj_has_state(button, LV_STATE_DISABLED);
            for (auto state : plain_states) {
              lv_obj_set_style_bg_opa(button, LV_OPA_TRANSP, state);
              lv_obj_set_style_border_width(button, 0, state);
              lv_obj_set_style_shadow_width(button, 0, state);
            }
            lv_obj_set_style_bg_opa(button, LV_OPA_TRANSP, lv_obj_get_state(button));
            lv_obj_set_style_border_width(button, 0, lv_obj_get_state(button));
            lv_obj_set_style_text_color(lv_obj_get_child(button, 0), lv_color_hex(disabled ? 0x67756D :
              button == id(music_mute) && s.muted() ? 0xE8B94C : 0xEEF6F0), 0);
          }

  - id: sonos_favorite_requests
    mode: single
    then:
      - while:
          condition:
            lambda: return id(sonos_favorites).has_request();
          then:
            - http_request.post:
                url: !lambda return id(sonos_favorites).request().url();
                request_headers:
                  Content-Type: 'text/xml; charset="utf-8"'
                  SOAPAction: '"urn:schemas-upnp-org:service:ContentDirectory:1#Browse"'
                body: !lambda return id(sonos_favorites).request().body();
                capture_response: true
                max_response_buffer_size: 65536
                on_response:
                  then:
                    - lambda: id(sonos_favorites).accept(response->status_code, body);
                on_error:
                  then:
                    - lambda: id(sonos_favorites).accept(0, "");
            - delay: 80ms

  - id: refresh_music_favorites
    mode: single
    then:
      - if:
          condition:
            lambda: return !id(music_busy) && !id(music_favorite_pending);
          then:
            - lambda: |-
                id(music_favorites_loading) = true;
                lv_label_set_text(id(music_favorites_status), "${music_favorites_loading}");
                id(sonos_favorites).begin(id(sonos).current().coordinator_host.empty() ?
                  "${sonos_kitchen_address}" : id(sonos).current().coordinator_host);
            - script.execute: render_music
            - script.execute: sonos_favorite_requests
            - script.wait: sonos_favorite_requests
            - if:
                condition:
                  lambda: return id(sonos_favorites).failed;
                then:
                  - lambda: id(sonos_favorites).begin("${sonos_living_address}");
                  - script.execute: sonos_favorite_requests
                  - script.wait: sonos_favorite_requests
            - lambda: id(music_favorites_loading) = false;
            - script.execute: render_music_favorites
            - script.execute: render_music

  - id: render_music_favorites
    then:
      - lambda: |-
          auto &f = id(sonos_favorites);
          lv_obj_clean(id(music_favorites_grid));
          id(favorite_artwork).clear();
          lv_obj_scroll_to_y(id(music_favorites_grid), 0, LV_ANIM_OFF);
          lv_label_set_text(id(music_favorites_status), !f.known ? "${music_favorites_error}" :
            f.items.empty() ? "${music_favorites_empty}" : "");
          if (!f.known) return;
          ESP_LOGI("sonos_local", "Loaded %u playable Sonos favorites", unsigned(f.items.size()));
          for (size_t i = 0; i < f.items.size(); ++i) {
            auto *button = lv_button_create(id(music_favorites_grid));
            lv_obj_remove_style_all(button);
            lv_obj_set_pos(button, (i % 3) * 150, (i / 3) * 48);
            lv_obj_set_size(button, 146, 44);
            lv_obj_set_style_radius(button, 6, 0);
            lv_obj_set_style_bg_opa(button, LV_OPA_COVER, 0);
            lv_obj_set_style_bg_color(button, lv_color_hex(0x18231E), 0);
            lv_obj_set_style_border_width(button, 0, 0);
            lv_obj_set_style_border_color(button, lv_color_hex(0x34463C), 0);
            lv_obj_set_style_bg_color(button, lv_color_hex(0x24583B), LV_STATE_PRESSED);
            lv_obj_set_style_opa(button, LV_OPA_50, LV_STATE_DISABLED);
            auto *kind = lv_label_create(button);
            lv_obj_set_pos(kind, 14, 14);
            lv_obj_set_style_text_font(kind, &lv_font_montserrat_14, 0);
            lv_obj_set_style_text_color(kind, lv_color_hex(0x7FE0A2), 0);
            lv_label_set_text(kind, f.items[i].radio ? LV_SYMBOL_AUDIO : LV_SYMBOL_LIST);
            auto *title = lv_label_create(button);
            lv_obj_set_pos(title, 42, 7);
            lv_obj_set_size(title, 98, 30);
            lv_label_set_long_mode(title, LV_LABEL_LONG_DOT);
            lv_obj_set_style_text_font(title, &lv_font_montserrat_12, 0);
            lv_obj_set_style_text_color(title, lv_color_hex(0xEEF6F0), 0);
            // Hide unsupported display glyphs (e.g. emoji), preserving the
            // original favorite title and playback metadata in the model.
            const auto &raw = f.items[i].title;
            std::string display;
            for (size_t j = 0; j < raw.size();) {
              const size_t start = j;
              const unsigned char lead = raw[j++];
              uint32_t cp = lead;
              int extra = 0;
              if ((lead & 0xE0) == 0xC0) { cp = lead & 0x1F; extra = 1; }
              else if ((lead & 0xF0) == 0xE0) { cp = lead & 0x0F; extra = 2; }
              else if ((lead & 0xF8) == 0xF0) { cp = lead & 0x07; extra = 3; }
              bool valid = lead < 0x80 || extra > 0;
              while (extra-- > 0) {
                if (j >= raw.size() || (static_cast<unsigned char>(raw[j]) & 0xC0) != 0x80) { valid = false; break; }
                cp = (cp << 6) | (raw[j++] & 0x3F);
              }
              lv_font_glyph_dsc_t glyph{};
              if (valid && lv_font_montserrat_14.get_glyph_dsc(&lv_font_montserrat_14, &glyph, cp, 0) && !glyph.is_placeholder)
                display.append(raw, start, j - start);
            }
            if (display.find_first_not_of(' ') == std::string::npos) display = "${music_favorite_playlist}";
            lv_label_set_text(title, display.c_str());
            auto *cover = lv_image_create(button);
            lv_obj_set_pos(cover, 6, 6);
            lv_obj_set_size(cover, 32, 32);
            lv_obj_add_flag(cover, LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(cover, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_add_event_cb(button, [](lv_event_t *event) {
              const int index = static_cast<int>(reinterpret_cast<uintptr_t>(lv_event_get_user_data(event)));
              id(play_music_favorite).execute(index);
            }, LV_EVENT_CLICKED, reinterpret_cast<void *>(static_cast<uintptr_t>(i)));
          }

  - id: play_music_favorite
    mode: single
    parameters:
      index: int
    then:
      - if:
          condition:
            lambda: |-
              return !id(music_busy) && !id(music_favorite_pending) && !id(music_favorites_loading) &&
                id(sonos_favorites).known && index >= 0 && size_t(index) < id(sonos_favorites).items.size();
          then:
            - lambda: |-
                id(music_favorite_copy) = id(sonos_favorites).items[index];
                id(sonos).capture();
                id(music_busy) = true;
                id(music_command_failed) = false;
            - script.execute: render_music
            - delay: 100ms
            - script.execute: refresh_music
            - script.wait: refresh_music
            - if:
                condition:
                  lambda: return id(sonos).prepare_favorite(id(music_favorite_copy));
                then:
                  - script.execute: sonos_requests
                  - script.wait: sonos_requests
                  - lambda: |-
                      id(music_command_failed) = id(sonos).command_failed;
                      id(music_favorite_pending) = !id(music_command_failed);
                else:
                  - lambda: id(music_command_failed) = true;
            - lambda: id(music_busy) = false;
            - script.execute: render_music
            - if:
                condition:
                  lambda: return id(music_favorite_pending);
                then:
                  - script.execute: music_favorite_timeout
                  - delay: 3s
                  - script.execute: refresh_music

  - id: music_favorite_timeout
    mode: restart
    then:
      - delay: 30s
      - lambda: |-
          id(music_favorite_pending) = false;
          id(music_command_failed) = true;
      - script.execute: render_music
