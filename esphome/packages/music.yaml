# Dedicated Sonos page. Homey is not involved in favorites or playback controls.
external_components:
  - source:
      type: local
      path: components
    components: [online_image, sonos_local, sonos_http, ui_performance, background_http]

ui_performance:

sonos_local:

sonos_http:
  id: sonos_transport

substitutions:
  music_compact_cover_size: "92"

globals:
  - id: favorite_artwork
    type: esphome::online_image::FavoriteArtwork
  - id: sonos
    type: energydeck_sonos::State
  - id: sonos_favorites
    type: energydeck_sonos::Favorites
  - id: sonos_room_activity
    type: energydeck_sonos::RoomActivity
  - id: music_refresh_selected_only
    type: bool
    initial_value: "false"
  - id: music_room_activity_started
    type: uint32_t
    initial_value: "0"
  - id: music_favorite_copy
    type: energydeck_sonos::Favorite
  - id: detail_tab
    type: int
    initial_value: "0"
  - id: music_page_open
    type: bool
    initial_value: "false"
  - id: music_content_tab
    type: int
    initial_value: "0"
  - id: music_busy
    type: bool
    initial_value: "false"
  - id: music_room_refresh_pending
    type: bool
    initial_value: "false"
  - id: music_selection_loading
    type: bool
    initial_value: "false"
  - id: music_command_failed
    type: bool
    initial_value: "false"
  - id: music_control_pending
    type: bool
    initial_value: "false"
  - id: music_control_started
    type: uint32_t
    initial_value: "0"
  - id: music_favorites_loading
    type: bool
    initial_value: "false"
  - id: music_favorite_pending
    type: bool
    initial_value: "false"
  - id: music_cover_key
    type: std::string
    initial_value: '""'
  - id: music_cover_requested
    type: std::string
    initial_value: '""'
  - id: music_cover_downloading
    type: bool
    initial_value: "false"

interval:
  - interval: 1s
    then:
      - script.execute: load_visible_favorite_cover
  - interval: 10s
    startup_delay: 8s
    then:
      - if:
          condition:
            lambda: return !id(music_busy);
          then:
            - script.execute: refresh_music
  - interval: 5min
    then:
      - if:
          condition:
            lambda: return (id(music_page_open) || id(detail_tab) == 1) && !id(music_busy) && !id(music_favorite_pending);
          then:
            - script.execute: refresh_music_favorites

image:
  - platform: online_image
    id: favorite_cover_download
    http_request_id: homey_http
    url: "${sonos_bootstrap_address}/unavailable"
    format: JPEG
    type: RGB565
    resize: 32x32
    buffer_size: 8192
    update_interval: never
    on_download_finished:
      then:
        - lambda: |-
            auto *source = id(favorite_cover_download).get_lv_image_dsc();
            source->header.w = id(favorite_cover_download).get_width();
            source->header.h = id(favorite_cover_download).get_height();
            source->header.stride = id(favorite_cover_download).get_width_stride();
            id(favorite_artwork).store(source);
            id(favorite_artwork).busy = false;
        - script.execute: show_favorite_covers
    on_error:
      then:
        - lambda: id(favorite_artwork).busy = false;
  - platform: online_image
    id: music_cover
    http_request_id: homey_http
    url: "${sonos_bootstrap_address}/unavailable"
    format: JPEG
    type: RGB565
    resize: 272x272
    buffer_size: 8192
    update_interval: never
    # No credentials: coordinator artwork or allowlisted Sonos HTTPS proxies.
    on_download_finished:
      then:
        - lambda: |-
            // Runtime buffers can reuse an address with different dimensions.
            auto *descriptor = id(music_cover).get_lv_image_dsc();
            lv_image_cache_drop(descriptor);
            descriptor->header.w = id(music_cover).get_width();
            descriptor->header.h = id(music_cover).get_height();
            descriptor->header.stride = id(music_cover).get_width_stride();
            descriptor->data_size = descriptor->header.stride * descriptor->header.h;
        - lvgl.image.update:
            id: music_cover_widget
            src: music_cover
        - lambda: |-
            id(music_cover_downloading) = false;
            // Fill the rounded square without stretching or a letterbox strip.
            const int w = id(music_cover).get_width(), h = id(music_cover).get_height();
            if (w > 0 && h > 0) {
              const int scale = (272 * 256 + std::min(w, h) - 1) / std::min(w, h);
              lv_image_set_pivot(id(music_cover_widget), 0, 0);
              lv_image_set_scale(id(music_cover_widget), scale);
              lv_obj_set_pos(id(music_cover_widget), (272 - w * scale / 256) / 2, (272 - h * scale / 256) / 2);
              // Keep a separate native-size thumbnail: no shared transformed
              // RGB565 buffer/cache between the large and compact widgets.
              constexpr int thumbnail_side = ${music_compact_cover_size};
              static uint8_t thumbnail[thumbnail_side * thumbnail_side * 2];
              static lv_image_dsc_t mini;
              lv_image_cache_drop(&mini);
              const auto *source = id(music_cover).get_lv_image_dsc();
              const int side = std::min(w, h);
              for (int y = 0; y < thumbnail_side; ++y) {
                for (int x = 0; x < thumbnail_side; ++x) {
                  const int sx = (w - side) / 2 + x * side / thumbnail_side;
                  const int sy = (h - side) / 2 + y * side / thumbnail_side;
                  const auto *pixel = source->data + sy * source->header.stride + sx * 2;
                  thumbnail[(y * thumbnail_side + x) * 2] = pixel[0];
                  thumbnail[(y * thumbnail_side + x) * 2 + 1] = pixel[1];
                }
              }
              mini = *source;
              mini.header.w = mini.header.h = thumbnail_side;
              mini.header.stride = thumbnail_side * 2;
              mini.data_size = sizeof(thumbnail);
              mini.data = thumbnail;
              lv_image_set_pivot(id(small_music_cover_widget), 0, 0);
              lv_image_set_scale(id(small_music_cover_widget), 256);
              lv_image_set_src(id(small_music_cover_widget), &mini);
            }
            for (auto *cover : {id(music_cover_widget), id(small_music_cover_widget)}) {
              if (!id(music_cover_key).empty() && id(music_cover_key) == id(music_cover_requested))
                lv_obj_clear_flag(cover, LV_OBJ_FLAG_HIDDEN);
              else
                lv_obj_add_flag(cover, LV_OBJ_FLAG_HIDDEN);
            }
    on_error:
      then:
        - lambda: |-
            id(music_cover_downloading) = false;
            id(music_cover_requested).clear();
            lv_obj_add_flag(id(music_cover_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(small_music_cover_widget), LV_OBJ_FLAG_HIDDEN);

script:
  - id: show_favorite_covers
    then:
      - lambda: |-
          const auto &items = id(sonos_favorites).items;
          const auto count = std::min(items.size(), size_t(lv_obj_get_child_count(id(music_favorites_grid))));
          for (size_t i = 0; i < count; ++i) {
            const auto *cover = id(favorite_artwork).get(items[i].cover);
            if (!cover) continue;
            auto *button = lv_obj_get_child(id(music_favorites_grid), i);
            auto *image = lv_obj_get_child(button, 2);
            lv_image_set_src(image, cover);
            lv_obj_clear_flag(image, LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(lv_obj_get_child(button, 0), LV_OBJ_FLAG_HIDDEN);
          }

  - id: load_visible_favorite_cover
    then:
      - lambda: |-
          if ((!id(music_page_open) && (id(detail_tab) != 1 || id(sonos).any_playing())) || id(favorite_artwork).busy || id(music_cover_downloading) ||
              (id(music_page_open) && id(music_content_tab) != 0) ||
              (id(refresh_climate).is_running() || id(refresh_thermostats).is_running()) || id(music_busy) || id(music_favorites_loading) || !id(sonos_favorites).known) return;
          const auto &items = id(sonos_favorites).items;
          const int scroll = lv_obj_get_scroll_y(id(music_favorites_grid));
          const int height = lv_obj_get_height(id(music_favorites_grid));
          for (size_t i = 0; i < items.size(); ++i) {
            const int columns = id(music_page_open) ? 3 : 5;
            const int y = int(i / columns) * 48 - scroll;
            if (y + 44 <= 0 || y >= height || items[i].cover.empty() || id(favorite_artwork).attempted(items[i].cover)) continue;
            id(favorite_artwork).begin(items[i].cover);
            id(favorite_cover_download).set_url(items[i].cover);
            id(favorite_cover_download).update();
            break;  // One request at a time; failed covers keep their icon.
          }

  - id: open_music_page
    then:
      - lambda: |-
          id(detail_page_open) = 0;
          id(music_page_open) = true;
          id(detail_tab) = 1;
          lv_obj_set_parent(id(shared_energy_header), id(sonos_page)->obj);
          lv_obj_set_pos(id(shared_energy_header), 0, 0);
      - lvgl.page.show: sonos_page
      - script.execute: render_energy_header
      - script.execute: render_music
      # Show the new page before synchronous HTTP work can block touch/render.
      - delay: 100ms
      - if:
          condition:
            lambda: return !id(music_busy);
          then:
            - script.execute: refresh_music
      - script.execute: refresh_music_favorites

  - id: close_music_page
    then:
      - lambda: |-
          id(music_page_open) = false;
          id(detail_tab) = 1;
          lv_obj_set_parent(id(shared_energy_header), id(energydeck_main_page)->obj);
          lv_obj_set_pos(id(shared_energy_header), 0, 0);
      - lvgl.page.show: energydeck_main_page
      - script.execute: render_energy_header
      - script.execute: select_detail_tab

  # Read-only polls and explicitly clicked commands share one serialized queue.
  - id: sonos_requests
    mode: single
    then:
      - while:
          condition:
            lambda: return id(sonos).has_request() && (!id(music_room_refresh_pending) || id(music_busy));
          then:
            # Playback/status and favorites share one bounded worker. Only the
            # owning script consumes its reply; models and LVGL stay on this loop.
            - wait_until:
                lambda: return !id(sonos_transport).busy();
            # Recheck after waiting for Browse/activity: a click may have arrived
            # while another owner still held the worker. Drain only our sent read.
            - if:
                condition:
                  lambda: return !id(music_room_refresh_pending) || id(music_busy);
                then:
                  - lambda: |-
                      const auto &request = id(sonos).request();
                      id(sonos_transport).submit(request, id(sonos).request_timeout_ms());
                  - wait_until:
                      lambda: return id(sonos_transport).ready() && esphome::ui_performance::background_allowed();
                  - lambda: |-
                      auto reply = id(sonos_transport).take();
                      const bool discovery = id(sonos).request().action == "GetZoneGroupState";
                      ESP_LOGD("network_performance", "Sonos %s: %u ms (background)", id(sonos).request().action.c_str(), static_cast<unsigned>(reply.duration_ms));
                      const auto action = id(sonos).request().action;
                      const bool command = id(sonos).command_active();
                      id(sonos).accept(reply.status, reply.body);
                      if (command && id(sonos).command_failed)
                        ESP_LOGW("sonos_local", "Command stopped: %s, HTTP %d, UPnP/readiness %d",
                          action.c_str(), reply.status, id(sonos).command_error);
                      if (discovery && id(sonos).publish_discovery()) id(render_music_systems).execute();
                      if (id(music_refresh_selected_only) && !id(music_room_refresh_pending) && id(sonos).publish_current())
                        id(render_music).execute();
            # Readiness polls yield cooperatively while Sonos changes source.
            # Ordinary requests retain their short yield; no write is retried.
            - delay: !lambda return id(sonos).request_delay_ms();

  - id: refresh_music
    mode: single
    then:
      - lambda: |-
          id(music_refresh_selected_only) = id(music_room_refresh_pending) && !id(music_busy);
          id(music_room_refresh_pending) = false;
          if (id(music_refresh_selected_only)) id(sonos).begin_current();
          else id(sonos).begin("${sonos_bootstrap_address}", "${sonos_bootstrap_fallback_address}");
      - script.execute: sonos_requests
      - script.wait: sonos_requests
      - lambda: |-
          // A new choice abandons the remaining reads, not the immutable reply.
          // Publishing that partial poll would erase unrelated cached snapshots.
          if (id(music_room_refresh_pending) && !id(music_busy)) return;
          id(sonos).finish();
          if (!id(music_room_refresh_pending)) id(music_selection_loading) = false;
          if (id(music_favorite_pending) && id(sonos).command_confirmed()) {
            id(music_favorite_pending) = false;
            id(music_command_failed) = false;
            id(music_favorite_timeout).stop();
          }
          // Acknowledged controls release the UI before read-back. The latest
          // pending action is confirmed by ordinary polls, never resent.
          if (id(music_control_pending)) {
            if (id(sonos).command_confirmed()) id(music_control_pending) = false;
            else if (millis() - id(music_control_started) >= 15000) {
              id(music_control_pending) = false;
              id(music_command_failed) = true;
            }
          }
          ESP_LOGD("sonos_local", "Direct Sonos: selected=%d grouped=%d known=%d playing=%d tv=%d",
            id(sonos).selected, id(sonos).grouped(), id(sonos).current().known(),
            id(sonos).current().playing, id(sonos).current().tv);
      - script.execute: render_music
      - if:
          condition:
            # The selected snapshot is already visible; other zones are optional.
            lambda: return !id(music_refresh_selected_only) && !id(music_busy) && !id(music_room_refresh_pending) && !id(music_selection_loading);
          then:
            - script.execute: refresh_music_room_activity
            - script.wait: refresh_music_room_activity
      - if:
          condition:
            lambda: |-
              return id(sonos_room_activity).follow_dashboard(id(sonos),
                !id(music_page_open) && !id(music_busy) &&
                !id(music_selection_loading) && !id(music_room_refresh_pending) &&
                !id(music_favorite_pending) && !id(music_control_pending));
          then:
            - lambda: |-
                ESP_LOGI("sonos_local", "Dashboard follows Sonos room: %s", id(sonos).current_name().c_str());
            # Fetch only the newly followed room, using this cycle's topology.
            # This serialized read does not start playback or write any setting.
            - if:
                condition:
                  lambda: return !id(sonos).current().known();
                then:
                  - lambda: id(sonos).begin_current();
                  - script.execute: sonos_requests
                  - script.wait: sonos_requests
                  - lambda: id(sonos).finish();
      # A click only changes the visible choice and this coalesced refresh flag.
      # Drain old replies safely, then fetch the latest choice without UI locks.
      - while:
          condition:
            lambda: return id(music_room_refresh_pending) && !id(music_busy) && !id(music_favorite_pending);
          then:
            - lambda: |-
                id(music_room_refresh_pending) = false;
                id(music_refresh_selected_only) = true;
                id(sonos).begin_current();
            - script.execute: sonos_requests
            - script.wait: sonos_requests
            - lambda: |-
                if (!id(music_room_refresh_pending)) {
                  id(sonos).finish();
                  id(music_selection_loading) = false;
                }
            - script.execute: render_music
      - lambda: |-
          if (!id(music_room_refresh_pending)) id(music_selection_loading) = false;
          // Do not consume playback edges while a command/selection is settling.
          // A favorite's temporary STOPPED state must not dismiss its player.
          if (id(music_busy) || id(music_favorite_pending) || id(music_control_pending) ||
              id(music_selection_loading) || id(music_room_refresh_pending)) return;
          // All-room activity must be available before consuming playback edges.
          // Close first: Back selects Sonos, then the stop edge selects home/Gas.
          if (id(music_page_open) && id(sonos).playback_stopped()) id(close_music_page).execute();
          id(detail_tab) = id(sonos).follow_compact_tab(id(detail_tab));
      - script.execute: select_detail_tab

  - id: refresh_music_room_activity
    mode: single
    then:
      - lambda: |-
          id(sonos_room_activity).begin(id(sonos));
          id(music_room_activity_started) = millis();
      - while:
          condition:
            lambda: return id(sonos_room_activity).has_request() && !id(music_busy) && !id(music_room_refresh_pending) && millis() - id(music_room_activity_started) < 4000;
          then:
            - wait_until:
                lambda: return !id(sonos_transport).busy();
            # Waiting for another owner may span a click. Do not start another
            # display-only read after selection or a command claimed priority.
            - if:
                condition:
                  lambda: return !id(music_busy) && !id(music_room_refresh_pending) && millis() - id(music_room_activity_started) < 4000;
                then:
                  - lambda: id(sonos_transport).submit(id(sonos_room_activity).request(), 1000);
                  - wait_until:
                      lambda: return id(sonos_transport).ready() && esphome::ui_performance::background_allowed();
                  - lambda: |-
                      auto reply = id(sonos_transport).take();
                      ESP_LOGD("network_performance", "Sonos room activity: %u ms (background)", static_cast<unsigned>(reply.duration_ms));
                      id(sonos_room_activity).accept(reply.status, reply.body);
            - delay: 10ms
      - lambda: id(sonos_room_activity).finish();

  - id: switch_music_room
    then:
      - if:
          condition:
            lambda: return !id(music_busy) && !id(music_favorite_pending);
          then:
            - lambda: id(music_content_tab) = 1;
            - if:
                condition:
                  lambda: return id(music_page_open);
                then:
                  - script.execute: render_music
                else:
                  - script.execute: open_music_page

  - id: select_music_system
    mode: single
    parameters:
      uuid: string
    then:
      - if:
          condition:
            lambda: return !id(music_busy) && !id(music_favorite_pending);
          then:
            - lambda: |-
                if (!id(sonos).select_system(uuid)) return;
                id(music_control_pending) = false;
                id(music_command_failed) = false;
                id(music_room_refresh_pending) = true;
                id(music_selection_loading) = true;
                id(sonos).reset_group_edit();
                // Invalidate the old cover immediately; never connect HTTP in
                // this click handler or let its late image appear for a new room.
                id(music_cover_key).clear();
                lv_obj_add_flag(id(music_cover_widget), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(small_music_cover_widget), LV_OBJ_FLAG_HIDDEN);
            - script.execute: render_music
            - script.execute: refresh_music

  - id: apply_music_group
    mode: single
    then:
      - if:
          condition:
            lambda: return !id(music_busy) && !id(music_favorite_pending) && id(sonos).group_dirty() && id(sonos).group_edit_valid();
          then:
            - lambda: |-
                id(music_busy) = true;
                id(music_control_pending) = false;
                id(music_command_failed) = false;
            - script.execute: render_music
            # Re-read topology before writing; an external regroup cancels the draft.
            - script.wait: refresh_music
            - script.execute: refresh_music
            - script.wait: refresh_music
            - if:
                condition:
                  lambda: return id(sonos).prepare_group();
                then:
                  - script.execute: sonos_requests
                  - script.wait: sonos_requests
                  - lambda: id(music_command_failed) = id(sonos).command_failed;
                  - repeat:
                      count: 3
                      then:
                        - if:
                            condition:
                              lambda: return !id(music_command_failed) && !id(sonos).group_confirmed();
                            then:
                              - delay: 1s
                              - script.execute: refresh_music
                              - script.wait: refresh_music
                  - lambda: |-
                      if (!id(sonos).group_confirmed()) id(music_command_failed) = true;
                else:
                  - lambda: id(music_command_failed) = true;
            # Always read back after partial failure; never retry grouping writes.
            - script.execute: refresh_music
            - script.wait: refresh_music
            - lambda: |-
                id(music_busy) = false;
                id(sonos).reset_group_edit();
            - script.execute: render_music

  - id: music_control
    mode: single
    parameters:
      action: int
    then:
      - if:
          condition:
            lambda: return !id(music_favorite_pending) && !id(music_busy);
          then:
            - lambda: |-
                id(sonos).capture();
                id(music_control_pending) = false;
                id(music_busy) = true;
                id(music_command_failed) = false;
            - script.execute: render_music
            # An existing poll may belong to the previously displayed room.
            # Start our own fresh preflight after it finishes, before any write.
            - script.wait: refresh_music
            - script.execute: refresh_music
            - script.wait: refresh_music
            - if:
                condition:
                  lambda: return id(sonos).prepare_command(action);
                then:
                  - script.execute: sonos_requests
                  - script.wait: sonos_requests
                  - lambda: |-
                      id(music_command_failed) = id(sonos).command_failed;
                      id(music_control_pending) = !id(music_command_failed);
                      id(music_control_started) = millis();
                else:
                  - lambda: id(music_command_failed) = true;
            - lambda: id(music_busy) = false;
            - script.execute: render_music
            # Update when fresh info arrives. Controls do not wait for this poll;
            # the next click still waits for any active poll before scope checks.
            - script.execute: refresh_music

  - id: refresh_music_cover
    then:
      - lambda: |-
          if (!id(music_page_open) && id(detail_tab) != 1) return;
          const auto &room = id(sonos).current();
          const std::string path = room.known() && room.playing && !room.tv ? room.cover : "";
          const std::string key = path.empty() ? "" :
            path + "|" + room.title + "|" + room.artist + "|" + std::to_string(millis() / 60000);
          if (key != id(music_cover_key)) {
            lv_obj_add_flag(id(music_cover_widget), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(small_music_cover_widget), LV_OBJ_FLAG_HIDDEN);
          }
          id(music_cover_key) = key;
          if (id(music_cover_downloading)) return;
          if (key == id(music_cover_requested)) {
            if (!path.empty()) {
              lv_obj_clear_flag(id(music_cover_widget), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(small_music_cover_widget), LV_OBJ_FLAG_HIDDEN);
            }
            return;
          }
          if (!path.empty()) {
            // Defer new artwork work while browsing rooms so control/data jobs
            // and user interaction retain priority over background downloads.
            if (id(music_page_open) && id(music_content_tab) == 1) return;
            if (id(music_page_open) && (lv_obj_is_scrolling(id(music_systems_list)) || lv_obj_is_scrolling(id(music_favorites_grid)))) {
              id(refresh_music_cover_after_scroll).execute();
              return;
            }
            // Finish the higher-priority climate refresh before queuing artwork.
            if (id(favorite_artwork).busy || (id(refresh_climate).is_running() || id(refresh_thermostats).is_running())) return;
            // Detach both consumers before the decoder mutates its shared buffer.
            lv_image_set_src(id(music_cover_widget), static_cast<const void *>(nullptr));
            lv_image_set_src(id(small_music_cover_widget), static_cast<const void *>(nullptr));
            lv_image_cache_drop(id(music_cover).get_lv_image_dsc());
            id(music_cover_requested) = key;
            id(music_cover_downloading) = true;
            id(music_cover).set_url(path);
            id(music_cover).update();
          }

  - id: refresh_music_cover_after_scroll
    mode: single
    then:
      # Queue background artwork only after a drag settles; this waiter exists
      # only as needed and keeps scrolling ahead of lower-priority image work.
      - wait_until:
          lambda: return !id(music_page_open) || (!lv_obj_is_scrolling(id(music_systems_list)) && !lv_obj_is_scrolling(id(music_favorites_grid)));
      - script.execute: refresh_music_cover

  - id: render_music_after_scroll
    mode: single
    then:
      - wait_until:
          lambda: return !id(music_page_open) || (!lv_obj_is_scrolling(id(music_systems_list)) && !lv_obj_is_scrolling(id(music_favorites_grid)));
      - script.execute: render_music

  - id: select_detail_tab
    then:
      - lambda: |-
          // Polling calls this too. Restyling the same tab invalidates its card
          // without changing anything; still refresh content below the lambda.
          static int previous_tab = -1;
          if (previous_tab == id(detail_tab)) return;
          previous_tab = id(detail_tab);
          lv_obj_t *cards[] = {id(gas_card), id(music_card), id(extra_card)};
          for (int i = 0; i < 3; ++i) {
            if (id(detail_tab) == i) lv_obj_clear_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_t *tabs[] = {id(gas_tab), id(music_tab), id(extra_tab)};
          const uint32_t accents[] = {0xFF3485, 0x45BD70, 0x5799E4};
          const uint32_t fills[] = {0x672B4B, 0x24583B, 0x294E77};
          for (int i = 0; i < 3; ++i) {
            const bool active = i == id(detail_tab);
            lv_obj_set_style_bg_color(tabs[i], lv_color_hex(active ? fills[i] : 0x18231E), 0);
            lv_obj_set_style_border_color(tabs[i], lv_color_hex(active ? accents[i] : 0x34463C), 0);
            lv_obj_set_style_border_width(tabs[i], active ? 2 : 1, 0);
          }
      - script.execute: render_music
      - script.execute: refresh_music_cover
      - if:
          condition:
            lambda: return id(detail_tab) == 1 && !(id(music_page_open) && id(music_content_tab) == 1) && !id(sonos_favorites).known && !id(music_favorites_loading);
          then:
            - script.execute: refresh_music_favorites

  - id: render_music
    then:
      - lambda: |-
          // Keep periodic style/layout work out of a drag, including momentum.
          // The model keeps receiving replies; render its newest state afterward.
          if (id(music_page_open) && (lv_obj_is_scrolling(id(music_systems_list)) || lv_obj_is_scrolling(id(music_favorites_grid)))) {
            id(render_music_after_scroll).execute();
            return;
          }
          const auto &s = id(sonos);
          const auto &room = s.current();
          const bool known = room.known();
          const bool playing = known && room.playing;
          const bool waiting = id(music_busy) || id(music_favorite_pending);
          const char *status = waiting ? "${music_button_wait}" :
            id(music_command_failed) ? "${music_control_failed}" :
            s.group_dirty() && !s.group_edit_valid() ? "${music_group_changed}" :
            !known ? (id(music_selection_loading) ? "${music_updating}" : "${music_offline}") : playing ? "" : "${music_paused}";
          esphome::ui_performance::set_text(id(music_status), status);
          lv_obj_set_style_text_color(id(music_status),
            lv_color_hex(id(music_command_failed) || !known ? 0xEA665F : 0x7FE0A2), 0);
          const std::string room_heading = s.explicitly_selected() ? s.current_name() :
            s.grouped() ? "${music_rooms}" : s.selected == 0 ? "${music_living_select}" : "${music_kitchen_select}";
          esphome::ui_performance::set_text(lv_obj_get_child(id(music_room_select), 0), room_heading.c_str());
          if (waiting) lv_obj_add_state(id(music_room_select), LV_STATE_DISABLED);
          else lv_obj_clear_state(id(music_room_select), LV_STATE_DISABLED);
          // Group names are typography, never a disabled grey button slab.
          for (auto state : {LV_STATE_DEFAULT, LV_STATE_DISABLED, LV_STATE_FOCUSED, LV_STATE_PRESSED}) {
            lv_obj_set_style_bg_opa(id(music_room_select), LV_OPA_TRANSP, state);
            lv_obj_set_style_border_width(id(music_room_select), 0, state);
            lv_obj_set_style_text_color(lv_obj_get_child(id(music_room_select), 0), lv_color_hex(0xA9B8AE), state);
          }
          lv_obj_align(lv_obj_get_child(id(music_room_select), 0), LV_ALIGN_LEFT_MID, 0, 0);
          lv_obj_set_style_bg_opa(id(music_room_select), LV_OPA_TRANSP, lv_obj_get_state(id(music_room_select)));
          lv_obj_set_style_border_width(id(music_room_select), 0, lv_obj_get_state(id(music_room_select)));
          esphome::ui_performance::set_text(id(music_title), !known ? (id(music_selection_loading) ? "${music_updating}" : "${music_offline}") :
            playing && room.tv ? "${music_tv}" :
            playing && !room.title.empty() ? room.title.c_str() :
            playing ? "${music_playing}" : "${music_ready}");
          esphome::ui_performance::set_text(id(music_artist), playing && !room.tv ? room.artist.c_str() : "");
          esphome::ui_performance::set_text(id(music_cover_fallback), room.tv ? "${music_tv}" : LV_SYMBOL_AUDIO);
          char a[12], b[12];
          for (int i = 0; i < 2; ++i) {
            char *v = i == 0 ? a : b;
            if (s.rooms[i].known() && s.rooms[i].volume >= 0) snprintf(v, 12, "%d%%", s.rooms[i].volume);
            else snprintf(v, 12, "--");
          }
          const std::string selected_volume = known && room.volume >= 0 ? std::to_string(room.volume) + "%" : "--";
          if (s.uses_pair_controls()) esphome::ui_performance::set_text_fmt(id(music_volume), "${music_volume_format}", a, b);
          else esphome::ui_performance::set_text_fmt(id(music_volume), "${music_single_volume_format}", selected_volume.c_str());
          esphome::ui_performance::set_text(lv_obj_get_child(id(music_play), 0),
            waiting ? LV_SYMBOL_REFRESH : room.tv ? "${music_tv}" : playing ? LV_SYMBOL_PAUSE : LV_SYMBOL_PLAY);
          esphome::ui_performance::set_text(lv_obj_get_child(id(music_mute), 0), s.muted() ? "${music_unmute}" : "${music_mute}");
          esphome::ui_performance::set_style_bg_color(id(music_mute), lv_color_hex(s.muted() ? 0x66512A : 0x18231E), LV_PART_MAIN);
          for (auto *button : {id(music_play), id(music_minus), id(music_plus), id(music_previous), id(music_next), id(music_mute)}) {
            bool unavailable = !known;
            if (button == id(music_play)) unavailable |= room.tv;
            else if (button == id(music_minus) || button == id(music_plus)) unavailable |= !s.can_volume();
            else if (button == id(music_previous)) unavailable |= room.tv || !room.previous;
            else if (button == id(music_next)) unavailable |= room.tv || !room.next;
            else unavailable |= !s.can_mute();
            if (waiting || unavailable) lv_obj_add_state(button, LV_STATE_DISABLED);
            else lv_obj_clear_state(button, LV_STATE_DISABLED);
          }
          const bool block_favorites = waiting || id(music_favorites_loading) || !s.can_favorite() || !id(sonos_favorites).known;
          for (uint32_t i = 0; i < lv_obj_get_child_count(id(music_favorites_grid)); ++i) {
            auto *button = lv_obj_get_child(id(music_favorites_grid), i);
            if (block_favorites) lv_obj_add_state(button, LV_STATE_DISABLED);
            else lv_obj_clear_state(button, LV_STATE_DISABLED);
          }
          // Reuse the same favorite widgets in both views, retaining covers and
          // click handlers without a second list or additional image buffers.
          const bool compact_favorites = !id(music_page_open) && !s.any_playing();
          auto *parent = compact_favorites ? id(music_card) : id(sonos_page)->obj;
          if (lv_obj_get_parent(id(music_favorites_grid)) != parent) {
            lv_obj_set_parent(id(music_favorites_grid), parent);
            lv_obj_set_parent(id(music_favorites_status), parent);
            lv_obj_scroll_to_y(id(music_favorites_grid), 0, LV_ANIM_OFF);
          }
          lv_obj_set_pos(id(music_favorites_grid), compact_favorites ? 10 : 14, compact_favorites ? 34 : 586);
          lv_obj_set_size(id(music_favorites_grid), compact_favorites ? 274 : 452, compact_favorites ? 98 : 200);
          lv_obj_set_pos(id(music_favorites_status), compact_favorites ? 10 : 24, compact_favorites ? 62 : 654);
          lv_obj_set_width(id(music_favorites_status), compact_favorites ? 274 : 432);
          // The dashboard keeps its idle favorites regardless of the detail tab.
          const bool favorites_visible = compact_favorites || id(music_content_tab) == 0;
          for (auto *widget : {id(music_favorites_grid), id(music_favorites_status)}) {
            if (favorites_visible) lv_obj_clear_flag(widget, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(widget, LV_OBJ_FLAG_HIDDEN);
          }
          if (id(music_content_tab) == 1) lv_obj_clear_flag(id(music_systems_list), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(music_systems_list), LV_OBJ_FLAG_HIDDEN);
          for (auto *widget : {id(music_group_apply), id(music_group_reset)}) {
            if (id(music_content_tab) == 1) lv_obj_clear_flag(widget, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(widget, LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_t *content_tabs[] = {id(music_favorites_tab), id(music_systems_tab)};
          for (int i = 0; i < 2; ++i) {
            const bool active = i == id(music_content_tab);
            lv_obj_set_style_bg_color(content_tabs[i], lv_color_hex(active ? 0x24583B : 0x18231E), 0);
            lv_obj_set_style_border_color(content_tabs[i], lv_color_hex(active ? 0x45BD70 : 0x34463C), 0);
            lv_obj_set_style_border_width(content_tabs[i], active ? 2 : 1, 0);
          }
          if (compact_favorites) {
            esphome::ui_performance::set_text(id(music_favorites_status), id(music_favorites_loading) ? "${music_favorites_loading}" :
              !id(sonos_favorites).known ? "${music_favorites_error}" : id(sonos_favorites).items.empty() ? "${music_favorites_empty}" : "");
          }
          for (uint32_t i = 0; i < lv_obj_get_child_count(id(music_favorites_grid)); ++i) {
            auto *tile = lv_obj_get_child(id(music_favorites_grid), i);
            // Keep a 44 px touch target around the 32 px artwork. Five columns
            // expose ten favorites without shrinking the icons or row spacing.
            const int columns = compact_favorites ? 5 : 3;
            lv_obj_set_pos(tile, (i % columns) * (compact_favorites ? 54 : 150), (i / columns) * 48);
            lv_obj_set_width(tile, compact_favorites ? 44 : 146);
            auto *title = lv_obj_get_child(tile, 1);
            if (compact_favorites) lv_obj_add_flag(title, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_clear_flag(title, LV_OBJ_FLAG_HIDDEN);
          }
          for (auto *widget : {id(small_music_title), id(small_music_artist), id(small_music_volume),
              id(small_music_cover_frame), id(small_music_detail_target),
              id(small_music_minus), id(small_music_plus), id(small_music_play)}) {
            if (compact_favorites) lv_obj_add_flag(widget, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_clear_flag(widget, LV_OBJ_FLAG_HIDDEN);
          }
          if (compact_favorites) lv_obj_add_flag(id(small_music_cover_widget), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_pos(id(small_music_room_select), compact_favorites ? 10 : 114, compact_favorites ? 3 : 6);
          lv_obj_set_size(id(small_music_room_select), compact_favorites ? 274 : 170, compact_favorites ? 30 : 28);
          auto *room_label = lv_obj_get_child(id(small_music_room_select), 0);
          lv_obj_set_size(room_label, compact_favorites ? 274 : 170, compact_favorites ? 16 : 28);
          lv_label_set_long_mode(room_label, LV_LABEL_LONG_DOT);
          lv_obj_set_style_text_align(room_label, LV_TEXT_ALIGN_LEFT, 0);
          lv_obj_align(room_label, LV_ALIGN_LEFT_MID, 0, 0);
          // Status replaces the artist row when paused, offline or waiting;
          // a separate top-right status would compete with the room name.
          if (compact_favorites || status[0] == '\0') lv_obj_add_flag(id(small_music_status), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_clear_flag(id(small_music_status), LV_OBJ_FLAG_HIDDEN);
          if (!compact_favorites && status[0] != '\0') lv_obj_add_flag(id(small_music_artist), LV_OBJ_FLAG_HIDDEN);
          // Compact and full players share the same snapshot and command state.
          const std::pair<lv_obj_t *, lv_obj_t *> labels[] = {
            {id(small_music_title), id(music_title)}, {id(small_music_artist), id(music_artist)},
            {id(small_music_status), id(music_status)}, {id(small_music_volume), id(music_volume)}
          };
          for (const auto &pair : labels) {
            esphome::ui_performance::set_text(pair.first, lv_label_get_text(pair.second));
            lv_obj_set_style_text_color(pair.first, lv_obj_get_style_text_color(pair.second, LV_PART_MAIN), 0);
          }
          // Collapse the unused artist row and spare title line. Bound the
          // measured title to two lines so secondary text stays above controls.
          lv_point_t title_size;
          lv_text_get_size(&title_size, lv_label_get_text(id(small_music_title)), &lv_font_montserrat_14,
            0, 0, 170, LV_TEXT_FLAG_NONE);
          const int secondary_y = 38 + std::min(32, int(title_size.y)) + 2;
          lv_obj_set_y(id(small_music_artist), secondary_y);
          lv_obj_set_y(id(small_music_status), secondary_y);
          const bool secondary_text = status[0] != '\0' || (playing && !room.artist.empty());
          lv_obj_set_y(id(small_music_volume), secondary_y + (secondary_text ? 16 : 0));
          const std::pair<lv_obj_t *, lv_obj_t *> buttons[] = {
            {id(small_music_room_select), id(music_room_select)}, {id(small_music_play), id(music_play)},
            {id(small_music_minus), id(music_minus)}, {id(small_music_plus), id(music_plus)}
          };
          for (const auto &pair : buttons) {
            esphome::ui_performance::set_text(lv_obj_get_child(pair.first, 0), lv_label_get_text(lv_obj_get_child(pair.second, 0)));
            if (lv_obj_has_state(pair.second, LV_STATE_DISABLED)) lv_obj_add_state(pair.first, LV_STATE_DISABLED);
            else lv_obj_clear_state(pair.first, LV_STATE_DISABLED);
          }
          if (compact_favorites && (waiting || id(music_command_failed)))
            esphome::ui_performance::set_text(lv_obj_get_child(id(small_music_room_select), 0), status);
          // Retain clear word labels in the compact card's existing layout.
          esphome::ui_performance::set_text(lv_obj_get_child(id(small_music_play), 0),
            waiting ? "${music_button_wait}" : room.tv ? "${music_tv}" : playing ? "${music_pause}" : "${music_resume}");
          if (s.uses_pair_controls()) {
            // Compact percentages follow the room heading's living/kitchen order.
            esphome::ui_performance::set_text_fmt(id(small_music_volume), "${music_compact_pair_volume_format}", a, b);
            esphome::ui_performance::set_text_fmt(id(music_volume), "${music_volume_side_format}", a, b);
          }
          // Explicit combined-state styling prevents the LVGL disabled theme
          // from reintroducing filled rectangles around secondary controls.
          const lv_state_t plain_states[] = {LV_STATE_DEFAULT, LV_STATE_DISABLED, LV_STATE_FOCUSED, LV_STATE_PRESSED,
            static_cast<lv_state_t>(LV_STATE_DISABLED | LV_STATE_FOCUSED)};
          for (auto *button : {id(small_music_room_select), id(music_back), id(music_previous), id(music_next), id(music_minus), id(music_plus), id(music_mute)}) {
            const bool disabled = lv_obj_has_state(button, LV_STATE_DISABLED);
            for (auto state : plain_states) {
              lv_obj_set_style_bg_opa(button, LV_OPA_TRANSP, state);
              lv_obj_set_style_border_width(button, 0, state);
              lv_obj_set_style_shadow_width(button, 0, state);
            }
            lv_obj_set_style_bg_opa(button, LV_OPA_TRANSP, lv_obj_get_state(button));
            lv_obj_set_style_border_width(button, 0, lv_obj_get_state(button));
            lv_obj_set_style_text_color(lv_obj_get_child(button, 0), lv_color_hex(disabled ? 0x67756D :
              button == id(small_music_room_select) ? 0x7FE0A2 : button == id(music_mute) && s.muted() ? 0xE8B94C : 0xEEF6F0), 0);
          }
      - script.execute: render_music_systems

  - id: render_music_systems
    then:
      - lambda: |-
          if (!id(music_page_open) || id(music_content_tab) != 1) return;
          if (lv_obj_is_scrolling(id(music_systems_list))) {
            id(render_music_after_scroll).execute();
            return;
          }
          auto &s = id(sonos);
          s.sync_group_edit();
          const bool waiting = id(music_busy) || id(music_favorite_pending);
          const bool valid = s.group_edit_valid();
          if (waiting || !s.group_dirty() || !valid) lv_obj_add_state(id(music_group_apply), LV_STATE_DISABLED);
          else lv_obj_clear_state(id(music_group_apply), LV_STATE_DISABLED);
          if (waiting || !s.group_dirty()) lv_obj_add_state(id(music_group_reset), LV_STATE_DISABLED);
          else lv_obj_clear_state(id(music_group_reset), LV_STATE_DISABLED);
          for (auto *button : {id(music_group_apply), id(music_group_reset)}) {
            const bool disabled = lv_obj_has_state(button, LV_STATE_DISABLED);
            // The theme applies a grey recolor overlay to disabled buttons.
            // Remove it as well as overriding combined focused/disabled styles.
            for (auto state : {static_cast<lv_state_t>(LV_STATE_DEFAULT),
                static_cast<lv_state_t>(LV_STATE_DISABLED), lv_obj_get_state(button)}) {
              lv_obj_set_style_bg_color(button, lv_color_hex(disabled ? 0x151E19 : button == id(music_group_apply) ? 0x24583B : 0x18231E), state);
              lv_obj_set_style_border_color(button, lv_color_hex(disabled ? 0x26362D : button == id(music_group_apply) ? 0x45BD70 : 0x34463C), state);
              lv_obj_set_style_bg_opa(button, LV_OPA_COVER, state);
              lv_obj_set_style_recolor_opa(button, LV_OPA_TRANSP, state);
              lv_obj_set_style_text_color(lv_obj_get_child(button, 0), lv_color_hex(disabled ? 0x77857C : 0xEEF6F0), state);
            }
          }
          // Include UUIDs and draft state; renamed/reordered zones must never
          // leave a displayed button pointing at another speaker.
          std::vector<std::array<std::string, 3>> rows;
          const energydeck_sonos::Room *polled[] = {&s.rooms[0], &s.rooms[1], &s.current()};
          const auto order = id(sonos_room_activity).order(s);
          std::string signature = s.systems_known ? "known" : "unknown";
          signature += s.current().uuid + (waiting ? "busy" : "idle") + (valid ? "valid" : "stale");
          for (const auto index : order) {
            const auto &system = s.systems[index];
            std::string group;
            int members = 0;
            for (const auto &other : s.systems) if (other.coordinator == system.coordinator) {
              if (members++) group += " + ";
              group += other.name;
            }
            group = members > 1 ? std::string("${music_system_group}") + group : "${music_system_solo}";
            const bool checked = s.group_checked(system.uuid);
            if (s.group_dirty()) {
              if (checked && system.coordinator != s.current().coordinator)
                group = std::string("${music_group_join}") + s.current_name();
              else if (!checked && system.coordinator == s.current().coordinator)
                group = "${music_group_leave}";
            }
            const char *status = "${music_system_detected}";
            const auto activity = id(sonos_room_activity).transport(system);
            if (activity == energydeck_sonos::RoomActivity::PLAYING) status = "${music_playing}";
            else if (activity == energydeck_sonos::RoomActivity::STOPPED) status = "${music_paused}";
            else if (activity == energydeck_sonos::RoomActivity::TRANSITIONING) status = "${music_waiting}";
            for (const auto *room : polled) if (room->topology && room->coordinator == system.coordinator) {
              status = !room->known() ? "${music_offline}" : room->transitioning ? "${music_waiting}" :
                room->playing ? (room->tv ? "${music_tv}" : "${music_playing}") : "${music_paused}";
              break;
            }
            rows.push_back({system.name, group, status});
            signature += std::to_string(system.uuid.size()) + ":" + system.uuid + (checked ? "checked" : "unchecked");
            for (const auto &value : rows.back()) signature += std::to_string(value.size()) + ":" + value;
          }
          static std::string previous_signature;
          if (signature == previous_signature) return;
          previous_signature = signature;
          static std::vector<std::string> previous_ids, previous_rows;
          std::vector<std::string> ids;
          for (const auto index : order) ids.push_back(s.systems[index].uuid);
          const bool rebuild = ids != previous_ids ||
            lv_obj_get_child_count(id(music_systems_list)) != (rows.empty() ? 1 : rows.size() * 2);
          const int scroll = lv_obj_get_scroll_y(id(music_systems_list));
          if (rebuild) {
            // Only actual inventory/order changes replace widgets. Status,
            // selection and draft updates must not interrupt an active drag.
            lv_obj_clean(id(music_systems_list));
            previous_ids = ids;
            previous_rows.assign(rows.size(), "");
          }
          if (rows.empty()) {
            auto *label = rebuild ? lv_label_create(id(music_systems_list)) : lv_obj_get_child(id(music_systems_list), 0);
            if (rebuild) {
              lv_obj_set_width(label, 432);
              lv_obj_set_style_text_align(label, LV_TEXT_ALIGN_CENTER, 0);
              lv_obj_set_style_text_color(label, lv_color_hex(0xA9B8AE), 0);
              lv_obj_align(label, LV_ALIGN_TOP_MID, 0, 60);
            }
            esphome::ui_performance::set_text(label, s.systems_known ? "${music_systems_empty}" : "${music_systems_unavailable}");
          }
          for (size_t i = 0; i < rows.size(); ++i) {
            const auto &system = s.systems[order[i]];
            const bool selected = system.uuid == s.current().uuid;
            const bool checked = s.group_checked(system.uuid);
            lv_obj_t *choose, *membership;
            if (rebuild) {
              choose = lv_button_create(id(music_systems_list));
              membership = lv_button_create(id(music_systems_list));
              for (auto *button : {choose, membership}) {
                lv_obj_remove_style_all(button);
                lv_obj_set_size(button, button == choose ? 370 : 74, 50);
                lv_obj_set_pos(button, button == choose ? 0 : 378, i * 56);
                lv_obj_set_style_radius(button, 6, 0);
                lv_obj_set_style_bg_opa(button, LV_OPA_COVER, 0);
                lv_obj_set_style_bg_color(button, lv_color_hex(0x18231E), 0);
                lv_obj_set_style_bg_color(button, lv_color_hex(0x24583B), LV_STATE_PRESSED);
                lv_obj_clear_flag(button, LV_OBJ_FLAG_SCROLLABLE);
                // LVGL buttons scroll themselves into view when touch focuses
                // them. A partly visible row then animates against the drag.
                lv_obj_clear_flag(button, LV_OBJ_FLAG_SCROLL_ON_FOCUS);
              }
              lv_obj_set_style_border_color(choose, lv_color_hex(0x45BD70), 0);
              for (int field = 0; field < 3; ++field) {
                auto *label = lv_label_create(choose);
                lv_obj_set_pos(label, field == 2 ? 252 : 10, field == 1 ? 28 : 6);
                lv_obj_set_size(label, field == 0 ? 238 : field == 1 ? 350 : 108, field == 0 ? 18 : 16);
                lv_label_set_long_mode(label, LV_LABEL_LONG_DOT);
                lv_obj_set_style_text_font(label, field == 0 ? &lv_font_montserrat_14 : &lv_font_montserrat_12, 0);
                if (field == 2) lv_obj_set_style_text_align(label, LV_TEXT_ALIGN_RIGHT, 0);
              }
              auto *mark = lv_label_create(membership);
              lv_obj_set_style_text_font(mark, &lv_font_montserrat_12, 0);
              lv_obj_align(mark, LV_ALIGN_CENTER, 0, 0);
              // UUID copies and callbacks are recreated together only when the
              // inventory changes, so a retained row never targets another zone.
              for (auto *button : {choose, membership}) {
                auto *uuid = lv_label_create(button);
                esphome::ui_performance::set_text(uuid, system.uuid.c_str());
                lv_obj_add_flag(uuid, LV_OBJ_FLAG_HIDDEN);
              }
              lv_obj_add_event_cb(choose, [](lv_event_t *event) {
                auto *button = static_cast<lv_obj_t *>(lv_event_get_target(event));
                const std::string uuid = lv_label_get_text(lv_obj_get_child(button, 3));
                id(select_music_system).execute(uuid);
              }, LV_EVENT_CLICKED, nullptr);
              lv_obj_add_event_cb(membership, [](lv_event_t *event) {
                if (id(music_busy) || id(music_favorite_pending)) return;
                auto *button = static_cast<lv_obj_t *>(lv_event_get_target(event));
                const std::string uuid = lv_label_get_text(lv_obj_get_child(button, 1));
                if (id(sonos).toggle_group(uuid)) id(render_music).execute();
              }, LV_EVENT_CLICKED, nullptr);
            } else {
              choose = lv_obj_get_child(id(music_systems_list), i * 2);
              membership = lv_obj_get_child(id(music_systems_list), i * 2 + 1);
            }
            std::string row_key = std::string(waiting ? "busy" : "idle") + (valid ? "valid" : "stale") +
              (selected ? "selected" : "other") + (checked ? "checked" : "unchecked");
            for (const auto &value : rows[i]) row_key += std::to_string(value.size()) + ":" + value;
            if (row_key == previous_rows[i]) continue;
            previous_rows[i] = row_key;
            for (auto *button : {choose, membership}) {
              if (waiting || (button == membership && (!valid || selected))) lv_obj_add_state(button, LV_STATE_DISABLED);
              else lv_obj_clear_state(button, LV_STATE_DISABLED);
            }
            lv_obj_set_style_border_width(choose, selected ? 2 : 0, 0);
            for (int field = 0; field < 3; ++field) {
              auto *label = lv_obj_get_child(choose, field);
              lv_obj_set_style_text_color(label, lv_color_hex(waiting ? 0x77857C : field == 0 ? 0xEEF6F0 : field == 2 ? 0x7FE0A2 : 0xA9B8AE), 0);
              esphome::ui_performance::set_text(label, rows[i][field].c_str());
            }
            lv_obj_set_style_bg_color(membership, lv_color_hex(checked ? 0x24583B : 0x18231E), 0);
            lv_obj_set_style_border_width(membership, checked ? 2 : 1, 0);
            lv_obj_set_style_border_color(membership, lv_color_hex(checked ? 0x45BD70 : 0x34463C), 0);
            auto *mark = lv_obj_get_child(membership, 0);
            lv_obj_set_style_text_color(mark, lv_color_hex(waiting || !valid ? 0x77857C : 0xEEF6F0), 0);
            esphome::ui_performance::set_text(mark, selected ? "${music_group_leader}" : checked ? LV_SYMBOL_OK : LV_SYMBOL_PLUS);
          }
          if (rebuild) {
            lv_obj_update_layout(id(music_systems_list));
            lv_obj_scroll_to_y(id(music_systems_list), scroll, LV_ANIM_OFF);
          }

  - id: sonos_favorite_requests
    mode: single
    then:
      - while:
          condition:
            lambda: return id(sonos_favorites).has_request();
          then:
            - wait_until:
                lambda: return !id(sonos_transport).busy() && !id(music_room_refresh_pending) && !id(music_selection_loading);
            # Browse is a read too: one slow favorites page must not hold the
            # shared worker for eight seconds after a room was tapped.
            - lambda: id(sonos_transport).submit(id(sonos_favorites).request(), 1500);
            - wait_until:
                lambda: return id(sonos_transport).ready() && esphome::ui_performance::background_allowed();
            - lambda: |-
                auto reply = id(sonos_transport).take();
                ESP_LOGD("network_performance", "Sonos Browse: %u ms (background)", static_cast<unsigned>(reply.duration_ms));
                id(sonos_favorites).accept(reply.status, reply.body);
            - delay: 10ms

  - id: refresh_music_favorites
    mode: single
    then:
      - if:
          condition:
            lambda: return !id(music_busy) && !id(music_favorite_pending) && !(id(music_page_open) && id(music_content_tab) == 1);
          then:
            - lambda: |-
                id(music_favorites_loading) = true;
                esphome::ui_performance::set_text(id(music_favorites_status), "${music_favorites_loading}");
                id(sonos_favorites).begin(id(sonos).current().host.empty() ?
                  "${sonos_bootstrap_fallback_address}" : id(sonos).current().host);
            - script.execute: render_music
            - script.execute: sonos_favorite_requests
            - script.wait: sonos_favorite_requests
            - if:
                condition:
                  lambda: return id(sonos_favorites).failed;
                then:
                  - lambda: |-
                      id(sonos_favorites).begin(id(sonos).current().host == "${sonos_bootstrap_address}" ? "${sonos_bootstrap_fallback_address}" : "${sonos_bootstrap_address}");
                  - script.execute: sonos_favorite_requests
                  - script.wait: sonos_favorite_requests
            - lambda: id(music_favorites_loading) = false;
            - script.execute: render_music_favorites
            - script.execute: render_music

  - id: render_music_favorites
    then:
      - lambda: |-
          auto &f = id(sonos_favorites);
          esphome::ui_performance::set_text(id(music_favorites_status), !f.known ? "${music_favorites_error}" :
            f.items.empty() ? "${music_favorites_empty}" : "");
          if (!f.known) return;
          static std::string previous_signature;
          const auto signature = f.display_signature();
          if (signature == previous_signature) {
            id(favorite_artwork).retry_failed();
            return; // No rebuild, cover flash or scroll reset on an unchanged poll.
          }
          previous_signature = signature;
          const int scroll = lv_obj_get_scroll_y(id(music_favorites_grid));
          lv_obj_clean(id(music_favorites_grid));
          std::vector<std::string> covers;
          for (const auto &item : f.items) covers.push_back(item.cover);
          id(favorite_artwork).retain(covers);
          ESP_LOGI("sonos_local", "Loaded %u playable Sonos favorites", unsigned(f.items.size()));
          for (size_t i = 0; i < f.items.size(); ++i) {
            auto *button = lv_button_create(id(music_favorites_grid));
            lv_obj_remove_style_all(button);
            lv_obj_set_pos(button, (i % 3) * 150, (i / 3) * 48);
            lv_obj_set_size(button, 146, 44);
            lv_obj_set_style_radius(button, 6, 0);
            lv_obj_set_style_bg_opa(button, LV_OPA_COVER, 0);
            lv_obj_set_style_bg_color(button, lv_color_hex(0x18231E), 0);
            lv_obj_set_style_border_width(button, 0, 0);
            lv_obj_set_style_border_color(button, lv_color_hex(0x34463C), 0);
            lv_obj_set_style_bg_color(button, lv_color_hex(0x24583B), LV_STATE_PRESSED);
            lv_obj_set_style_opa(button, LV_OPA_50, LV_STATE_DISABLED);
            auto *kind = lv_label_create(button);
            lv_obj_set_pos(kind, 6, 6);
            lv_obj_set_size(kind, 32, 32);
            lv_obj_set_style_bg_opa(kind, LV_OPA_COVER, 0);
            lv_obj_set_style_bg_color(kind, lv_color_hex(0x244434), 0);
            lv_obj_set_style_radius(kind, 4, 0);
            lv_obj_set_style_text_align(kind, LV_TEXT_ALIGN_CENTER, 0);
            lv_obj_set_style_pad_top(kind, 8, 0);
            lv_obj_set_style_text_font(kind, &lv_font_montserrat_14, 0);
            lv_obj_set_style_text_color(kind, lv_color_hex(0x7FE0A2), 0);
            esphome::ui_performance::set_text(kind, f.items[i].radio ? LV_SYMBOL_AUDIO : LV_SYMBOL_LIST);
            auto *title = lv_label_create(button);
            lv_obj_set_pos(title, 42, 7);
            lv_obj_set_size(title, 98, 30);
            lv_label_set_long_mode(title, LV_LABEL_LONG_DOT);
            lv_obj_set_style_text_font(title, &lv_font_montserrat_12, 0);
            lv_obj_set_style_text_color(title, lv_color_hex(0xEEF6F0), 0);
            // Hide unsupported display glyphs (e.g. emoji), preserving the
            // original favorite title and playback metadata in the model.
            const auto &raw = f.items[i].title;
            std::string display;
            for (size_t j = 0; j < raw.size();) {
              const size_t start = j;
              const unsigned char lead = raw[j++];
              uint32_t cp = lead;
              int extra = 0;
              if ((lead & 0xE0) == 0xC0) { cp = lead & 0x1F; extra = 1; }
              else if ((lead & 0xF0) == 0xE0) { cp = lead & 0x0F; extra = 2; }
              else if ((lead & 0xF8) == 0xF0) { cp = lead & 0x07; extra = 3; }
              bool valid = lead < 0x80 || extra > 0;
              while (extra-- > 0) {
                if (j >= raw.size() || (static_cast<unsigned char>(raw[j]) & 0xC0) != 0x80) { valid = false; break; }
                cp = (cp << 6) | (raw[j++] & 0x3F);
              }
              lv_font_glyph_dsc_t glyph{};
              if (valid && lv_font_montserrat_14.get_glyph_dsc(&lv_font_montserrat_14, &glyph, cp, 0) && !glyph.is_placeholder)
                display.append(raw, start, j - start);
            }
            if (display.find_first_not_of(' ') == std::string::npos) display = "${music_favorite_playlist}";
            esphome::ui_performance::set_text(title, display.c_str());
            lv_point_t measured;
            lv_text_get_size(&measured, display.c_str(), &lv_font_montserrat_12, 0, 0, 98, LV_TEXT_FLAG_NONE);
            if (measured.y <= lv_font_montserrat_12.line_height) {
              lv_obj_set_height(title, lv_font_montserrat_12.line_height);
              lv_obj_set_y(title, (44 - lv_font_montserrat_12.line_height) / 2);
            }
            auto *cover = lv_image_create(button);
            lv_obj_set_pos(cover, 6, 6);
            lv_obj_set_size(cover, 32, 32);
            lv_obj_add_flag(cover, LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(cover, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_add_event_cb(button, [](lv_event_t *event) {
              const int index = static_cast<int>(reinterpret_cast<uintptr_t>(lv_event_get_user_data(event)));
              id(play_music_favorite).execute(index);
            }, LV_EVENT_CLICKED, reinterpret_cast<void *>(static_cast<uintptr_t>(i)));
          }
          lv_obj_update_layout(id(music_favorites_grid));
          lv_obj_scroll_to_y(id(music_favorites_grid), scroll, LV_ANIM_OFF);
      - script.execute: show_favorite_covers

  - id: play_music_favorite
    mode: single
    parameters:
      index: int
    then:
      - if:
          condition:
            lambda: |-
              return !id(music_busy) && !id(music_favorite_pending) && !id(music_favorites_loading) &&
                id(sonos_favorites).known && index >= 0 && size_t(index) < id(sonos_favorites).items.size();
          then:
            - lambda: |-
                id(music_favorite_copy) = id(sonos_favorites).items[index];
                ESP_LOGI("sonos_local", "Favorite start: %s, room: %s",
                  id(music_favorite_copy).title.c_str(), id(sonos).current_name().c_str());
                id(music_control_pending) = false;
                id(sonos).capture();
                id(music_busy) = true;
                id(music_command_failed) = false;
            - script.execute: render_music
            - delay: 100ms
            - script.wait: refresh_music
            - script.execute: refresh_music
            - script.wait: refresh_music
            - if:
                condition:
                  lambda: return !id(music_command_failed) && id(sonos).prepare_favorite(id(music_favorite_copy));
                then:
                  - script.execute: sonos_requests
                  - script.wait: sonos_requests
                  - lambda: |-
                      id(music_command_failed) = id(sonos).command_failed;
                      id(music_favorite_pending) = !id(music_command_failed);
                  - if:
                      condition:
                        lambda: return id(music_command_failed);
                      then:
                        # A missing acknowledgement does not prove Sonos ignored
                        # the write. Read actual playback once; never send it again.
                        - script.execute: refresh_music
                        - script.wait: refresh_music
                        - lambda: |-
                            if (id(sonos).command_confirmed()) {
                              id(music_command_failed) = false;
                              ESP_LOGI("sonos_local", "Favorite confirmed by fresh playback after command failure");
                            }
                else:
                  - lambda: |-
                      id(music_command_failed) = true;
                      ESP_LOGW("sonos_local", "Favorite preflight rejected: target unavailable or scope changed");
            - lambda: id(music_busy) = false;
            - script.execute: render_music
            - if:
                condition:
                  lambda: return id(music_favorite_pending);
                then:
                  - script.execute: music_favorite_timeout
                  - delay: 3s
                  - script.execute: refresh_music

  - id: music_favorite_timeout
    mode: restart
    then:
      - delay: 30s
      # Touch can intentionally defer reply publication. Take one fresh read
      # after any existing poll before declaring acknowledged playback unconfirmed.
      - script.wait: refresh_music
      - script.execute: refresh_music
      - script.wait: refresh_music
      - lambda: |-
          if (!id(music_favorite_pending)) return;
          id(music_favorite_pending) = false;
          id(music_command_failed) = true;
          ESP_LOGW("sonos_local", "Favorite playback not confirmed after final read-back; no command repeated");
      - script.execute: render_music
