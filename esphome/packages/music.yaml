# Direct LAN Sonos state and controls; station/group setup stays in Homey.
external_components:
  - source:
      type: local
      path: components
    components: [online_image, sonos_local]

sonos_local:

substitutions:
  homey_radio_flow_id: "0625c152-4c2f-42b5-9e4f-331a8096c48d"
  # Bootstrap addresses; topology resolves the current group coordinator.
  sonos_living_address: "http://192.168.0.190:1400"
  sonos_kitchen_address: "http://192.168.0.191:1400"

globals:
  - id: sonos
    type: energydeck_sonos::State
  - id: detail_tab
    type: int
    initial_value: "0"
  - id: music_was_playing
    type: bool
    initial_value: "false"
  - id: music_busy
    type: bool
    initial_value: "false"
  - id: music_command_failed
    type: bool
    initial_value: "false"
  - id: radio_pending
    type: bool
    initial_value: "false"
  - id: radio_failed
    type: bool
    initial_value: "false"
  - id: music_cover_key
    type: std::string
    initial_value: '""'
  - id: music_cover_requested
    type: std::string
    initial_value: '""'
  - id: music_cover_downloading
    type: bool
    initial_value: "false"

interval:
  - interval: 10s
    startup_delay: 8s
    then:
      - if:
          condition:
            lambda: return !id(music_busy);
          then:
            - script.execute: refresh_music

image:
  - platform: online_image
    id: music_cover
    http_request_id: homey_http
    url: "${sonos_living_address}/unavailable"
    format: JPEG
    type: RGB565
    resize: 62x62
    buffer_size: 8192
    update_interval: never
    # Deliberately no Authorization header: this is a speaker, not Homey.
    on_download_finished:
      then:
        - lvgl.image.update:
            id: music_cover_widget
            src: music_cover
        - lambda: |-
            id(music_cover_downloading) = false;
            if (!id(music_cover_key).empty() && id(music_cover_key) == id(music_cover_requested))
              lv_obj_clear_flag(id(music_cover_widget), LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(id(music_cover_widget), LV_OBJ_FLAG_HIDDEN);
    on_error:
      then:
        - lambda: |-
            id(music_cover_downloading) = false;
            id(music_cover_requested).clear();
            lv_obj_add_flag(id(music_cover_widget), LV_OBJ_FLAG_HIDDEN);

script:
  # A single bounded request at a time, with a yield between requests for LVGL.
  # Only music_control can populate this queue with writes.
  - id: sonos_requests
    mode: single
    then:
      - while:
          condition:
            lambda: return id(sonos).has_request();
          then:
            - http_request.post:
                url: !lambda return id(sonos).request().url();
                request_headers:
                  Content-Type: 'text/xml; charset="utf-8"'
                  SOAPAction: !lambda |-
                    // ESPHome header lambdas require a stable const char*.
                    static std::string header;
                    header = id(sonos).request().soap_action();
                    return header.c_str();
                body: !lambda return id(sonos).request().body();
                capture_response: true
                max_response_buffer_size: 65536
                on_response:
                  then:
                    - lambda: id(sonos).accept(response->status_code, body);
                on_error:
                  then:
                    - lambda: id(sonos).accept(0, "");
            - delay: 80ms

  - id: refresh_music
    mode: single
    then:
      - lambda: id(sonos).begin("${sonos_living_address}", "${sonos_kitchen_address}");
      - script.execute: sonos_requests
      - script.wait: sonos_requests
      - lambda: |-
          id(sonos).finish();
          const bool playing = id(sonos).any_playing();
          if (playing && !id(music_was_playing)) {
            id(detail_tab) = 1;
            id(select_detail_tab).execute();
          }
          if (playing) id(music_was_playing) = true;
          else if (id(sonos).all_stopped()) {
            if (id(music_was_playing) && id(detail_tab) == 1) {
              id(detail_tab) = 0;
              id(select_detail_tab).execute();
            }
            id(music_was_playing) = false;
          }
          // Only fresh grouped music, not unrelated TV playback, confirms Radio.
          if (id(sonos).radio_confirmed()) {
            id(radio_pending) = false;
            id(radio_failed) = false;
            id(radio_timeout).stop();
          }
          ESP_LOGD("sonos_local", "Direct Sonos: selected=%d grouped=%d known=%d playing=%d tv=%d",
            id(sonos).selected, id(sonos).grouped(), id(sonos).current().known(),
            id(sonos).current().playing, id(sonos).current().tv);
      - script.execute: render_music
      - script.execute: refresh_music_cover

  - id: switch_music_room
    then:
      - if:
          condition:
            lambda: return !id(music_busy);
          then:
            - lambda: id(sonos).switch_room();
            - script.execute: render_music
            - script.execute: refresh_music_cover

  - id: music_control
    mode: single
    parameters:
      action: int
    then:
      - if:
          condition:
            lambda: return !id(radio_pending) && !id(music_busy);
          then:
            - lambda: |-
                id(sonos).capture();
                id(music_busy) = true;
                id(music_command_failed) = false;
            - script.execute: render_music
            - delay: 100ms
            - script.execute: refresh_music
            - script.wait: refresh_music
            - if:
                condition:
                  lambda: return id(sonos).prepare_command(action);
                then:
                  - script.execute: sonos_requests
                  - script.wait: sonos_requests
                  - lambda: id(music_command_failed) = id(sonos).command_failed;
                  - delay: 2s
                  - script.execute: refresh_music
                  - script.wait: refresh_music
                  - lambda: |-
                      if (!id(sonos).command_confirmed()) id(music_command_failed) = true;
                else:
                  - lambda: id(music_command_failed) = true;
            - lambda: id(music_busy) = false;
            - script.execute: render_music

  - id: refresh_music_cover
    then:
      - lambda: |-
          const auto &room = id(sonos).current();
          const std::string path = room.known() && room.playing && !room.tv ? room.cover : "";
          const std::string key = path.empty() ? "" :
            path + "|" + room.title + "|" + room.artist + "|" + std::to_string(millis() / 60000);
          if (key != id(music_cover_key))
            lv_obj_add_flag(id(music_cover_widget), LV_OBJ_FLAG_HIDDEN);
          id(music_cover_key) = key;
          if (id(music_cover_downloading)) return;
          if (key == id(music_cover_requested)) {
            if (!path.empty()) lv_obj_clear_flag(id(music_cover_widget), LV_OBJ_FLAG_HIDDEN);
            return;
          }
          if (!path.empty()) {
            id(music_cover_requested) = key;
            id(music_cover_downloading) = true;
            id(music_cover).set_url(path);
            id(music_cover).update();
          }

  - id: select_detail_tab
    then:
      - lambda: |-
          lv_obj_t *cards[] = {id(gas_card), id(music_card), id(extra_card)};
          lv_obj_t *tabs[] = {id(gas_tab), id(music_tab), id(extra_tab)};
          const uint32_t accents[] = {0xFF3485, 0x45BD70, 0x5799E4};
          const uint32_t fills[] = {0x672B4B, 0x24583B, 0x294E77};
          for (int i = 0; i < 3; ++i) {
            const bool active = i == id(detail_tab);
            if (active) lv_obj_clear_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(cards[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(tabs[i], lv_color_hex(active ? fills[i] : 0x18231E), 0);
            lv_obj_set_style_border_color(tabs[i], lv_color_hex(active ? accents[i] : 0x34463C), 0);
            lv_obj_set_style_border_width(tabs[i], active ? 2 : 1, 0);
            lv_obj_set_style_text_color(lv_obj_get_child(tabs[i], 0),
              lv_color_hex(active ? 0xEEF6F0 : 0xA9B8AE), 0);
          }


  - id: render_music
    then:
      - lambda: |-
          const auto &s = id(sonos);
          const auto &room = s.current();
          const bool known = room.known();
          const bool playing = known && room.playing;
          const char *status = id(music_busy) ? "${music_button_wait}" :
            id(music_command_failed) ? "${music_control_failed}" :
            id(radio_pending) ? "${music_waiting}" :
            id(radio_failed) ? "${music_failed}" :
            !known ? "${music_offline}" :
            playing ? "${music_playing}" : "${music_paused}";
          lv_label_set_text(id(music_status), status);
          lv_obj_set_style_text_color(id(music_status),
            lv_color_hex(id(music_command_failed) || id(radio_failed) || !known ? 0xEA665F : 0x7FE0A2), 0);
          const char *heading = s.grouped() ? "${music_rooms}" :
            s.selected == 0 ? "${music_living_select}" : "${music_kitchen_select}";
          lv_label_set_text(lv_obj_get_child(id(music_room_select), 0), heading);
          if (id(music_busy)) lv_obj_add_state(id(music_room_select), LV_STATE_DISABLED);
          else lv_obj_clear_state(id(music_room_select), LV_STATE_DISABLED);
          lv_label_set_text(id(music_title), !known ? "${music_offline}" :
            playing && room.tv ? "${music_tv}" :
            playing && !room.title.empty() ? room.title.c_str() :
            playing ? "${music_playing}" : "${music_ready}");
          lv_label_set_text(id(music_artist), playing && !room.tv ? room.artist.c_str() : "");
          char a[12], b[12];
          for (int i = 0; i < 2; ++i) {
            char *v = i == 0 ? a : b;
            if (s.rooms[i].known() && s.rooms[i].volume >= 0) snprintf(v, 12, "%d%%", s.rooms[i].volume);
            else snprintf(v, 12, "--");
          }
          if (s.grouped()) lv_label_set_text_fmt(id(music_volume), "${music_volume_format}", a, b);
          else lv_label_set_text_fmt(id(music_volume), "${music_single_volume_format}", s.selected == 0 ? a : b);
          lv_label_set_text(lv_obj_get_child(id(music_play), 0),
            room.tv ? "${music_tv}" : playing ? "${music_pause}" : "${music_resume}");
          for (auto *button : {id(music_play), id(music_minus), id(music_plus)}) {
            const bool disabled = id(music_busy) || id(radio_pending) || !known ||
              (button == id(music_play) ? room.tv : !s.can_volume());
            if (disabled) lv_obj_add_state(button, LV_STATE_DISABLED);
            else lv_obj_clear_state(button, LV_STATE_DISABLED);
          }
      - lvgl.button.update:
          id: radio_button
          text: !lambda |-
            return std::string(id(radio_pending) ? "${music_button_wait}" : "${music_start}");
          bg_color: !lambda |-
            return lv_color_hex(id(radio_pending) ? 0x626A70 : 0x24764A);
          state:
            disabled: !lambda return id(radio_pending) || id(music_busy);

  - id: radio_timeout
    mode: restart
    then:
      - delay: 90s
      - lambda: |-
          id(radio_pending) = false;
          id(radio_failed) = true;
      - script.execute: render_music

  - id: start_radio
    mode: single
    then:
      - lambda: |-
          id(radio_pending) = true;
          id(radio_failed) = false;
      - script.execute: render_music
      - script.execute: radio_timeout
      # Let LVGL paint the waiting state before starting the HTTP request.
      - delay: 100ms
      - http_request.post:
          url: "${homey_address}/api/manager/flow/advancedflow/${homey_radio_flow_id}/trigger"
          request_headers:
            Authorization: "Bearer ${homey_token}"
            Content-Type: "application/json"
          body: "{}"
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code >= 200 && response->status_code < 300;
                  then:
                    - logger.log: "Radio Flow accepted; waiting for speaker status"
                    - delay: 2s
                    - script.execute: refresh_music
                  else:
                    - script.execute: radio_error
          on_error:
            then:
              - script.execute: radio_error

  - id: radio_error
    then:
      - script.stop: radio_timeout
      - lambda: |-
          id(radio_pending) = false;
          id(radio_failed) = true;
      - script.execute: render_music
