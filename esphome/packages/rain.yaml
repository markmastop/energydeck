# Location-based two-hour nowcast. Source: https://www.buienradar.nl
# https://www.buienradar.nl/overbuienradar/gratis-weerdata
esphome:
  on_boot:
    priority: -100
    then:
      - delay: 25s
      - script.execute: refresh_rain

interval:
  - interval: 60s
    then:
      - script.execute: render_rain_sunshine
  - interval: 5min
    startup_delay: 325s
    then:
      - script.execute: refresh_rain

globals:
  - id: rain_bar_times
    type: std::array<uint32_t, 24>
    initial_value: 'std::array<uint32_t, 24>{}'
  - id: rain_bar_count
    type: int
    initial_value: '0'

script:
  - id: render_rain_sunshine
    then:
      - lambda: |-
          auto *plot = id(rain_plot);
          const auto now = id(energydeck_time).now();
          // Report sunshine even when rain is dry/unavailable; zero is not missing.
          const float sun = now.is_valid() ?
            id(weather_sunshine).fraction(now.timestamp, now.timestamp + 7200, now.timestamp) : NAN;
          if (!std::isfinite(sun)) {
            esphome::ui_performance::set_text(id(weather_sunshine_label), "${weather_sunshine_unknown}");
          } else if (sun <= 0) {
            esphome::ui_performance::set_text(id(weather_sunshine_label), "${weather_sunshine_none}");
          } else {
            const int minutes = std::max(1, int(std::round(sun * 120)));
            esphome::ui_performance::set_text_fmt(id(weather_sunshine_label), "${weather_sunshine_minutes}", minutes);
          }
          esphome::ui_performance::set_style_text_color(id(weather_sunshine_label),
            lv_color_hex(std::isfinite(sun) ? 0xFFD35A : 0x82958A), LV_PART_MAIN);
          for (uint32_t i = 0; i < lv_obj_get_child_count(plot); i++) {
            auto *bar = lv_obj_get_child(plot, i);
            auto *cap = lv_obj_get_child(bar, 0);
            if (!cap) continue;
            lv_obj_add_flag(cap, LV_OBJ_FLAG_HIDDEN);
            if (!now.is_valid() || i >= static_cast<uint32_t>(id(rain_bar_count))) continue;
            const auto from = id(rain_bar_times)[i];
            if (from + 300 <= now.timestamp) continue;
            const float fraction = id(weather_sunshine).fraction(from, from + 300, now.timestamp);
            if (!std::isfinite(fraction) || fraction <= 0) continue;
            // A minimum 2 px mark makes brief sunshine visible without changing rain height.
            lv_obj_set_size(cap, std::max(2, int(std::round(6 * fraction))), 2);
            lv_obj_clear_flag(cap, LV_OBJ_FLAG_HIDDEN);
          }

  - id: rain_unavailable
    then:
      - lambda: |-
          id(rain_bar_count) = 0;
          lv_obj_add_flag(id(rain_plot), LV_OBJ_FLAG_HIDDEN);
          esphome::ui_performance::set_text(id(weather_rain_label), "${weather_rain_unknown}");
          esphome::ui_performance::set_style_text_color(id(weather_rain_label), lv_color_hex(0x82958A), LV_PART_MAIN);
          esphome::ui_performance::set_text(id(rain_scale), "");
          esphome::ui_performance::set_text(id(rain_times), "--:--");
          esphome::ui_performance::set_text(id(rain_end_time), "--:--");
          esphome::ui_performance::set_text(id(rain_mid_time), "--:--");

  - id: refresh_rain
    mode: single
    then:
      - background_http.get:
          # Current destination of the documented gps.buienradar.nl redirect.
          # Direct access avoids the host client's cross-host Host-header issue.
          # Buienradar redirects finer coordinates to two decimal places.
          # Match that grid upfront to avoid relative redirects on ESP-IDF,
          # while retaining HTTPS and sending no unnecessary precision.
          url: !lambda |-
            char url[160];
            snprintf(url, sizeof(url),
              "https://gadgets.buienradar.nl/data/raintext/?lat=%.2f&lon=%.2f",
              double(${energydeck_latitude}), double(${energydeck_longitude}));
            return std::string(url);
          capture_response: true
          max_response_buffer_size: 2048
          on_error:
            then:
              - script.execute: rain_unavailable
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    id(rain_unavailable).execute();
                    return;
                  }
                  float values[25] = {};
                  int minutes[25] = {};
                  int count = 0;
                  size_t offset = 0;
                  while (offset < body.size() && count < 25) {
                    const size_t end = body.find('\n', offset);
                    const std::string line = body.substr(offset, end == std::string::npos ? end : end - offset);
                    int code, hour, minute;
                    if (sscanf(line.c_str(), "%d|%d:%d", &code, &hour, &minute) != 3 ||
                        code < 0 || code > 255 || hour < 0 || hour > 23 || minute < 0 || minute > 59) {
                      id(rain_unavailable).execute();
                      return;
                    }
                    minutes[count] = hour * 60 + minute;
                    if (count > 0 && (minutes[count] - minutes[count - 1] + 1440) % 1440 != 5) {
                      id(rain_unavailable).execute();
                      return;
                    }
                    values[count++] = code == 0 ? 0.0f : powf(10.0f, (code - 109) / 32.0f);
                    if (end == std::string::npos) break;
                    offset = end + 1;
                  }
                  auto now = id(energydeck_time).now();
                  if (count < 24 || !now.is_valid()) {
                    id(rain_unavailable).execute();
                    return;
                  }
                  const int now_min = now.hour * 60 + now.minute;
                  const int delta = (minutes[0] - now_min + 2160) % 1440 - 720;
                  if (delta < -10 || delta > 10) {
                    id(rain_unavailable).execute();
                    ESP_LOGW("rain", "Ignoring stale or misaligned rain forecast");
                    return;
                  }
                  // Keep the active five-minute interval, discard completed history.
                  int first = 0;
                  while (first < count && delta + first * 5 <= -5) ++first;
                  const int visible = std::min(24, count - first);
                  for (int i = 0; i < visible; ++i) {
                    values[i] = values[i + first];
                    minutes[i] = minutes[i + first];
                  }
                  float maximum = 0.0f;
                  int first_rain = -1;
                  for (int i = 0; i < visible; i++) {
                    maximum = std::max(maximum, values[i]);
                    if (first_rain < 0 && values[i] >= 0.1f) first_rain = i;
                  }
                  lv_obj_t *plot = id(rain_plot);
                  if (lv_obj_get_child_count(plot) == 0) {
                    for (int i = 0; i < 24; i++) {
                      lv_obj_t *bar = lv_obj_create(plot);
                      lv_obj_remove_style_all(bar);
                      lv_obj_clear_flag(bar, LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_set_style_pad_all(bar, 0, 0);
                      lv_obj_clear_flag(bar, LV_OBJ_FLAG_SCROLLABLE);
                      auto *cap = lv_obj_create(bar);
                      lv_obj_remove_style_all(cap);
                      lv_obj_clear_flag(cap, LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_set_style_bg_color(cap, lv_color_hex(0xFFD35A), 0);
                      lv_obj_set_style_bg_opa(cap, LV_OPA_COVER, 0);
                      lv_obj_add_flag(cap, LV_OBJ_FLAG_HIDDEN);
                      // Keep both drawings inside their container: LVGL clips
                      // negative child positions even with overflow enabled.
                      auto *rain = lv_obj_create(bar);
                      lv_obj_remove_style_all(rain);
                      lv_obj_clear_flag(rain, LV_OBJ_FLAG_CLICKABLE);
                      lv_obj_set_y(rain, 2);
                      lv_obj_set_style_bg_opa(rain, LV_OPA_COVER, 0);
                      lv_obj_set_style_radius(rain, 1, 0);
                    }
                  }
                  for (int i = 0; i < 24; i++) {
                    auto *bar = lv_obj_get_child(plot, i);
                    if (i >= visible) {
                      lv_obj_add_flag(bar, LV_OBJ_FLAG_HIDDEN);
                      continue;
                    }
                    lv_obj_remove_flag(bar, LV_OBJ_FLAG_HIDDEN);
                    // Fixed intensity bands: light <2.5, moderate <7.5, heavy >=7.5 mm/h.
                    // Equal visual bands keep drizzle readable without rescaling each forecast.
                    const float value = values[i];
                    const float level = value < 2.5f ? value / 2.5f :
                      value < 7.5f ? 1.0f + (value - 2.5f) / 5.0f :
                      2.0f + std::min(1.0f, (value - 7.5f) / 12.5f);
                    const int height = value < 0.1f ? 1 :
                      std::max(2, std::min(28, (int)roundf(level * (28.0f / 3))));
                    esphome::ui_performance::set_pos(bar, i * 7, 28 - height);
                    esphome::ui_performance::set_size(bar, 6, height + 2);
                    auto *rain = lv_obj_get_child(bar, 1);
                    esphome::ui_performance::set_size(rain, 6, height);
                    esphome::ui_performance::set_style_bg_color(rain, lv_color_hex(values[i] >= 0.1f ? 0x3AA7D8 : 0x344F48), LV_PART_MAIN);
                  }
                  id(rain_bar_count) = visible;
                  const int64_t first_epoch = int64_t(now.timestamp) - now.second + (delta + first * 5) * 60;
                  for (int i = 0; i < visible; ++i) id(rain_bar_times)[i] = first_epoch + i * 300;
                  id(render_rain_sunshine).execute();
                  lv_obj_remove_flag(plot, LV_OBJ_FLAG_HIDDEN);
                  esphome::ui_performance::set_text(id(rain_scale), "${rain_intensity_scale}");
                  const int finish = (minutes[visible - 1] + 5) % 1440;
                  const int middle = (minutes[0] + ((finish - minutes[0] + 1440) % 1440) / 2) % 1440;
                  esphome::ui_performance::set_text_fmt(id(rain_mid_time), "%02d:%02d", middle / 60, middle % 60);
                  // Separate anchors: spaces in a right-aligned label moved the
                  // start time into the middle, making future rain look historical.
                  esphome::ui_performance::set_text_fmt(id(rain_times), "%02d:%02d", minutes[0] / 60, minutes[0] % 60);
                  esphome::ui_performance::set_text_fmt(id(rain_end_time), "%02d:%02d", finish / 60, finish % 60);
                  if (first_rain < 0) esphome::ui_performance::set_text(id(weather_rain_label), "${rain_dry_visible}");
                  else if (first_rain == 0) esphome::ui_performance::set_text(id(weather_rain_label), "${rain_now}");
                  else esphome::ui_performance::set_text_fmt(id(weather_rain_label), "${rain_at}",
                    minutes[first_rain] / 60, minutes[first_rain] % 60);
                  esphome::ui_performance::set_style_text_color(id(weather_rain_label),
                    lv_color_hex(first_rain < 0 ? 0x62D98A : 0x3AA7D8), LV_PART_MAIN);
                  ESP_LOGI("rain", "Loaded %d five-minute samples; peak %.2f mm/h", count, maximum);
