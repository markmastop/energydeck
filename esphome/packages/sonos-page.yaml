# Explicitly opened from the dashboard; polling never changes the active page.
id: sonos_page
bg_color: 0x0F1712
text_color: 0xEEF6F0
scrollable: false
widgets:
  - button:
      id: music_back
      bg_opa: TRANSP
      x: 14
      y: 154
      width: 44
      height: 44
      radius: 8
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 0
      text: "\uf060"
      text_font: montserrat_20
      on_click:
        - script.execute: close_music_page
  - label:
      x: 68
      y: 156
      text: "Sonos"
      text_font: montserrat_20
  - button:
      id: music_room_select
      bg_opa: TRANSP
      x: 68
      y: 183
      width: 398
      height: 26
      radius: 8
      pad_all: 0
      bg_color: 0x0F1712
      border_color: 0x34463C
      border_width: 0
      text: "${music_rooms}"
      text_font: montserrat_12
      on_click:
        - script.execute: switch_music_room
  - obj:
      id: music_cover_frame
      x: 14
      y: 216
      width: 272
      height: 272
      radius: 10
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 0
      pad_all: 0
      scrollable: false
      widgets:
        - label:
            id: music_cover_fallback
            align: CENTER
            text: "\uf001"
            text_font: montserrat_28
            text_color: 0x7FE0A2
        - image:
            id: music_cover_widget
            x: 0
            y: 0
            src: music_cover
            hidden: true
  - label:
      id: music_title
      x: 14
      y: 500
      width: 452
      height: 28
      text: "${music_ready}"
      text_font: montserrat_20
      text_align: LEFT
      long_mode: DOT
  - label:
      id: music_artist
      x: 14
      y: 534
      width: 330
      height: 20
      text: ""
      text_font: montserrat_16
      text_color: 0xA9B8AE
      text_align: LEFT
      long_mode: DOT
  - label:
      id: music_status
      x: 350
      y: 536
      width: 116
      height: 18
      text: "${music_loading}"
      text_font: montserrat_12
      text_color: 0x7FE0A2
      text_align: RIGHT
  - button:
      id: music_previous
      bg_opa: TRANSP
      x: 310
      y: 294
      width: 64
      height: 48
      radius: 8
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 0
      text: "\uf048"
      text_font: montserrat_20
      on_click:
        - script.execute:
            id: music_control
            action: 3
  - button:
      id: music_play
      x: 356
      y: 220
      width: 64
      height: 64
      radius: 32
      pad_all: 0
      bg_color: 0x24583B
      border_color: 0x45BD70
      border_width: 1
      text: "\uf04b"
      text_font: montserrat_24
      on_click:
        - script.execute:
            id: music_control
            action: 0
  - button:
      id: music_next
      bg_opa: TRANSP
      x: 402
      y: 294
      width: 64
      height: 48
      radius: 8
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 0
      text: "\uf051"
      text_font: montserrat_20
      on_click:
        - script.execute:
            id: music_control
            action: 4
  - button:
      id: music_minus
      bg_opa: TRANSP
      x: 310
      y: 398
      width: 64
      height: 44
      radius: 8
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 0
      text: "-"
      text_font: montserrat_24
      on_click:
        - script.execute:
            id: music_control
            action: 1
  - button:
      id: music_mute
      bg_opa: TRANSP
      x: 310
      y: 448
      width: 156
      height: 40
      radius: 8
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 0
      text: "${music_mute}"
      text_font: montserrat_14
      on_click:
        - script.execute:
            id: music_control
            action: 5
  - button:
      id: music_plus
      bg_opa: TRANSP
      x: 402
      y: 398
      width: 64
      height: 44
      radius: 8
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 0
      text: "+"
      text_font: montserrat_24
      on_click:
        - script.execute:
            id: music_control
            action: 2
  - label:
      id: music_volume
      x: 310
      y: 350
      width: 156
      height: 42
      text: "${music_volume_unknown}"
      text_font: montserrat_12
      text_color: 0xA9B8AE
      text_align: CENTER
  - label:
      x: 14
      y: 564
      text: "${music_favorites}"
      text_font: montserrat_18
  - button:
      id: music_favorites_refresh
      x: 426
      y: 552
      width: 40
      height: 40
      radius: 8
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 1
      text: "\uf021"
      text_font: montserrat_18
      on_click:
        - script.execute: refresh_music_favorites
  - obj:
      id: music_favorites_grid
      x: 14
      y: 602
      width: 452
      height: 184
      pad_all: 0
      border_width: 0
      bg_opa: TRANSP
      scrollbar_mode: AUTO
      scrollable: true
      scroll_elastic: false
      scroll_chain_hor: false
      scroll_chain_ver: false
  - label:
      id: music_favorites_status
      x: 24
      y: 668
      width: 432
      text: "${music_favorites_loading}"
      text_font: montserrat_14
      text_color: 0xA9B8AE
      text_align: CENTER
