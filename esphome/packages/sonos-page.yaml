# Explicitly opened from the dashboard; polling never changes the active page.
id: sonos_page
bg_color: 0x0F1712
text_color: 0xEEF6F0
scrollable: false
widgets:
  - button:
      id: music_back
      bg_opa: TRANSP
      x: 14
      y: 154
      width: 44
      height: 44
      radius: 8
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 0
      # Keep the empty label for shared button styling; draw the arrow without a font.
      widgets:
        - label:
            text: ""
            align: CENTER
        - line:
            x: 12
            y: 12
            clickable: false
            line_color: 0xEEF6F0
            line_width: 2
            points:
              - {x: 10, y: 0}
              - {x: 0, y: 10}
              - {x: 10, y: 20}
        - line:
            x: 12
            y: 12
            clickable: false
            line_color: 0xEEF6F0
            line_width: 2
            points:
              - {x: 0, y: 10}
              - {x: 20, y: 10}
      on_click:
        - script.execute: close_music_page
  - label:
      x: 68
      y: 156
      text: "Sonos"
      text_font: montserrat_20
  - button:
      id: music_room_select
      bg_opa: TRANSP
      x: 68
      y: 183
      width: 398
      height: 26
      radius: 8
      pad_all: 0
      bg_color: 0x0F1712
      border_color: 0x34463C
      border_width: 0
      text: "${music_rooms}"
      text_font: montserrat_12
      on_click:
        - script.execute: switch_music_room
  - obj:
      id: music_cover_frame
      x: 14
      y: 216
      width: 232
      height: 232
      radius: 10
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 0
      pad_all: 0
      scrollable: false
      widgets:
        - label:
            id: music_cover_fallback
            align: CENTER
            text: "\uf001"
            text_font: montserrat_28
            text_color: 0x7FE0A2
        - image:
            id: music_cover_widget
            x: 0
            y: 0
            src: music_cover
            hidden: true
  - label:
      id: music_title
      x: 14
      y: 460
      width: 452
      height: 26
      text: "${music_ready}"
      text_font: montserrat_20
      text_align: LEFT
      long_mode: DOT
  - label:
      id: music_artist
      x: 14
      y: 490
      width: 330
      height: 18
      text: ""
      text_font: montserrat_14
      text_color: 0xA9B8AE
      text_align: LEFT
      long_mode: DOT
  - label:
      id: music_next_caption
      x: 14
      y: 514
      width: 56
      height: 18
      text: "${music_up_next_label}"
      text_font: montserrat_12
      text_color: 0x7FE0A2
  - label:
      id: music_next_track
      x: 76
      y: 514
      width: 390
      height: 28
      text: ""
      text_font: montserrat_12
      text_color: 0xA9B8AE
      long_mode: DOT
  - label:
      id: music_status
      x: 350
      y: 490
      width: 116
      height: 18
      text: "${music_loading}"
      text_font: montserrat_12
      text_color: 0x7FE0A2
      text_align: RIGHT
  - button:
      id: music_previous
      bg_opa: TRANSP
      x: 266
      y: 230
      width: 52
      height: 64
      radius: 8
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 0
      text: "\uf048"
      text_font: montserrat_20
      on_click:
        - script.execute:
            id: music_control
            action: 3
  - button:
      id: music_play
      x: 330
      y: 230
      width: 64
      height: 64
      radius: 32
      pad_all: 0
      bg_color: 0x24583B
      border_color: 0x45BD70
      border_width: 1
      text: "\uf04b"
      text_font: montserrat_24
      on_click:
        - script.execute:
            id: music_control
            action: 0
  - button:
      id: music_next
      bg_opa: TRANSP
      x: 402
      y: 230
      width: 52
      height: 64
      radius: 8
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 0
      text: "\uf051"
      text_font: montserrat_20
      on_click:
        - script.execute:
            id: music_control
            action: 4
  - button:
      id: music_minus
      bg_opa: TRANSP
      x: 282
      y: 344
      width: 64
      height: 48
      radius: 8
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 0
      text: "\uF027"
      text_font: montserrat_24
      on_click:
        - script.execute:
            id: music_control
            action: 1
  - button:
      id: music_mute
      bg_opa: TRANSP
      x: 282
      y: 408
      width: 164
      height: 44
      radius: 8
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 0
      text: "${music_mute}"
      text_font: montserrat_14
      on_click:
        - script.execute:
            id: music_control
            action: 5
  - button:
      id: music_plus
      bg_opa: TRANSP
      x: 382
      y: 344
      width: 64
      height: 48
      radius: 8
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 0
      text: "\uF028"
      text_font: montserrat_24
      on_click:
        - script.execute:
            id: music_control
            action: 2
  - label:
      id: music_volume
      x: 266
      y: 316
      width: 188
      height: 22
      text: "${music_volume_unknown}"
      text_font: montserrat_12
      text_color: 0xA9B8AE
      text_align: CENTER
  - button:
      id: music_queue_tab
      x: 14
      y: 550
      width: 144
      height: 30
      radius: 6
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 1
      widgets:
        - label:
            x: 7
            y: 7
            width: 86
            text: "${music_queue_title}"
            text_font: montserrat_12
            text_color: 0xEEF6F0
        - label:
            id: music_queue_badge
            x: 96
            y: 5
            width: 44
            height: 20
            radius: 10
            bg_opa: COVER
            bg_color: 0x356347
            text: "--"
            text_align: CENTER
            text_font: montserrat_12
            text_color: 0xEEF6F0
      on_click:
        - lambda: id(music_content_tab) = 2;
        - script.execute: render_music
        - script.execute: refresh_music_queue
  - button:
      id: music_favorites_tab
      x: 318
      y: 550
      width: 144
      height: 30
      radius: 6
      pad_all: 0
      bg_color: 0x24583B
      border_color: 0x45BD70
      border_width: 2
      text: "${music_favorites_tab_title}"
      text_font: montserrat_14
      text_color: 0xEEF6F0
      on_click:
        - lambda: id(music_content_tab) = 0;
        - script.execute: render_music
        - script.execute: refresh_music_cover
        - script.execute: refresh_music_favorites
  - button:
      id: music_systems_tab
      x: 166
      y: 550
      width: 144
      height: 30
      radius: 6
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 1
      text: "${music_systems_tab_title}"
      text_font: montserrat_14
      text_color: 0xEEF6F0
      on_click:
        - lambda: id(music_content_tab) = 1;
        - script.execute: render_music
  - button:
      id: music_group_apply
      hidden: true
      x: 14
      y: 746
      width: 220
      height: 40
      radius: 6
      pad_all: 0
      bg_color: 0x24583B
      border_color: 0x45BD70
      border_width: 1
      text: "${music_group_apply}"
      text_font: montserrat_12
      text_color: 0xEEF6F0
      on_click:
        - script.execute: apply_music_group
  - button:
      id: music_group_reset
      hidden: true
      x: 242
      y: 746
      width: 224
      height: 40
      radius: 6
      pad_all: 0
      bg_color: 0x18231E
      border_color: 0x34463C
      border_width: 1
      text: "${music_group_cancel}"
      text_font: montserrat_14
      text_color: 0xEEF6F0
      on_click:
        - lambda: |-
            if (!id(music_busy) && !id(music_favorite_pending)) id(sonos).reset_group_edit();
        - script.execute: render_music
  - obj:
      id: music_systems_list
      hidden: true
      x: 14
      y: 586
      width: 452
      height: 200
      pad_all: 0
      border_width: 0
      bg_opa: TRANSP
      scrollbar_mode: AUTO
      scrollable: true
      scroll_elastic: false
      scroll_chain_hor: false
      scroll_chain_ver: false
  - obj:
      id: music_favorites_grid
      x: 14
      y: 586
      width: 452
      height: 200
      pad_all: 0
      border_width: 0
      bg_opa: TRANSP
      scrollbar_mode: AUTO
      scrollable: true
      scroll_elastic: false
      scroll_chain_hor: false
      scroll_chain_ver: false
  - label:
      id: music_favorites_status
      x: 24
      y: 654
      width: 432
      text: "${music_favorites_loading}"
      text_font: montserrat_14
      text_color: 0xA9B8AE
      text_align: CENTER

  - obj:
      id: music_queue_list
      hidden: true
      x: 14
      y: 586
      width: 452
      height: 200
      pad_all: 0
      border_width: 0
      bg_opa: TRANSP
      scrollbar_mode: AUTO
      scrollable: true
      scroll_elastic: false
      scroll_chain_hor: false
      scroll_chain_ver: false
