# Compact 24 px row pitch keeps all three states aligned beside the gauges.
- line:
    id: status_heat_0
    x: 1
    y: 0
    line_color: 0x46534B
    line_width: 2
    points:
      - {x: 10, y: 0}
      - {x: 11, y: 5}
      - {x: 15, y: 9}
      - {x: 16, y: 14}
      - {x: 13, y: 18}
      - {x: 7, y: 19}
      - {x: 3, y: 16}
      - {x: 2, y: 11}
      - {x: 6, y: 6}
      - {x: 6, y: 12}
      - {x: 10, y: 9}
      - {x: 10, y: 0}

